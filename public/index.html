       there could show a stale draft instead of the note you opened. */
    var draftKeyName = isEditing ? "" : scope + "-note-new";
    if (draftKeyName) {
      var draftHtml = loadDraft(draftKeyName);
      if (draftHtml) initialHtml = sanitizeNoteHtml(draftHtml);
    }
    var swatches = NOTE_COLORS.map(function (c) {
      return "<label class=\"note-color-swatch\" style=\"background:" + c.hex + ";\" title=\"" + c.id + "\">" +
        "<input type=\"radio\" name=\"color\" value=\"" + c.id + "\"" + (c.id === (initialColor || DEFAULT_NOTE_COLOR) ? " checked" : "") + "></label>";
    }).join("");
    var textColorBtns = NOTE_TEXT_COLORS.map(function (hex) {
      return "<button type=\"button\" style=\"color:" + hex + "; font-weight:700;\" title=\"Text color\" onmousedown=\"event.preventDefault(); document.execCommand('foreColor', false, '" + hex + "');\">A</button>";
    }).join("");
    var sizeBtns = NOTE_FONT_SIZES.map(function (s) {
      return "<button type=\"button\" style=\"font-size:" + s.px + ";\" title=\"Font size\" onmousedown=\"event.preventDefault(); document.execCommand('fontSize', false, '" + s.legacy + "');\">" + s.label + "</button>";
    }).join("");
    var formInner =
      "<div class=\"note-toolbar\">" +
      "<button type=\"button\" style=\"font-weight:700;\" title=\"Bold\" onmousedown=\"event.preventDefault(); document.execCommand('bold');\">B</button>" +
      "<button type=\"button\" style=\"font-style:italic;\" title=\"Italic\" onmousedown=\"event.preventDefault(); document.execCommand('italic');\">I</button>" +
      "<button type=\"button\" style=\"text-decoration:underline;\" title=\"Underline\" onmousedown=\"event.preventDefault(); document.execCommand('underline');\">U</button>" +
      "<button type=\"button\" title=\"Bullet list\" onmousedown=\"event.preventDefault(); document.execCommand('insertUnorderedList');\">•</button>" +
      "<button type=\"button\" title=\"Dash list\" onmousedown=\"event.preventDefault(); csdpToggleNoteList('" + editorId + "', 'list-dash');\">-</button>" +
      "<span class=\"note-toolbar-sep\"></span>" + sizeBtns +
      "<span class=\"note-toolbar-sep\"></span>" + textColorBtns +
      "<span class=\"note-toolbar-sep\"></span>" + swatches +
      "</div>" +
      "<div id=\"" + editorId + "\" class=\"note-editor-area\" contenteditable=\"true\"" + (draftKeyName ? " data-draft-key=\"" + draftKeyName + "\"" : "") + ">" + (initialHtml || "") + "</div>" +
      (scope === "general" ? "<div style=\"margin-top:8px;\"><span class=\"field-mini-label\">Urgency</span> " +
        "<select class=\"text-input\" style=\"display:inline-block; width:140px;\" name=\"urgency\">" +
        "<option value=\"Normal\"" + ((initialUrgency || "Normal") === "Normal" ? " selected" : "") + ">Normal</option>" +
        "<option value=\"Urgent\"" + (initialUrgency === "Urgent" ? " selected" : "") + ">Urgent</option>" +
        "</select></div>" : "") +
      "<div style=\"margin-top:8px; display:flex; gap:8px;\">" +
      "<button class=\"btn\" type=\"submit\">" + (isEditing ? "Save" : "Add note") + "</button>" +
      (isEditing ? "<button class=\"btn ghost\" type=\"button\" data-action=\"cancel-edit-note\">Cancel</button>" : "") +
      "</div>";
    return "<div class=\"note-editor-card\">" +
      "<form data-action=\"" + action + "\" data-id=\"" + (id || "") + "\" data-scope=\"" + scope + "\">" + formInner + "</form>" +
      "</div>";
  }

  function stickyNotesSectionHtml(scope, notes, addAction) {
    var addFormHtml = noteEditorFormHtml(addAction, null, scope, "", DEFAULT_NOTE_COLOR, false, "Normal");
    var me = getStoredIdentity();
    var cards = notes.slice().reverse().map(function (n) {
      if (ui.editingNoteId === n.id) {
        return noteEditorFormHtml("save-note-edit", n.id, scope, n.text, n.color, true, n.urgency);
      }
      var pendingDelete = isPending("note", n.id);
      var isUrgentGeneral = scope === "general" && n.urgency === "Urgent";
      var isSharedPrivate = scope === "private" && n.author !== me;
      var ackBy = n.ackBy || [];
      var isAuthor = n.author === me;
      var ackHtml = "";
      if ((isUrgentGeneral && !isAuthor) || isSharedPrivate) {
        ackHtml = ackBy.indexOf(me) !== -1
          ? "<span class=\"field-mini-label\">✓ You checked this</span>"
          : "<button data-action=\"ack-note\" data-id=\"" + n.id + "\" data-scope=\"" + scope + "\">Mark as checked</button>";
      }
      var seenByHtml = "";
      if (isUrgentGeneral && ackBy.length) {
        seenByHtml = "<div class=\"sticky-note-meta\">Seen by: " + ackBy.map(esc).join(", ") + "</div>";
      } else if (scope === "private" && isAuthor && (n.sharedWith || []).length) {
        /* Whoever shared it should be able to tell whether it's actually
           been checked, not just that it was shared. */
        var checkedSharedNames = (n.sharedWith || []).filter(function (name) { return ackBy.indexOf(name) !== -1; });
        seenByHtml = "<div class=\"sticky-note-meta\">Checked by: " + (checkedSharedNames.length ? checkedSharedNames.map(esc).join(", ") : "no one yet") + "</div>";
      }
      /* Private notes can be shared with specific teammates — only the
         author can change who it's shared with (matches the pattern used
         for assigning a file to a task: chips + a self-serve dropdown to
         add someone, two-click confirm to remove). Someone it was shared
         with just sees who shared it, not a control to reshare it further. */
      var sharedWithHtml = "";
      if (scope === "private" && isAuthor) {
        var sharedNames = n.sharedWith || [];
        var shareChips = sharedNames.map(function (name) {
          var pendingKey = n.id + "|" + name;
          var sharePending = isPending("note-share", pendingKey);
          return "<span class=\"va-tag\" style=\"background:" + vaTagColor(name) + ";\">" + esc(name) +
            "<button class=\"va-tag-remove" + (sharePending ? " confirming" : "") + "\" data-action=\"remove-note-share\" data-id=\"" + n.id + "\" data-va=\"" + esc(name) + "\" title=\"" + (sharePending ? "Click again to confirm" : "Stop sharing with " + esc(name)) + "\">" + (sharePending ? "Confirm?" : "×") + "</button></span>";
        }).join("");
        var shareControl;
        if (ui.sharingNoteId === n.id) {
          var availableToShare = state.vas.filter(function (v) { return v.name !== me && sharedNames.indexOf(v.name) === -1; });
          var shareOpts = "<option value=\"\" disabled selected>Share with…</option>" + availableToShare.map(function (v) {
            return "<option value=\"" + esc(v.name) + "\">" + esc(v.name) + "</option>";
          }).join("");
          shareControl = "<select class=\"text-input va-add-select\" data-action-change=\"add-note-share\" data-id=\"" + n.id + "\">" + shareOpts + "</select>" +
            "<button class=\"link-btn\" data-action=\"cancel-add-note-share\">Cancel</button>";
        } else {
          shareControl = "<button class=\"add-va-btn\" data-action=\"toggle-add-note-share\" data-id=\"" + n.id + "\" title=\"Share with a specific teammate\">+</button>";
        }
        sharedWithHtml = "<div class=\"sticky-note-meta\" style=\"margin-top:6px;\"><span class=\"field-mini-label\">Shared with</span> <span class=\"va-group\">" +
          (shareChips || "<span style=\"color:var(--ink-faint); font-size:0.78rem;\">Only you</span>") + shareControl + "</span></div>";
      }
      return "<div class=\"sticky-note\" style=\"background:" + noteColorHex(n.color) + ";\">" +
        (isUrgentGeneral ? "<div class=\"urgent-pill\">Urgent</div>" : "") +
        "<div class=\"sticky-note-text\">" + (n.text || "") + "</div>" +
        "<div class=\"sticky-note-meta\">" +
        (scope === "general" ? esc(n.author || "Unnamed") + " · " : (scope === "private" && !isAuthor ? "Shared by " + esc(n.author || "Unnamed") + " · " : "")) +
        fmtDateTime(n.createdAt) + "</div>" +
        seenByHtml + sharedWithHtml +
        "<div class=\"sticky-note-actions\">" +
        (isAuthor ? "<button data-action=\"edit-note\" data-id=\"" + n.id + "\" data-scope=\"" + scope + "\">Edit</button>" +
          "<button class=\"" + (pendingDelete ? "confirming" : "") + "\" data-action=\"remove-note\" data-id=\"" + n.id + "\" data-scope=\"" + scope + "\">" + (pendingDelete ? "Confirm?" : "Delete") + "</button>" : "") +
        ackHtml +
        "</div>" +
        "</div>";
    }).join("");
    return addFormHtml +
      (cards ? "<div class=\"sticky-grid\">" + cards + "</div>" :
        emptyState(scope === "private" ? "No private notes yet — only you can see this page." : "No notes yet."));
  }

  /* ---------- Approvals ---------- */
  var ACCESS_REQUEST_STATUS_PILL = { pending: "orange", approved: "green", declined: "red", fulfilled: "neutral" };
  var ACCESS_REQUEST_STATUS_LABEL = { pending: "Pending", approved: "Approved", declined: "Declined", fulfilled: "Done" };
  function accessRequestRowHtml(r, showApproveDecline) {
    var me = getStoredIdentity();
    var school = schoolById(r.schoolId);
    var sd = school ? ensureSchoolData(school.id) : null;
    var statusLabel = ACCESS_REQUEST_STATUS_LABEL[r.status] || r.status;
    var isMine = r.requestedBy === me;
    /* Anyone can clear out their own request once it's no longer pending;
       whoever manages that school can also clear its resolved history —
       but a still-pending one has to actually be decided first, not just
       deleted out from under the requester. */
    var canRemoveRow = isMine || (r.status !== "pending" && canDeleteSchoolRecords(r.schoolId));
    var removeLabel = (r.status === "pending" && isMine) ? "Cancel" : "Delete";
    /* Admins/Owner see every school's requests as a safety net (same as
       everywhere else in the app), not just the assigned VA — showing the
       school and who it's actually assigned to right up front makes it
       obvious why a request for someone else's school still showed up. */
    var schoolLineHtml = "<div class=\"row-meta\"><span class=\"pill neutral\">" + esc(school ? school.name : "Unknown school") + "</span>" +
      (sd && sd.vaAssigned ? " Assigned to " + esc(sd.vaAssigned) : " Unassigned") + " · " + fmtDateTime(r.createdAt) + "</div>";
    var resolvedLineHtml = "";
    if (r.resolvedBy) {
      var resolvedVerb = r.status === "fulfilled" ? "Approved and removed" : (r.status === "declined" ? "Declined" : statusLabel);
      resolvedLineHtml = "<div class=\"row-meta\">" + esc(resolvedVerb) + " by " + esc(r.resolvedBy) + (r.resolvedAt ? " · " + fmtDateTime(r.resolvedAt) : "") + "</div>";
    }
    return "<div class=\"row-item\" style=\"align-items:flex-start;\"><div class=\"row-main\">" +
      /* The record being requested, and who's asking, both up front — not
         buried in a second line. */
      "<div class=\"row-title\">" + esc(r.requestedBy) + " wants to <strong>remove</strong>: " + esc(r.label) + "</div>" +
      schoolLineHtml +
      "<div class=\"row-meta\">Reason: " + esc(r.reason) + "</div>" +
      resolvedLineHtml +
      "</div>" +
      (showApproveDecline
        ? "<div style=\"display:flex; gap:8px;\">" +
          "<button class=\"btn small\" style=\"background:var(--done); color:#fff;\" data-action=\"approve-access-request\" data-id=\"" + r.id + "\" title=\"Approve\">✅ Approve</button>" +
          "<button class=\"btn small\" style=\"background:var(--danger); color:#fff;\" data-action=\"decline-access-request\" data-id=\"" + r.id + "\" title=\"Decline\">❌ Decline</button>" +
          "</div>"
        : "<span class=\"pill " + (ACCESS_REQUEST_STATUS_PILL[r.status] || "neutral") + "\">" + esc(statusLabel) + "</span>" +
          (canRemoveRow ? "<button class=\"link-btn danger\" data-action=\"delete-access-request\" data-id=\"" + r.id + "\" style=\"margin-left:8px;\">" + removeLabel + "</button>" : "")) +
      "</div>";
  }
  function approvalsPageHtml() {
    var me = getStoredIdentity();
    var all = state.accessRequests || [];
    var forMe = all.filter(function (r) { return canDeleteSchoolRecords(r.schoolId); })
      .sort(function (a, b) {
        if ((a.status === "pending") !== (b.status === "pending")) return a.status === "pending" ? -1 : 1;
        return (b.createdAt || "").localeCompare(a.createdAt || "");
      });
    var forMePending = forMe.filter(function (r) { return r.status === "pending"; }).length;
    var mine = all.filter(function (r) { return r.requestedBy === me; })
      .sort(function (a, b) { return (b.createdAt || "").localeCompare(a.createdAt || ""); });
    return "<div class=\"page-header\"><div><div class=\"page-title display\">Approvals</div></div></div>" +
      "<div class=\"card\"><div class=\"card-head\"><div class=\"card-title\">Requests for your schools" + (forMePending ? " <span class=\"count-chip\">" + forMePending + "</span>" : "") + "</div></div>" +
      "<div class=\"card-body\"><div class=\"row-list\">" +
      (forMe.length ? forMe.map(function (r) { return accessRequestRowHtml(r, r.status === "pending"); }).join("") : emptyState("No requests for schools you manage.")) +
      "</div></div></div>" +
      "<div class=\"card\"><div class=\"card-head\"><div class=\"card-title\">Your requests</div></div>" +
      "<div class=\"card-body\"><div class=\"row-list\">" +
      (mine.length ? mine.map(function (r) { return accessRequestRowHtml(r, false); }).join("") : emptyState("You haven't requested access to anything.")) +
      "</div></div></div>";
  }

  /* ---------- EOD Reports ---------- */
  /* Every line here uses the exact same font/size on purpose (no bold
     title, no smaller meta text) — this view is meant to be copied
     straight into the official EOD report as plain, uniform text. Now
     that everyone can browse everyone's reports, a small author label
     sits above the copyable text (not part of it, so copy-pasting the
     report itself is unaffected). */
  function eodNoteEntryHtml(e) {
    var taskLines = (e.tasks || []).map(function (t) { return "<div class=\"eod-note-line\">" + esc(t) + "</div>"; }).join("");
    var line1 = "EOD " + esc(fmtEodDate(e.date)) + (e.totalHours ? " (TOTAL HOURS: " + esc(e.totalHours) + ")" : "");
    var line2 = (e.timeIn ? "IN- " + esc(fmtTime12(e.timeIn)) : "") + (e.breakStart ? " BREAK- " + esc(fmtTime12(e.breakStart)) : "");
    var line3 = (e.breakEnd ? "RESUME- " + esc(fmtTime12(e.breakEnd)) : "") + (e.timeOut ? " - OUT- " + esc(fmtTime12(e.timeOut)) : "");
    return "<div class=\"card eod-note-card\" style=\"margin-bottom:14px;\">" +
      "<div style=\"padding:10px 16px 0; font-size:0.78rem; color:var(--ink-faint); font-weight:600;\">" + esc(e.author || "Unnamed") + "</div>" +
      "<div class=\"card-body\">" +
      "<div class=\"eod-note-line\">" + line1 + "</div>" +
      (line2.trim() ? "<div class=\"eod-note-line\">" + line2.trim() + "</div>" : "") +
      (line3.trim() ? "<div class=\"eod-note-line\">" + line3.trim() + "</div>" : "") +
      taskLines +
      "</div></div>";
  }
  function eodTableHtml(list) {
    var rows = list.map(function (e) {
      return "<tr>" +
        "<td>" + esc(e.author || "Unnamed") + "</td>" +
        "<td>" + esc(fmtEodDate(e.date)) + "</td>" +
        "<td>" + esc(fmtTime12(e.timeIn)) + "</td>" +
        "<td>" + esc(fmtTime12(e.breakStart)) + "</td>" +
        "<td>" + esc(fmtTime12(e.breakEnd)) + "</td>" +
        "<td>" + esc(fmtTime12(e.timeOut)) + "</td>" +
        "<td>" + esc(e.totalHours || "") + "</td>" +
        "<td class=\"wrap\">" + (e.tasks || []).map(esc).join("; ") + "</td>" +
        "</tr>";
    }).join("");
    return "<div class=\"card\"><div class=\"card-body\"><div class=\"table-scroll\">" +
      "<table class=\"data-table\"><thead><tr>" +
      "<th>VA</th><th>Date</th><th>In</th><th>Break</th><th>Resume</th><th>Out</th><th>Total Hours</th><th>Tasks</th>" +
      "</tr></thead><tbody>" +
      (rows || "<tr><td colspan=\"8\">" + emptyState("No EOD reports yet.") + "</td></tr>") +
      "</tbody></table></div></div></div>";
  }
  function eodPageHtml() {
    /* Everyone can see everyone's EOD reports now — the team-member filter
       below is available to all, not just the superadmin. */
    var vaOptsFilter = state.vas.slice().sort(function (a, b) { return a.name.localeCompare(b.name); })
      .map(function (v) { return "<option value=\"" + esc(v.name) + "\"" + (ui.eodFilterAuthor === v.name ? " selected" : "") + ">" + esc(v.name) + "</option>"; }).join("");
    var currentMonth = todayIsoDate().slice(0, 7);
    var showArchive = !!ui.eodShowArchive;
    /* Every distinct "YYYY-MM" that actually has an entry, excluding the
       current month on this side, newest first — the Archive is where
       past months live once the new month starts, so the main page stays
       just this month instead of piling up every entry ever logged. */
    var monthSet = {};
    state.eodReports.forEach(function (e) { if (e.date && e.date.slice(0, 7) !== currentMonth) monthSet[e.date.slice(0, 7)] = true; });
    var months = Object.keys(monthSet).sort().reverse();
    var monthOptsFilter = months.map(function (ym) {
      return "<option value=\"" + ym + "\"" + (ui.eodFilterMonth === ym ? " selected" : "") + ">" + esc(fmtMonthLabel(ym)) + "</option>";
    }).join("");

    var list = state.eodReports.slice().reverse().filter(function (e) {
      if (ui.eodFilterAuthor && e.author !== ui.eodFilterAuthor) return false;
      var entryMonth = (e.date || "").slice(0, 7);
      if (showArchive) {
        if (entryMonth === currentMonth) return false;
        if (ui.eodFilterMonth && entryMonth !== ui.eodFilterMonth) return false;
      } else if (entryMonth !== currentMonth) {
        return false;
      }
      return true;
    });
    var totalMinutes = list.reduce(function (sum, e) { return sum + parseHoursMinutesToMinutes(e.totalHours); }, 0);
    var totalsHtml = "<div class=\"page-sub\" style=\"margin:-4px 0 14px;\">Total Hours" +
      (showArchive
        ? (ui.eodFilterMonth ? " for " + esc(fmtMonthLabel(ui.eodFilterMonth)) : "")
        : " for " + esc(fmtMonthLabel(currentMonth))) +
      (ui.eodFilterAuthor ? " (" + esc(ui.eodFilterAuthor) + ")" : "") +
      ": <strong>" + esc(formatMinutesAsHours(totalMinutes) || "0:00") + "</strong>" +
      (list.length ? " across " + list.length + " " + (list.length === 1 ? "entry" : "entries") : "") + "</div>";
    var viewMode = ui.eodViewMode === "table" ? "table" : "notes";
    var content = viewMode === "table" ? eodTableHtml(list) : (list.map(eodNoteEntryHtml).join("") || emptyState(showArchive ? "No archived reports match these filters." : "No EOD reports yet for " + fmtMonthLabel(currentMonth) + "."));

    var addFormHtml = showArchive ? "" : "<div class=\"card\"><div class=\"card-body\">" +
      "<form data-action=\"add-eod\">" +
      "<div class=\"add-row-form\">" +
      "<span class=\"field-mini-label\">Date</span><input class=\"text-input\" type=\"date\" name=\"date\" data-draft-key=\"eod-new-date\" value=\"" + esc(loadDraft("eod-new-date") || todayIsoDate()) + "\" style=\"max-width:160px;\" required>" +
      "<span class=\"field-mini-label\">Time in</span><input class=\"text-input\" type=\"time\" name=\"timeIn\" data-draft-key=\"eod-new-timeIn\" value=\"" + esc(loadDraft("eod-new-timeIn")) + "\" style=\"max-width:130px;\">" +
      "<span class=\"field-mini-label\">Break</span><input class=\"text-input\" type=\"time\" name=\"breakStart\" data-draft-key=\"eod-new-breakStart\" value=\"" + esc(loadDraft("eod-new-breakStart")) + "\" style=\"max-width:130px;\">" +
      "<span class=\"field-mini-label\">Resume</span><input class=\"text-input\" type=\"time\" name=\"breakEnd\" data-draft-key=\"eod-new-breakEnd\" value=\"" + esc(loadDraft("eod-new-breakEnd")) + "\" style=\"max-width:130px;\">" +
      "<span class=\"field-mini-label\">Time out</span><input class=\"text-input\" type=\"time\" name=\"timeOut\" data-draft-key=\"eod-new-timeOut\" value=\"" + esc(loadDraft("eod-new-timeOut")) + "\" style=\"max-width:130px;\">" +
      "</div>" +
      "<div class=\"field-mini-label\" style=\"margin-top:6px;\">Total hours are calculated automatically from Time in/out, minus your break.</div>" +
      "<textarea class=\"text-input\" name=\"tasks\" placeholder=\"What did you work on today? One item per line…\" data-draft-key=\"eod-new-tasks\" style=\"margin-top:8px; min-height:90px; width:100%; box-sizing:border-box;\" required>" + esc(loadDraft("eod-new-tasks")) + "</textarea>" +
      "<button class=\"btn\" type=\"submit\" style=\"margin-top:8px;\">Add EOD report</button>" +
      "</form></div></div>";

    return "<div class=\"page-header\"><div><div class=\"page-title display\">EOD Reports</div></div>" +
      "<button class=\"btn ghost\" data-action=\"toggle-eod-archive\">" + (showArchive ? "← Back to this month" : "View Archive (previous months)") + "</button>" +
      "</div>" +
      addFormHtml +
      "<div class=\"filters-row\">" +
      "<select class=\"text-input\" data-action-change=\"filter-eod\"><option value=\"\">All team members</option>" + vaOptsFilter + "</select>" +
      (showArchive ? "<select class=\"text-input\" data-action-change=\"filter-eod-month\"><option value=\"\">All months</option>" + monthOptsFilter + "</select>" : "") +
      "<div class=\"view-toggle\">" +
      "<button class=\"" + (viewMode === "notes" ? "active" : "") + "\" data-action=\"set-eod-view\" data-mode=\"notes\">Notes</button>" +
      "<button class=\"" + (viewMode === "table" ? "active" : "") + "\" data-action=\"set-eod-view\" data-mode=\"table\">Table</button>" +
      "</div>" +
      "</div>" +
      totalsHtml +
      content;
  }

  /* ============ navigation ============ */
  function goTo(view) {
    ui.view = view;
    ui.sidebarOpen = false;
    ui.templateEditorOpen = false;
    ui.pendingDelete = null;
    saveStoredView();
  }

  /* ============ event handling ============ */
  function onClick(e) {
    var t = e.target.closest("[data-action]");
    if (!t) return;
    var action = t.getAttribute("data-action");
    switch (action) {
      case "nav-school":
        goTo({ type: "school", id: t.getAttribute("data-id") });
        render(); break;
      case "nav-school-email":
        goTo({ type: "school", id: t.getAttribute("data-id") });
        render();
        (function () {
          var el = document.getElementById("email-tracker-card");
          if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
        })();
        break;
      case "nav-view":
        goTo({ type: t.getAttribute("data-view") });
        render(); break;
      case "nav-issues-status":
        ui.issueFilters = { school: "", type: "", status: t.getAttribute("data-status"), va: "" };
        goTo({ type: "issues" });
        render(); break;
      case "toggle-sidebar": ui.sidebarOpen = !ui.sidebarOpen; render(); break;
      case "toggle-sidebar-collapse":
        ui.sidebarCollapsed = !ui.sidebarCollapsed;
        saveSidebarCollapsed(ui.sidebarCollapsed);
        render(); break;
      case "toggle-theme":
        setStoredTheme(currentEffectiveTheme() === "dark" ? "light" : "dark");
        applyTheme();
        render(); break;
      case "pick-identity":
        handleIdentityPick(t.getAttribute("data-name"));
        break;
      case "back-to-identity-picker":
        showIdentityPicker();
        break;
      case "close-sidebar": ui.sidebarOpen = false; render(); break;
      case "toggle-add-school": ui.addSchoolOpen = !ui.addSchoolOpen; render(); break;
      case "toggle-template-editor": ui.templateEditorOpen = !ui.templateEditorOpen; render(); break;
      case "toggle-task-category-editor": ui.taskCategoryEditorOpen = !ui.taskCategoryEditorOpen; render(); break;
      case "sign-task":
        (function () {
          var sd = ensureSchoolData(t.getAttribute("data-school"));
          var task = sd.tasks.find(function (x) { return x.id === t.getAttribute("data-id"); });
          var me = getStoredIdentity();
          if (task && me) {
            var names = Array.isArray(task.vaAssigned) ? task.vaAssigned : [];
            if (names.indexOf(me) === -1) names.push(me);
            task.vaAssigned = names;
          }
          persist();
        })(); break;
      case "toggle-add-va-for-task": ui.addingVaForTask = t.getAttribute("data-id"); render(); break;
      case "cancel-add-va-for-task": ui.addingVaForTask = null; render(); break;
      case "toggle-add-note-share": ui.sharingNoteId = t.getAttribute("data-id"); render(); break;
      case "cancel-request-access": ui.requestingAccessFor = null; render(); break;
      case "approve-access-request":
        (function () {
          var reqObj = (state.accessRequests || []).find(function (x) { return x.id === t.getAttribute("data-id"); });
          if (!reqObj || !canDeleteSchoolRecords(reqObj.schoolId)) return;
          /* Approving performs the removal immediately — there's no
             separate step where the requester comes back and clicks
             delete again. */
          performApprovedRemoval(reqObj);
          reqObj.status = "fulfilled";
          reqObj.resolvedBy = getStoredIdentity();
          reqObj.resolvedAt = new Date().toISOString();
          persist();
        })(); break;
      case "decline-access-request":
        (function () {
          var reqObj = (state.accessRequests || []).find(function (x) { return x.id === t.getAttribute("data-id"); });
          if (!reqObj || !canDeleteSchoolRecords(reqObj.schoolId)) return;
          reqObj.status = "declined";
          reqObj.resolvedBy = getStoredIdentity();
          reqObj.resolvedAt = new Date().toISOString();
          persist();
        })(); break;
      case "delete-access-request":
        (function () {
          var reqId = t.getAttribute("data-id");
          var reqObj = (state.accessRequests || []).find(function (x) { return x.id === reqId; });
          if (!reqObj) return;
          var isMine = reqObj.requestedBy === getStoredIdentity();
          var canManage = reqObj.status !== "pending" && canDeleteSchoolRecords(reqObj.schoolId);
          if (!isMine && !canManage) return;
          state.accessRequests = state.accessRequests.filter(function (x) { return x.id !== reqId; });
          persist();
        })(); break;
      case "cancel-add-note-share": ui.sharingNoteId = null; render(); break;
      case "remove-note-share":
        (function () {
          var noteId = t.getAttribute("data-id");
          var va = t.getAttribute("data-va");
          requestDelete("note-share", noteId + "|" + va, function () {
            var note = state.privateNotes.find(function (x) { return x.id === noteId; });
            if (note) note.sharedWith = (note.sharedWith || []).filter(function (n) { return n !== va; });
          });
        })(); break;
      case "remove-va-from-task":
        (function () {
          var taskId = t.getAttribute("data-id");
          var va = t.getAttribute("data-va");
          var schoolId = t.getAttribute("data-school");
          if (!canDeleteSchoolRecords(schoolId) && va !== getStoredIdentity()) {
            ui.requestingAccessFor = "va-signature|" + taskId + "|" + va;
            render();
            return;
          }
          requestDelete("va-from-task", taskId + "|" + va, function () {
            var sd = ensureSchoolData(schoolId);
            var task = sd.tasks.find(function (x) { return x.id === taskId; });
            if (task) {
              var names = Array.isArray(task.vaAssigned) ? task.vaAssigned : [];
              task.vaAssigned = names.filter(function (n) { return n !== va; });
            }
          });
        })(); break;
      case "sign-issue-fixed":
        (function () {
          var issue = state.issues.find(function (x) { return x.id === t.getAttribute("data-id"); });
          var me = getStoredIdentity();
          if (issue && me && !issue.fixedBy) {
            issue.fixedBy = me;
            issue.status = "Resolved";
          }
          persist();
        })(); break;
      case "clear-issue-fixed-by":
        requestDelete("issue-fixedby", t.getAttribute("data-id"), function () {
          var issue = state.issues.find(function (x) { return x.id === t.getAttribute("data-id"); });
          if (issue) delete issue.fixedBy;
        }); break;
      case "remove-task-category":
        requestDelete("task-category", t.getAttribute("data-id"), function () {
          state.taskCategories = state.taskCategories.filter(function (x) { return x.id !== t.getAttribute("data-id"); });
        }); break;
      case "remove-contact-row":
        (function () {
          var groupId = t.getAttribute("data-group"), rowId = t.getAttribute("data-id");
          requestDelete("contact-row", rowId, function () {
            var g = state.contactGroups.find(function (x) { return x.id === groupId; });
            if (g) g.rows = g.rows.filter(function (r) { return r.id !== rowId; });
          });
        })(); break;
      case "remove-contact-group":
        requestDelete("contact-group", t.getAttribute("data-id"), function () {
          state.contactGroups = state.contactGroups.filter(function (x) { return x.id !== t.getAttribute("data-id"); });
        }); break;
      case "move-task-category":
        (function () {
          var id = t.getAttribute("data-id"), dir = t.getAttribute("data-dir");
          var idx = state.taskCategories.findIndex(function (x) { return x.id === id; });

      case "add-private-note":
        (function () {
          var editorEl = form.querySelector("[contenteditable]");
          syncNoteCheckboxAttrs(editorEl);
          var html = sanitizeNoteHtml(editorEl ? editorEl.innerHTML : "");
          if (!html || html === "<br>") return;
          var color = (fd.get("color") || DEFAULT_NOTE_COLOR).toString();
          state.privateNotes.push({ id: uid("note"), text: html, author: getStoredIdentity(), color: color, sharedWith: [], ackBy: [], createdAt: new Date().toISOString() });
          saveDraft("private-note-new", "");
          persist();
        })(); break;
      case "save-note-edit":
        (function () {
          var id = form.getAttribute("data-id");
          var scope = form.getAttribute("data-scope");
          var editorEl = form.querySelector("[contenteditable]");
          syncNoteCheckboxAttrs(editorEl);
          var html = sanitizeNoteHtml(editorEl ? editorEl.innerHTML : "");
          var color = (fd.get("color") || DEFAULT_NOTE_COLOR).toString();
          var urgency = (fd.get("urgency") || "Normal").toString();
          var arr = scope === "private" ? state.privateNotes : state.generalNotes;
          var note = arr.find(function (x) { return x.id === id; });
          if (note && note.author === getStoredIdentity()) {
            note.text = html; note.color = color; if (scope === "general") note.urgency = urgency;
          }
          ui.editingNoteId = null;
          persist();
        })(); break;
      case "add-eod":
        (function () {
          var tasksRaw = (fd.get("tasks") || "").toString();
          var tasks = tasksRaw.split("\n").map(function (s) { return s.trim(); }).filter(function (s) { return s; });
          var timeIn = (fd.get("timeIn") || "").toString();
          var timeOut = (fd.get("timeOut") || "").toString();
          var breakStart = (fd.get("breakStart") || "").toString();
          var breakEnd = (fd.get("breakEnd") || "").toString();
          var entry = {
            id: uid("eod"),
            author: getStoredIdentity(),
            date: (fd.get("date") || "").toString(),
            timeIn: timeIn,
            timeOut: timeOut,
            breakStart: breakStart,
            breakEnd: breakEnd,
            totalHours: computeEodTotalHours(timeIn, timeOut, breakStart, breakEnd),
            tasks: tasks,
            createdAt: new Date().toISOString()
          };
          state.eodReports.push(entry);
          ["eod-new-date", "eod-new-timeIn", "eod-new-breakStart", "eod-new-breakEnd", "eod-new-timeOut", "eod-new-tasks"].forEach(function (k) { saveDraft(k, ""); });
          persist();
        })(); break;
      case "submit-access-request":
        (function () {
          var reason = (fd.get("reason") || "").toString().trim();
          if (!reason) return;
          var recordKind = (fd.get("recordKind") || "").toString();
          var type = ACCESS_REQUEST_TYPE_FOR_KIND[recordKind] || recordKind;
          state.accessRequests = state.accessRequests || [];
          state.accessRequests.push({
            id: uid("req"),
            type: type,
            recordKind: recordKind,
            schoolId: (fd.get("schoolId") || "").toString(),
            targetId: (fd.get("targetId") || "").toString(),
            label: (fd.get("label") || "").toString(),
            reason: reason,
            requestedBy: getStoredIdentity(),
            status: "pending",
            createdAt: new Date().toISOString()
          });
          ui.requestingAccessFor = null;
          persist();
        })(); break;
      case "add-issue":
        (function () {
          var typeId = (fd.get("type") || "").toString();
          var typeObj = issueTypeById(typeId);
          var statusOpts = typeObj ? typeObj.statusOptions : NEW_ISSUE_TYPE_STATUS_OPTIONS;
          /* Which fields this form actually collected depends on the type
             picked above — Insurance & DOB Correction and Software issue
             each have their own shape, everything else uses the generic
             +Field pool. */
          if (typeObj && typeObj.customCorrection) {
            var studentName = (fd.get("studentName") || "").toString().trim();
            if (!studentName) return;
            state.issues.push({
              id: uid("issue"),
              type: typeId,
              studentName: studentName,
              schoolId: "",
              grade: "",
              needsNameCorrection: !!fd.get("needsNameCorrection"),
              needsDobCorrection: !!fd.get("needsDobCorrection"),
              needsInsuranceCorrection: !!fd.get("needsInsuranceCorrection"),
              dob: "",
              insuranceNumber: "",
              correctInfo: "",
              remarks: "",
              reportedBy: getStoredIdentity(),
              verified: false,
              status: statusOpts[0] || "Pending",
              createdAt: new Date().toISOString()
            });
            ui.newIssueType = null;
            persist();
            return;
          }
          if (typeObj && typeObj.simpleIssueTable) {
            var simpleDescription = (fd.get("description") || "").toString().trim();
            if (!simpleDescription) return;
            state.issues.push({
              id: uid("issue"),
              type: typeId,
              description: simpleDescription,
              remarks: "",
              reportedBy: getStoredIdentity(),
              status: statusOpts[0] || "Pending",
              createdAt: new Date().toISOString()
            });
            ui.newIssueType = null;
            persist();
            return;
          }
          if (isChartingQuestionsType(typeObj)) {
            var chartingDescription = (fd.get("description") || "").toString().trim();
            var chartingLink = (fd.get("studentRecordLink") || "").toString().trim();
            if (!chartingDescription || !chartingLink) return;
            state.issues.push({
              id: uid("issue"),
              type: typeId,
              description: chartingDescription,
              studentRecordLink: chartingLink,
              remarks: "",
              reportedBy: getStoredIdentity(),
              status: statusOpts[0] || "Pending",
              createdAt: new Date().toISOString()
            });
            ui.newIssueType = null;
            persist();
            return;
          }
          var enabledFields = (fd.get("enabledFields") || "").toString().split(",").filter(Boolean);
          var poolByKey = issueFieldPoolByKey();
          var issue = {
            id: uid("issue"),
            type: typeId,
            description: (fd.get("description") || "").toString().trim(),
            /* Always whoever's logged in — never picked from a list. */
            reportedBy: getStoredIdentity(),
            status: statusOpts[0] || "Open",
            remarks: "",
            enabledFields: enabledFields,
            createdAt: new Date().toISOString()
          };
          enabledFields.forEach(function (key) {
            if (poolByKey[key]) issue[key] = (fd.get(key) || "").toString().trim();
          });
          state.issues.push(issue);
          ui.newIssueType = null;
          persist();
        })(); break;
      case "save-issue-edit":
        (function () {
          var id = form.getAttribute("data-id");
          var issue = state.issues.find(function (x) { return x.id === id; });
          if (!issue) return;
          var enabledFields = (fd.get("enabledFields") || "").toString().split(",").filter(Boolean);
          var poolByKey = issueFieldPoolByKey();
          issue.type = (fd.get("type") || "").toString();
          issue.description = (fd.get("description") || "").toString().trim();
          /* reportedBy is not editable here on purpose — it's the original
             reporter's signature, not a field anyone else reassigns. */
          issue.remarks = (fd.get("remarks") || "").toString().trim();
          (state.issueFieldPool || []).forEach(function (f) { delete issue[f.key]; });
          enabledFields.forEach(function (key) {
            if (poolByKey[key]) issue[key] = (fd.get(key) || "").toString().trim();
          });
          issue.enabledFields = enabledFields;
          ui.editingIssueId = null;
          ui.editingIssueType = null;
          persist();
        })(); break;
      case "create-pin":
        (function () {
          var name = form.getAttribute("data-name");
          var pin = (fd.get("pin") || "").toString();
          var pin2 = (fd.get("pin2") || "").toString();
          if (!/^[0-9]{4}$/.test(pin)) { showPinForm(name, true, "PIN must be exactly 4 digits."); return; }
          if (pin !== pin2) { showPinForm(name, true, "PINs don't match — try again."); return; }
          var token = ++identityFlowToken;
          callRpc("set_pin", { p_name: name, p_pin: pin }).then(function (ok) {
            if (token !== identityFlowToken) return;
            if (!ok) { showPinForm(name, false, "That name already has a PIN set — enter it instead."); return; }
            setStoredIdentity(name);
            startApp();
          }).catch(function (err) {
            if (token !== identityFlowToken) return;
            if (err.code === "bad_password") { showPasswordPrompt("That password isn't working anymore — please re-enter it."); return; }
            showPinForm(name, true, "Couldn't connect — check your internet connection and try again.");
          });
        })(); break;
      case "verify-pin":
        (function () {
          var name = form.getAttribute("data-name");
          var pin = (fd.get("pin") || "").toString();
          var token = ++identityFlowToken;
          callRpc("verify_pin", { p_name: name, p_pin: pin }).then(function (ok) {
            if (token !== identityFlowToken) return;
            if (!ok) { showPinForm(name, false, "Incorrect PIN — try again."); return; }
            setStoredIdentity(name);
            startApp();
          }).catch(function (err) {
            if (token !== identityFlowToken) return;
            if (err.code === "bad_password") { showPasswordPrompt("That password isn't working anymore — please re-enter it."); return; }
            showPinForm(name, false, "Couldn't connect — check your internet connection and try again.");
          });
        })(); break;
      case "add-issue-type":
        (function () {
          var name = (fd.get("name") || "").toString().trim();
          if (!name) return;
          state.issueTypes.push({ id: uid("itype"), name: name, statusOptions: NEW_ISSUE_TYPE_STATUS_OPTIONS.slice() });
          persist();
        })(); break;
      case "add-issue-field-pool":
        (function () {
          var label = (fd.get("label") || "").toString().trim();
          if (!label) return;
          state.issueFieldPool = state.issueFieldPool || [];
          state.issueFieldPool.push({ key: uid("field"), label: label, type: "text" });
          persist();
        })(); break;
      case "add-template-item":
        (function () {
          var desc = (fd.get("description") || "").toString().trim();
          if (!desc) return;
          state.checklistTemplate.push({ id: uid("tmpl"), description: desc });
          persist();
        })(); break;
      case "add-va":
        (function () {
          addVaIfNew((fd.get("name") || "").toString());
          persist();
        })(); break;
      case "reset-all-tasks":
        (function () {
          if (!isSuperAdmin()) return;
          var confirmText = (fd.get("confirm") || "").toString();
          if (confirmText !== "RESET") {
            showToast("Type RESET exactly (all caps) to confirm.");
            return;
          }
          Object.keys(state.schoolData).forEach(function (schoolId) {
            state.schoolData[schoolId].tasks = [];
          });
          /* Clears every school's checkmarks (who/when it was done) but
             leaves the checklist's own items alone — same template, just
             starting the new year unchecked. */
          state.checklistProgress = {};
          showToast("All schools' Tasks lists and Yearly Checklist progress have been reset for the new school year.");
          persist();
        })(); break;
      case "save-template":
        (function () {
          var id = form.getAttribute("data-id");
          var vals = {
            name: (fd.get("name") || "").toString().trim(),
            category: (fd.get("category") || "").toString().trim(),
            subject: (fd.get("subject") || "").toString().trim(),
            body: (fd.get("body") || "").toString()
          };
          if (id === "new") {
            var nid = uid("etmpl");
            state.emailTemplates.push(Object.assign({ id: nid }, vals));
            ui.openTemplateId = nid;
          } else {
            var existing = state.emailTemplates.find(function (x) { return x.id === id; });
            if (existing) Object.assign(existing, vals);
          }
          saveDraft("tmpl-" + id + "-subject", ""); saveDraft("tmpl-" + id + "-body", "");
          ui.editingTemplateId = null;
          persist();
        })(); break;
      default: break;
    }
  }

  document.addEventListener("click", onClick);
  document.addEventListener("change", onChange);
  document.addEventListener("input", onInput);
  document.addEventListener("submit", onSubmit);
  document.addEventListener("keydown", onNoteEditorKeydown);

  boot();
}
appMain();
</script>
</body>
</html>
