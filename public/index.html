<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>CSDP Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  /* ---------- Reset ---------- */
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  ul, ol { margin: 0; padding: 0; list-style: none; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  h1, h2, h3, p { margin: 0; }
  a { color: inherit; }

  /* ---------- Tokens: light (default) ---------- */
  :root {
    --bg: #E8F0FC;
    --surface: #FFFFFF;
    --surface-2: #DCE7F8;
    --surface-3: #C9DBF3;
    --ink: #16233A;
    --ink-soft: #47597A;
    --ink-faint: #7A8CAA;
    --border: #C7D6EC;
    --border-strong: #A9C0E0;
    --accent: #1D5FBF;
    --accent-ink: #FFFFFF;
    --accent-soft: #DCE9FB;
    --accent-soft-ink: #12417F;
    --attn: #A85A25;
    --attn-soft: #F3E2D2;
    --progress: #8C6D16;
    --progress-soft: #F1E7C9;
    --done: #3E7D49;
    --done-soft: #DDEBDD;
    --danger: #A23B32;
    --danger-soft: #F3DEDB;
    --shadow: 0 1px 2px rgba(27,36,30,0.06), 0 4px 14px rgba(27,36,30,0.06);
    --radius: 8px;
    --radius-lg: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0E1826;
      --surface: #16212F;
      --surface-2: #1E2C3E;
      --surface-3: #263A50;
      --ink: #E3EAF5;
      --ink-soft: #A3B4CE;
      --ink-faint: #7C8CA6;
      --border: #2C3D54;
      --border-strong: #384B65;
      --accent: #5B9BF7;
      --accent-ink: #0B1E36;
      --accent-soft: #1B2C42;
      --accent-soft-ink: #9CC4FA;
      --attn: #E29A5C;
      --attn-soft: #3B2C1C;
      --progress: #D8BE64;
      --progress-soft: #3A331A;
      --done: #7FC48A;
      --done-soft: #21331F;
      --danger: #E38076;
      --danger-soft: #3A211E;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 6px 20px rgba(0,0,0,0.35);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0E1826;
    --surface: #16212F;
    --surface-2: #1E2C3E;
    --surface-3: #263A50;
    --ink: #E3EAF5;
    --ink-soft: #A3B4CE;
    --ink-faint: #7C8CA6;
    --border: #2C3D54;
    --border-strong: #384B65;
    --accent: #5B9BF7;
    --accent-ink: #0B1E36;
    --accent-soft: #1B2C42;
    --accent-soft-ink: #9CC4FA;
    --attn: #E29A5C;
    --attn-soft: #3B2C1C;
    --progress: #D8BE64;
    --progress-soft: #3A331A;
    --done: #7FC48A;
    --done-soft: #21331F;
    --danger: #E38076;
    --danger-soft: #3A211E;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 6px 20px rgba(0,0,0,0.35);
  }

  /* ---------- Base ---------- */
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Public Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 14.5px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .display { font-family: "Poppins", "Public Sans", -apple-system, BlinkMacSystemFont, sans-serif; font-weight: 600; text-wrap: balance; }
  .mono { font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace; font-variant-numeric: tabular-nums; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }

  /* ---------- Shell ---------- */
  #app { min-height: 100vh; }
  .shell { display: flex; min-height: 100vh; }
  .sidebar {
    width: 272px; flex: none; background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
    height: 100vh; position: sticky; top: 0; overflow-y: auto;
    transition: width 0.15s ease;
  }
  .sidebar.collapsed { width: 0; border-right: none; overflow: hidden; }
  .sidebar-toggle, .theme-toggle {
    position: fixed; top: 14px; z-index: 25;
    width: 28px; height: 28px; border-radius: 999px;
    border: 1px solid var(--border); background: var(--surface); color: var(--ink-soft);
    display: flex; align-items: center; justify-content: center; font-size: 0.8rem;
    box-shadow: var(--shadow); transition: left 0.15s ease;
  }
  .sidebar-toggle:hover, .theme-toggle:hover { color: var(--accent); border-color: var(--accent); }
  .theme-toggle { right: 14px; left: auto; }
  @media (max-width: 900px) { .sidebar-toggle { display: none; } }
  .brand { padding: 20px 18px 14px; border-bottom: 1px solid var(--border); }
  .brand-name { font-size: 1.5rem; font-weight: 600; letter-spacing: -0.01em; }
  .brand-tag { font-size: 0.78rem; color: var(--ink-soft); margin-top: 2px; }
  .sidebar-section { padding: 14px 14px 6px; }
  .sidebar-label {
    font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--ink-faint); font-weight: 600; padding: 0 4px 6px;
  }
  .search-input {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border);
    border-radius: var(--radius); background: var(--bg); color: var(--ink);
    font-size: 0.85rem;
  }
  .nav-list { display: flex; flex-direction: column; gap: 2px; margin-top: 4px; }
  .nav-item {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 7px 10px; border-radius: var(--radius); border: none; background: transparent;
    text-align: left; width: 100%; font-size: 0.86rem; color: var(--ink);
  }
  .nav-item:hover { background: var(--surface-2); }
  .nav-item.active { background: var(--accent-soft); color: var(--accent-soft-ink); font-weight: 600; }
  .nav-item .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .count-chip {
    font-family: "IBM Plex Mono", monospace; font-size: 0.72rem; font-weight: 600;
    background: var(--attn-soft); color: var(--attn); border-radius: 999px;
    padding: 1px 7px; flex: none;
  }
  .school-list { max-height: 40vh; overflow-y: auto; margin: 2px -4px 0; padding: 0 4px; }
  .sidebar-divider { height: 1px; background: var(--border); margin: 10px 14px; }
  .add-inline-btn {
    background: none; border: 1px dashed var(--border-strong); color: var(--ink-soft);
    border-radius: var(--radius); padding: 7px 10px; font-size: 0.82rem; width: 100%;
    margin-top: 4px; text-align: left;
  }
  .add-inline-btn:hover { border-color: var(--accent); color: var(--accent); }
  .mini-form { display: flex; gap: 6px; margin-top: 6px; }
  .mini-form input { flex: 1; min-width: 0; padding: 6px 8px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg); }
  .mini-form button { padding: 6px 10px; border-radius: var(--radius); border: none; background: var(--accent); color: var(--accent-ink); font-weight: 600; font-size: 0.8rem; }

  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .topbar { display: none; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--border); background: var(--surface); position: sticky; top: 0; z-index: 5; }
  .menu-btn { background: none; border: 1px solid var(--border); border-radius: var(--radius); padding: 6px 10px; }
  .readonly-banner {
    background: var(--progress-soft); color: var(--progress); font-size: 0.82rem;
    padding: 8px 20px; border-bottom: 1px solid var(--border); font-weight: 600;
  }
  .content { padding: 28px 32px 60px; max-width: 1440px; width: 100%; margin: 0 auto; transition: max-width 0.15s ease; }
  .sidebar.collapsed ~ .main .content { max-width: 1800px; }

  .page-header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 10px 20px; margin-bottom: 22px; }
  .page-title { font-size: 1.9rem; font-weight: 600; }
  .page-sub { color: var(--ink-soft); font-size: 0.88rem; margin-top: 4px; }
  .field-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .field-label { font-size: 0.76rem; color: var(--ink-faint); text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; }
  .text-input, select.text-input {
    padding: 7px 10px; border: 1px solid var(--border); border-radius: var(--radius);
    background: var(--surface); color: var(--ink); font-size: 0.88rem;
  }
  .text-input:focus, textarea:focus, select:focus { border-color: var(--accent); }
  .link-btn { background: none; border: none; color: var(--ink-soft); font-size: 0.8rem; padding: 4px 2px; text-decoration: underline; text-underline-offset: 2px; }
  .link-btn:hover { color: var(--ink); }
  .link-btn.danger { color: var(--danger); }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); margin-bottom: 20px; box-shadow: var(--shadow); }
  .card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--border); }
  .card-title { font-size: 1.05rem; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .card-body { padding: 14px 18px 18px; }
  .card-actions { display: flex; align-items: center; gap: 10px; }

  .add-row-form { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .add-row-form input.text-input { flex: 1; min-width: 160px; }
  .btn { padding: 7px 14px; border-radius: var(--radius); border: none; background: var(--accent); color: var(--accent-ink); font-weight: 600; font-size: 0.85rem; }
  .btn:hover { filter: brightness(1.06); }
  .btn.ghost { background: var(--surface-2); color: var(--ink); }
  .btn.small { padding: 5px 10px; font-size: 0.78rem; }

  .row-list { display: flex; flex-direction: column; }
  .row-item { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--border); }
  .row-item:last-child { border-bottom: none; }
  .row-main { flex: 1; min-width: 0; }
  .row-title { font-size: 0.92rem; word-break: break-word; }
  .row-meta { font-size: 0.76rem; color: var(--ink-faint); margin-top: 2px; }
  .row-file { font-family: "IBM Plex Mono", monospace; font-size: 0.86rem; }
  .count-input { max-width: 64px; }
  .task-file-group { display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap; }

  .pill {
    display: inline-flex; align-items: center; gap: 5px; font-size: 0.76rem; font-weight: 600;
    padding: 3px 9px; border-radius: 999px; white-space: nowrap; border: none;
  }
  .pill.red { background: var(--danger-soft); color: var(--danger); }
  .pill.orange { background: var(--attn-soft); color: var(--attn); }
  .pill.green { background: var(--done-soft); color: var(--done); }
  .pill.neutral { background: var(--surface-2); color: var(--ink-soft); }
  select.status-select { border: 1px solid var(--border); background: var(--surface); border-radius: 999px; padding: 3px 22px 3px 9px; font-size: 0.76rem; font-weight: 600; }
  select.status-select.red { background: var(--danger-soft); color: var(--danger); border-color: transparent; }
  select.status-select.orange { background: var(--attn-soft); color: var(--attn); border-color: transparent; }
  select.status-select.green { background: var(--done-soft); color: var(--done); border-color: transparent; }
  select.status-select.neutral { background: var(--surface-2); color: var(--ink-soft); border-color: transparent; }

  .icon-btn { background: none; border: none; color: var(--ink-faint); padding: 4px 6px; border-radius: var(--radius); font-size: 0.78rem; }
  .icon-btn:hover { background: var(--danger-soft); color: var(--danger); }
  .icon-btn.confirming { background: var(--danger-soft); color: var(--danger); font-weight: 600; }

  .empty-state { padding: 22px 8px; text-align: center; color: var(--ink-faint); font-size: 0.86rem; }

  .checklist-note { font-size: 0.8rem; color: var(--ink-soft); background: var(--surface-2); border-radius: var(--radius); padding: 8px 12px; margin-bottom: 12px; }
  .checklist-item { display: flex; align-items: flex-start; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border); }
  .checklist-item:last-child { border-bottom: none; }
  .check-toggle {
    width: 20px; height: 20px; border-radius: 5px; border: 2px solid var(--border-strong);
    background: var(--surface); flex: none; margin-top: 1px; display: flex; align-items: center; justify-content: center;
  }
  .check-toggle.done { background: var(--done); border-color: var(--done); color: var(--done-soft); }

  textarea.text-input { width: 100%; min-height: 64px; resize: vertical; font-family: inherit; }
  .note-entry { border-bottom: 1px solid var(--border); padding: 10px 0; }
  .note-entry:last-child { border-bottom: none; }
  .note-text { font-size: 0.9rem; white-space: pre-wrap; word-break: break-word; }
  .note-meta { font-size: 0.76rem; color: var(--ink-faint); margin-top: 4px; }

  .template-item-row { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--border); }
  .template-item-row:last-child { border-bottom: none; }
  .stack-btns { display: flex; flex-direction: column; gap: 1px; }
  .stack-btns button { background: var(--surface-2); border: none; width: 20px; height: 15px; font-size: 0.6rem; color: var(--ink-soft); }
  .stack-btns button:first-child { border-radius: 4px 4px 0 0; }
  .stack-btns button:last-child { border-radius: 0 0 4px 4px; }

  .filters-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .view-toggle { display: inline-flex; gap: 4px; margin-left: auto; }
  .view-toggle button { padding: 6px 14px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); font-size: 0.8rem; cursor: pointer; color: var(--ink-soft); }
  .view-toggle button.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  .template-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); }
  .tmpl-item { border: 1px solid var(--border); border-radius: var(--radius-lg); margin-bottom: 10px; overflow: hidden; }
  .tmpl-item-head { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; cursor: pointer; }
  .tmpl-item-head:hover { background: var(--surface-2); }
  .tmpl-name { font-weight: 600; }
  .tmpl-cat { font-size: 0.74rem; color: var(--ink-faint); background: var(--surface-2); border-radius: 999px; padding: 1px 8px; margin-left: 8px; }
  .tmpl-body-view { padding: 0 16px 16px; }
  .tmpl-subject { font-size: 0.86rem; color: var(--ink-soft); margin-bottom: 6px; }
  .tmpl-body-text { font-size: 0.88rem; white-space: pre-wrap; background: var(--bg); border-radius: var(--radius); padding: 10px 12px; border: 1px solid var(--border); }
  .tmpl-edit-form { padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
  .form-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .tmpl-actions { display: flex; gap: 8px; margin-top: 4px; }

  .va-chip-list { display: flex; flex-wrap: wrap; gap: 8px; }
  .va-chip { display: flex; align-items: center; gap: 6px; background: var(--surface-2); border-radius: 999px; padding: 5px 6px 5px 12px; font-size: 0.85rem; }

  .toast {
    position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
    background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: var(--radius);
    font-size: 0.85rem; box-shadow: var(--shadow); z-index: 50; opacity: 0; pointer-events: none;
    transition: opacity 0.2s ease;
  }
  .toast.show { opacity: 1; }

  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 24px; }
  .stat-tile { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 14px 16px; }
  .stat-num { font-family: "IBM Plex Mono", monospace; font-size: 1.7rem; font-weight: 600; }
  .stat-label { font-size: 0.78rem; color: var(--ink-soft); margin-top: 2px; }
  .stat-row-sm { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
  .stat-tile-sm { padding: 8px 14px; flex: 0 0 auto; min-width: 110px; }
  .stat-tile-sm .stat-num { font-size: 1.15rem; }
  .stat-tile-sm .stat-label { font-size: 0.7rem; }
  .card-compact .card-body { padding-top: 6px; padding-bottom: 6px; }
  .alerts-card { border-color: var(--danger); background: var(--danger-soft); }
  .urgent-pill { display: inline-block; background: var(--danger); color: #fff; font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; padding: 2px 8px; border-radius: 999px; margin-bottom: 6px; align-self: flex-start; }
  .clickable-card { cursor: pointer; }
  .clickable-card:hover { filter: brightness(0.97); }
  .alerts-row { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
  .alerts-row .card { flex: 1 1 200px; margin-bottom: 0; }
  .eod-note-card .card-body { font-family: "IBM Plex Mono", monospace; }
  .eod-note-line { font-size: 0.86rem; line-height: 1.6; color: var(--ink); }
  .alerts-card .card-title { color: var(--danger); }
  .alerts-card .nav-item .name { color: var(--danger); }
  .alerts-card .count-chip { background: var(--danger); color: #fff; }
  .school-progress-row { display: flex; align-items: center; gap: 10px; padding: 6px 0; }
  .school-progress-row .school-progress-name { flex: 0 0 160px; font-size: 0.85rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .school-progress-row .progress-bar-track { flex: 1; }
  .school-progress-row .school-progress-pct { flex: 0 0 40px; text-align: right; font-size: 0.8rem; color: var(--ink-soft); font-family: "IBM Plex Mono", monospace; }
  .progress-bar-track { background: var(--border); border-radius: 999px; height: 10px; overflow: hidden; }
  .progress-bar-fill { background: var(--accent); height: 100%; border-radius: 999px; transition: width 0.3s ease; }
  .progress-bar-label { font-size: 0.8rem; color: var(--ink-soft); margin-top: 8px; }

  @media (max-width: 900px) {
    .sidebar { position: fixed; z-index: 20; left: 0; top: 0; transform: translateX(-100%); transition: transform 0.2s ease; box-shadow: var(--shadow); }
    .sidebar.open { transform: translateX(0); }
    .topbar { display: flex; }
    .content { padding: 20px 16px 50px; }
    .form-2col { grid-template-columns: 1fr; }
  }
  .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.35); z-index: 15; }
  .overlay.show { display: block; }

  .task-group { margin-bottom: 16px; }
  .task-group:last-child { margin-bottom: 0; }
  .task-group-title {
    font-size: 0.76rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--ink-soft); padding: 6px 0; border-bottom: 1px solid var(--border-strong); margin-bottom: 2px;
    display: flex; align-items: center; gap: 6px;
  }
  .va-group { display: inline-flex; align-items: center; flex-wrap: wrap; gap: 6px; }
  .va-tag { display: inline-flex; align-items: center; gap: 5px; padding: 2px 6px 2px 9px; border-radius: 999px; font-size: 0.78rem; font-weight: 600; color: var(--ink); white-space: nowrap; }
  .va-tag-remove { background: none; border: none; color: inherit; opacity: 0.55; font-size: 0.85rem; line-height: 1; padding: 0; }
  .va-tag-remove:hover { opacity: 1; }
  .add-va-btn {
    width: 22px; height: 22px; border-radius: 999px; border: 1px dashed var(--border-strong);
    background: none; color: var(--ink-soft); font-size: 0.9rem; line-height: 1;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .add-va-btn:hover { border-color: var(--accent); color: var(--accent); }
  .va-add-select { max-width: 150px; }
  .field-mini-label { font-size: 0.7rem; color: var(--ink-faint); text-transform: uppercase; letter-spacing: 0.04em; white-space: nowrap; }

  .table-scroll { overflow-x: auto; }
  .data-table { border-collapse: collapse; width: 100%; font-size: 0.84rem; }
  .data-table th, .data-table td { padding: 8px 10px; border-bottom: 1px solid var(--border); border-right: 1px solid var(--border); text-align: left; white-space: nowrap; vertical-align: top; }
  .data-table th:last-child, .data-table td:last-child { border-right: none; }
  .data-table th { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--ink-faint); font-weight: 600; }
  .data-table td.wrap { white-space: normal; min-width: 160px; }
  .data-table tr:last-child td { border-bottom: none; }

  /* Sticky notes always use a fixed dark ink on pastel backgrounds,
     regardless of app theme — like real sticky notes look the same in
     any room lighting. */
  .sticky-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; margin-top: 14px; }
  .sticky-note { border-radius: 10px; padding: 14px; box-shadow: var(--shadow); display: flex; flex-direction: column; min-height: 120px; color: #2b2b1f; }
  .sticky-note-text { flex: 1; font-size: 0.9rem; word-break: break-word; }

  .note-editor-card:has(input[name="color"][value="pink"]:checked) { background: #FCD5E5; }
  .note-editor-card:has(input[name="color"][value="blue"]:checked) { background: #CFE3FC; }

  .note-toolbar button { width: 28px; height: 28px; border-radius: 6px; border: 1px solid rgba(0,0,0,0.15); background: rgba(255,255,255,0.55); font-size: 0.8rem; cursor: pointer; color: #2b2b1f; }

  .note-editor-area ul { margin: 4px 0 4px 18px; padding: 0; list-style: disc; }

<div id="app"></div>
<script src="config.js"></script>
<script>
function appMain() {

  var NOTE_COLORS = [
    { id: "yellow", hex: "#FFF3B0" },
    { id: "pink", hex: "#FCD5E5" },
    { id: "blue", hex: "#CFE3FC" },
    { id: "green", hex: "#D8F0D2" },
    { id: "purple", hex: "#E5D9FA" },
    { id: "orange", hex: "#FCE1C6" },
    { id: "white", hex: "#FFFFFF" }

  var DEFAULT_NOTE_COLOR = "white";
  var NOTE_TEXT_COLORS = ["#2b2b1f", "#c0392b", "#2166ac", "#1e824c", "#8e44ad", "#b8860b"];
  /* Plain system fonts on purpose — every device already has these

    { name: "Comic Sans", label: "Aa", family: "'Comic Sans MS', 'Comic Sans', cursive" },
    { name: "Calibri", label: "Aa", family: "Calibri, 'Segoe UI', sans-serif" }

  var NOTE_FONT_SIZES = [
    { label: "S", legacy: "2", px: "12px" },
    { label: "M", legacy: "4", px: "15px" },
    { label: "L", legacy: "6", px: "20px" }

  var NOTE_FONT_SIZE_PX_BY_LEGACY = {};
  NOTE_FONT_SIZES.forEach(function (s) { NOTE_FONT_SIZE_PX_BY_LEGACY[s.legacy] = s.px; });
  var SAFE_NOTE_FONT_SIZE_PX = NOTE_FONT_SIZES.map(function (s) { return s.px; });

  var DEFAULT_ISSUE_TYPES = [
    { id: "software_issue", name: "Software issue", statusOptions: ["Open", "In Progress", "Resolved"] },
    { id: "recheck", name: "Record Needs Rechecking", statusOptions: ["Pending", "Rechecked", "Needs Re-check"], fieldSet: "recheck" },
    { id: "record_update", name: "Record Update", statusOptions: ["Pending", "In Progress", "Resolved"], fieldSet: "record_update" }
  ];
  var NEW_ISSUE_TYPE_STATUS_OPTIONS = ["Open", "In Progress", "Resolved"];

  var DEFAULT_TASK_CATEGORIES = [
    "Encoding & Uploading (Consent & SDF)", "Transactions", "Initial", "Photos",
    "Recheck", "Insurance", "Eligibility", "Billing"
  ];

  var DEFAULT_STATE = {
    schools: [], vas: [], schoolData: {},
    taskCategories: DEFAULT_TASK_CATEGORIES.map(function (name) { return { id: "cat_" + name.toLowerCase().replace(/[^a-z0-9]+/g, "_"), name: name }; }),
    checklistTemplate: [], checklistProgress: {},
    issues: [], issueTypes: DEFAULT_ISSUE_TYPES, emailTemplates: [], generalNotes: [], suggestions: [], eodReports: [], privateNotes: []
  };

  /* ============ helpers ============ */
  function uid(p) { return p + "_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
  function esc(s) {

  }
  /* Sticky notes store a little bit of rich-text HTML (from a contenteditable
     editor), so it has to be sanitized before it's ever written to shared
     state or re-rendered — otherwise a pasted <script>/<img onerror> etc.
     would run for every future viewer. Only a small formatting tag allowlist
     survives; everything else is unwrapped (dropped, keeping its text) or,
     for comments/etc., removed outright. Parsed via DOMParser rather than a
     live element's innerHTML, since DOMParser documents don't fetch
     resources or run scripts even transiently during parsing. */
  var ALLOWED_NOTE_TAGS = { B: 1, STRONG: 1, I: 1, EM: 1, U: 1, UL: 1, OL: 1, LI: 1, BR: 1, DIV: 1, P: 1, SPAN: 1, FONT: 1, INPUT: 1 };

     tag allowlist above. */
  var SAFE_COLOR_RE = /^#[0-9a-fA-F]{3,8}$|^rgb\(\s*\d{1,3}\s*,\s*\d{1,3}\s*,\s*\d{1,3}\s*\)$/;

  }
  var NOTE_FONT_FAMILY_BY_NORMALIZED = {};
  NOTE_FONTS.forEach(function (f) { NOTE_FONT_FAMILY_BY_NORMALIZED[normalizeFontFamilyValue(f.family)] = f.family; });

      }
      if (prop === "font-size" && SAFE_NOTE_FONT_SIZE_PX.indexOf(val) !== -1) out.push("font-size:" + val);

            if (colorAttr && SAFE_COLOR_RE.test(colorAttr)) parts.push("color:" + colorAttr);

            var cleaned = sanitizeStyleDecl(child.getAttribute("style"));
            while (child.attributes.length) child.removeAttribute(child.attributes[0].name);
            if (cleaned) child.setAttribute("style", cleaned);
          } else if (child.tagName === "INPUT") {
            var isCheckbox = (child.getAttribute("type") || "").toLowerCase() === "checkbox";
            if (!isCheckbox) { node.removeChild(child); return; }
            var wasChecked = child.hasAttribute("checked");
            while (child.attributes.length) child.removeAttribute(child.attributes[0].name);

            if (wasChecked) child.setAttribute("checked", "");

            var ulClass = child.getAttribute("class");
            while (child.attributes.length) child.removeAttribute(child.attributes[0].name);
            if (ulClass === "list-dash" || ulClass === "list-check") child.setAttribute("class", ulClass);

     called from an inline onmousedown attribute in generated HTML. */

    document.execCommand("insertUnorderedList");
    var editor = document.getElementById(editorId);
    if (!editor) return;
    var sel = window.getSelection();
    if (!sel || !sel.rangeCount) return;
    var node = sel.anchorNode;

  /* A checkbox's "checked" DOM attribute only reflects its *default* state —
     clicking it updates the live `.checked` property, not the attribute — so
     reading `.innerHTML` straight after a click would serialize the box back
     to its original state. Sync attribute from property first. */
  function syncNoteCheckboxAttrs(editorEl) {
    if (!editorEl) return;
    var boxes = editorEl.querySelectorAll("input[type=checkbox]");
    for (var i = 0; i < boxes.length; i++) {
      if (boxes[i].checked) boxes[i].setAttribute("checked", ""); else boxes[i].removeAttribute("checked");
    }
  }
  /* For display (read-only) rendering only: tags each checkbox in a note's

     handler needs to toggle it in place. Never applied to what gets saved. */
  function renderNoteCheckboxes(html, id, scope) {
    var doc = new DOMParser().parseFromString(String(html || ""), "text/html");
    var boxes = doc.querySelectorAll("input[type=checkbox]");
    for (var i = 0; i < boxes.length; i++) {
      boxes[i].setAttribute("data-action-change", "toggle-note-checkbox");
      boxes[i].setAttribute("data-id", id);
      boxes[i].setAttribute("data-scope", scope);
      boxes[i].setAttribute("data-cb-index", String(i));
    }
    return doc.body.innerHTML;
  }
  function fmtDate(iso) {
    if (!iso) return "";
    var d = new Date(iso);
    if (isNaN(d.getTime())) return "";
    return d.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
  }
  function fmtDateTime(iso) {
    if (!iso) return "";
    var d = new Date(iso);
    if (isNaN(d.getTime())) return "";
    return d.toLocaleDateString(undefined, { month: "short", day: "numeric" }) + " · " +
      d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
  }
  function todayIsoDate() {
    var d = new Date();
    return d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2);
  }
  function fmtEodDate(iso) {

       treats a bare date as UTC midnight, which can shift a day backward
       in timezones behind UTC. */
    if (!iso) return "";

    if (parts.length !== 3) return iso;
    var months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
    var mi = parseInt(parts[1], 10) - 1;
    if (mi < 0 || mi > 11) return iso;
    return months[mi] + " " + parseInt(parts[2], 10) + ", " + parts[0];
  }
  function fmtTime12(t) {
    if (!t) return "";
    var parts = t.split(":");
    if (parts.length < 2) return t;
    var h = parseInt(parts[0], 10);
    if (isNaN(h)) return t;
    var ampm = h >= 12 ? "PM" : "AM";
    var h12 = h % 12; if (h12 === 0) h12 = 12;
    return h12 + ":" + parts[1] + " " + ampm;
  }
  function timeStrToMinutes(str) {
    if (!str) return null;
    var parts = String(str).split(":");
    if (parts.length < 2) return null;
    var h = parseInt(parts[0], 10), m = parseInt(parts[1], 10);
    if (isNaN(h) || isNaN(m)) return null;
    return h * 60 + m;
  }
  function formatMinutesAsHours(mins) {
    if (mins == null || isNaN(mins) || mins < 0) return "";
    var h = Math.floor(mins / 60);
    var m = Math.round(mins % 60);

  }
  /* Auto-computes worked hours from Time in/out, minus a break (if both
     Break and Resume are filled in). Assumes a same-day shift — if Time out
     is earlier than Time in, treats it as crossing midnight. */
  function computeEodTotalHours(timeIn, timeOut, breakStart, breakEnd) {
    var inM = timeStrToMinutes(timeIn);
    var outM = timeStrToMinutes(timeOut);
    if (inM == null || outM == null) return "";

    var bStart = timeStrToMinutes(breakStart);
    var bEnd = timeStrToMinutes(breakEnd);
    if (bStart != null && bEnd != null) {
      var breakMins = bEnd - bStart;
      if (breakMins < 0) breakMins += 24 * 60;

  }
  function pillClass(status) { return "pill " + (STATUS_TIER[status] || "neutral"); }
  function draftKey(name) { return "caseload_draft_" + name; }
  function saveDraft(name, value) {
    try { if (value) { localStorage.setItem(draftKey(name), value); } else { localStorage.removeItem(draftKey(name)); } } catch (e) {}
  }
  function loadDraft(name) {
    try { return localStorage.getItem(draftKey(name)) || ""; } catch (e) { return ""; }
  }
  function loadLocal(key, fallback) {
    try { var v = localStorage.getItem(key); return v == null ? fallback : v; } catch (e) { return fallback; }
  }
  function saveLocal(key, value) { try { localStorage.setItem(key, value); } catch (e) {} }

  /* ============ state ============ */
  var LEGACY_TASK_STATUS = { "Open": "In Progress", "Done": "Completed" };
  function migrateTaskFields(parsed) {
    var sd = parsed.schoolData || {};
    for (var schoolId in sd) {
      var tasks = (sd[schoolId] || {}).tasks || [];
      for (var i = 0; i < tasks.length; i++) {
        var t = tasks[i];
        if (LEGACY_TASK_STATUS[t.status]) t.status = LEGACY_TASK_STATUS[t.status];
        if (typeof t.vaAssigned === "string") t.vaAssigned = t.vaAssigned ? [t.vaAssigned] : [];
        if (!Array.isArray(t.vaAssigned)) t.vaAssigned = [];
      }
    }
  }
  /* Once a database has saved its own copy of issueTypes, the DEFAULT_STATE
     merge above no longer applies (the key already exists) — so a new
     built-in type added here in code would never reach an existing database.
     This appends any built-in type missing by id, without touching order or
     any team-added custom types. */
  function migrateIssueTypes(parsed) {
    /* "Correction" briefly existed as its own type, then was folded into
       Record Update's extra fields instead — drop it if an earlier save
       already persisted it. */
    parsed.issueTypes = (parsed.issueTypes || []).filter(function (t) { return t.id !== "correction"; });
    var existingIds = parsed.issueTypes.map(function (t) { return t.id; });
    DEFAULT_ISSUE_TYPES.forEach(function (dt) {
      if (existingIds.indexOf(dt.id) === -1) parsed.issueTypes.push(dt);
    });
    /* "Record Update" and "Recheck" already existed under the old
       `extraFields: true` flag before each type got its own distinct field
       set — bring an already-saved copy of either up to the current shape. */
    parsed.issueTypes.forEach(function (ty) {
      if (ty.id === "record_update") { ty.fieldSet = "record_update"; delete ty.extraFields; }
      if (ty.id === "recheck") {
        if (ty.name === "Recheck") ty.name = "Record Needs Rechecking";
        ty.fieldSet = "recheck";
        delete ty.extraFields;
      }
    });
  }
  /* Appends any of the standard checklist items that aren't already present
     (matched by description, case-insensitive) — same idea as
     migrateIssueTypes, so a shared/already-saved template still picks up
     new built-in items without duplicating or disturbing anything the team
     added themselves. */
  function migrateChecklistTemplate(parsed) {
    parsed.checklistTemplate = parsed.checklistTemplate || [];
    /* Re-cases any item that already matches a standard item by text (e.g.
       an earlier ALL-CAPS default) to the current canonical casing, so the
       list stays uniform without creating a duplicate. */
    parsed.checklistTemplate.forEach(function (item) {
      var lower = (item.description || "").trim().toLowerCase();
      var canonical = DEFAULT_CHECKLIST_ITEMS.filter(function (desc) { return desc.toLowerCase() === lower; })[0];
      if (canonical) item.description = canonical;
    });
    var existingDesc = parsed.checklistTemplate.map(function (item) {
      return (item.description || "").trim().toLowerCase();
    });
    DEFAULT_CHECKLIST_ITEMS.forEach(function (desc) {
      if (existingDesc.indexOf(desc.trim().toLowerCase()) === -1) {
        parsed.checklistTemplate.push({ id: uid("tmpl"), description: desc });
      }
    });
  }
  /* Notes used to store plain text, escaped at render time. Now they store
     a bit of sanitized rich-text HTML, rendered directly. A note created
     before this change has no `color` yet — use that as the signal to
     convert its old plain text into the HTML-escaped equivalent once, so
     it keeps displaying correctly (not reinterpreted as markup) and never
     gets re-migrated. */
  function migrateNotesToHtml(list) {
    (list || []).forEach(function (n) {
      if (!n.color) {
        n.text = esc(n.text || "");
        n.color = DEFAULT_NOTE_COLOR;
      }
    });
  }
  var PASSWORD_KEY = "csdp_app_password";
  function getStoredPassword() {
    try { return localStorage.getItem(PASSWORD_KEY) || ""; } catch (e) { return ""; }
  }
  function setStoredPassword(pw) {
    try { localStorage.setItem(PASSWORD_KEY, pw); } catch (e) {}
  }

  /* ---------- Per-viewer preferences (not synced — local to this browser) ---------- */
  var SIDEBAR_COLLAPSED_KEY = "csdp_sidebar_collapsed";
  function loadSidebarCollapsed() {
    try { return localStorage.getItem(SIDEBAR_COLLAPSED_KEY) === "1"; } catch (e) { return false; }
  }
  function saveSidebarCollapsed(v) {
    try { localStorage.setItem(SIDEBAR_COLLAPSED_KEY, v ? "1" : "0"); } catch (e) {}
  }

  var IDENTITY_KEY = "csdp_identity";
  function getStoredIdentity() {
    try { return localStorage.getItem(IDENTITY_KEY) || ""; } catch (e) { return ""; }
  }
  function setStoredIdentity(name) {
    try { localStorage.setItem(IDENTITY_KEY, name); } catch (e) {}
  }
  /* Team-page access is limited to the superadmin. This is a client-side

     from everyone else, but doesn't lock the underlying shared data down
     at the database level. */

  function currentEffectiveTheme() {
    var t = getStoredTheme();
    if (t === "light" || t === "dark") return t;
    return (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
  }
  function applyTheme() {
    var t = getStoredTheme();
    if (t === "light" || t === "dark") { document.documentElement.setAttribute("data-theme", t); }

      (message ? "<p style=\"color:var(--danger); margin:0 0 12px;\">" + esc(message) + "</p>" : "") +

      "<button class=\"link-btn\" type=\"button\" data-action=\"back-to-identity-picker\">Not you? Pick a different name</button>" +
      "</form></div>";

  function showPinForm(name, isNew, message) {
    document.getElementById("app").innerHTML = pinFormHtml(name, isNew, message);
  }

  var identityFlowToken = 0;
  function handleIdentityPick(name) {
    var token = ++identityFlowToken;
    callRpc("pin_status", { p_name: name }).then(function (hasPin) {
      if (token !== identityFlowToken) return;
      showPinForm(name, !hasPin, null);
    }).catch(function (err) {
      if (token !== identityFlowToken) return;
      if (err.code === "bad_password") { showPasswordPrompt("That password isn't working anymore — please re-enter it."); return; }
      showPinForm(name, false, "Couldn't connect — check your internet connection and try again.");
    });
  }

  var VIEW_STORAGE_KEY = "caseload_current_view";
  function loadStoredView() {
    try {
      var raw = sessionStorage.getItem(VIEW_STORAGE_KEY);
      return raw ? JSON.parse(raw) : { type: "home" };
    } catch (e) { return { type: "home" }; }
  }
  function saveStoredView() {
    try { sessionStorage.setItem(VIEW_STORAGE_KEY, JSON.stringify(ui.view)); } catch (e) {}
  }

  var state = null;
  var ui = null;
  var lastKnownUpdatedAt = null;

  function hasSupabaseConfig() {
    var c = window.SUPABASE_CONFIG;
    return !!(c && c.url && c.anonKey);
  }

  function configMissingError() {
    var e = new Error("config missing");
    e.code = "config_missing";
    return e;
  }

  function supabaseHeaders(extra) {
    var h = {
      apikey: window.SUPABASE_CONFIG.anonKey,
      Authorization: "Bearer " + window.SUPABASE_CONFIG.anonKey,
      "x-app-password": getStoredPassword()
    };
    if (extra) for (var k in extra) h[k] = extra[k];
    return h;
  }

  function loadStateFromServer() {
    if (!hasSupabaseConfig()) return Promise.reject(configMissingError());
    var url = window.SUPABASE_CONFIG.url + "/rest/v1/app_state?select=data,updated_at&id=eq.1";
    return fetch(url, { headers: supabaseHeaders() }).then(function (res) {
      if (res.status === 401 || res.status === 403) { var e = new Error("bad password"); e.code = "bad_password"; throw e; }
      if (!res.ok) { var e2 = new Error("load failed: " + res.status); e2.code = "load_failed"; throw e2; }
      return res.json();
    }).then(function (rows) {
      /* Row-Level Security filters non-matching rows silently rather than
         returning 401/403 — so once the app_state row is seeded, an empty
         result here always means the password header didn't match, not a
         missing row. Treat it as bad_password rather than a separate case. */
      if (!rows || !rows.length) { var e3 = new Error("no data row"); e3.code = "bad_password"; throw e3; }
      lastKnownUpdatedAt = rows[0].updated_at;
      return rows[0].data;
    });
  }

  function callRpc(fnName, args) {
    if (!hasSupabaseConfig()) return Promise.reject(configMissingError());
    var url = window.SUPABASE_CONFIG.url + "/rest/v1/rpc/" + fnName;
    return fetch(url, {
      method: "POST",
      headers: supabaseHeaders({ "Content-Type": "application/json" }),
      body: JSON.stringify(args)
    }).then(function (res) {
      if (res.status === 401 || res.status === 403) { var e = new Error("bad password"); e.code = "bad_password"; throw e; }
      if (res.ok) { return res.json(); }
      /* A wrong x-app-password raises a plain SQL exception inside these
         functions, which PostgREST surfaces as a 400 (not 401/403 like the
         RLS-based table checks elsewhere) — so it has to be told apart by
         the error body's message instead of the status code. */
      return res.json().catch(function () { return {}; }).then(function (body) {
        if (body && body.message === "forbidden") { var e2 = new Error("bad password"); e2.code = "bad_password"; throw e2; }
        var e3 = new Error("rpc failed: " + res.status); e3.code = "rpc_failed"; throw e3;
      });
    });
  }

  function saveStateToServer(newState) {
    if (!hasSupabaseConfig()) return Promise.reject(configMissingError());
    /* No optimistic-concurrency check here on purpose — the team works on
       different schools/tasks at the same time, so the last save simply
       wins rather than blocking with a conflict warning. */
    var url = window.SUPABASE_CONFIG.url + "/rest/v1/app_state?id=eq.1";
    var nowIso = new Date().toISOString();
    return fetch(url, {
      method: "PATCH",
      headers: supabaseHeaders({ "Content-Type": "application/json", "Prefer": "return=representation" }),
      body: JSON.stringify({ data: newState, updated_at: nowIso })
    }).then(function (res) {
      if (res.status === 401 || res.status === 403) { var e = new Error("bad password"); e.code = "bad_password"; throw e; }
      if (!res.ok) { var e2 = new Error("save failed: " + res.status); e2.code = "save_failed"; throw e2; }
      return res.json();
    }).then(function (rows) {
      if (rows && rows.length) { lastKnownUpdatedAt = rows[0].updated_at; }
      return rows && rows[0];
    });
  }

  function boot() {
    var pw = getStoredPassword();
    if (!pw) { showPasswordPrompt(); return; }
    loadStateFromServer().then(function (data) {
      state = data;
      for (var k in DEFAULT_STATE) { if (!(k in state)) state[k] = DEFAULT_STATE[k]; }
      migrateTaskFields(state);
      migrateIssueTypes(state);
      migrateChecklistTemplate(state);
      migrateNotesToHtml(state.generalNotes);
      migrateNotesToHtml(state.privateNotes);
      var identity = getStoredIdentity();
      var validIdentity = identity && state.vas.some(function (v) { return v.name === identity; });
      if (!validIdentity) { setStoredIdentity(""); showIdentityPicker(); return; }
      startApp();
    }).catch(function (err) {
      if (err.code === "bad_password") { showPasswordPrompt("Incorrect password."); return; }
      if (err.code === "config_missing") { showPasswordPrompt("App isn't configured yet — config.js is missing or incomplete."); return; }
      showPasswordPrompt("Couldn't connect — check your internet connection and try again.");
    });
  }

  function startApp() {
    ui = {
      view: loadStoredView(),
      search: "",
      sidebarOpen: false,
      sidebarCollapsed: loadSidebarCollapsed(),
      templateEditorOpen: false,
      pendingDelete: null,
      issueFilters: { school: "", type: "", status: "" },
      eodFilterAuthor: "",
      eodViewMode: "notes",
      editingNoteId: null
    };
    render();
  }

  /* ============ derived data helpers ============ */
  function schoolById(id) { for (var i = 0; i < state.schools.length; i++) if (state.schools[i].id === id) return state.schools[i]; return null; }
  function ensureSchoolData(id) {
    if (!state.schoolData[id]) state.schoolData[id] = { vaAssigned: "", tasks: [], emailTracker: [], notes: [] };
    return state.schoolData[id];
  }
  function addVaIfNew(name) {
    name = (name || "").trim();
    if (!name) return;
    for (var i = 0; i < state.vas.length; i++) if (state.vas[i].name.toLowerCase() === name.toLowerCase()) return;
    state.vas.push({ id: uid("va"), name: name });
  }
  function countNotDone(list) {
    var n = 0;
    for (var i = 0; i < list.length; i++) if (STATUS_TIER[list[i].status] !== "green") n++;
    return n;
  }
  /* The sidebar badge next to each school name shows only how many Yearly
     Checklist items are still unchecked — not open tasks/emails/issues too
     (those have their own counts on the school's own page). */
  function schoolAttnCount(schoolId) {
    var n = 0;
    for (var i = 0; i < state.checklistTemplate.length; i++) {
      var prog = state.checklistProgress[schoolId + ":" + state.checklistTemplate[i].id];
      if (!prog || prog.status !== "Done") n++;
    }
    return n;
  }
  function tasksAttnCount(schoolId) {
    var sd = state.schoolData[schoolId] || { tasks: [] };
    return countNotDone(sd.tasks || []);
  }
  function emailAttnCount(schoolId) {
    var sd = state.schoolData[schoolId] || { emailTracker: [] };
    return countNotDone(sd.emailTracker || []);
  }
  function issuesAttnCount() {
    var n = 0;
    for (var i = 0; i < state.issues.length; i++) if (STATUS_TIER[state.issues[i].status] !== "green") n++;
    return n;
  }
  function issuesStatusBreakdown() {
    var counts = {};
    state.issues.forEach(function (it) {
      if (STATUS_TIER[it.status] !== "green") {
        counts[it.status] = (counts[it.status] || 0) + 1;
      }
    });
    return Object.keys(counts).map(function (status) {
      return { status: status, count: counts[status] };
    }).sort(function (a, b) {
      return b.count - a.count || a.status.localeCompare(b.status);
    });
  }
  function issueTypeById(id) {
    for (var i = 0; i < state.issueTypes.length; i++) if (state.issueTypes[i].id === id) return state.issueTypes[i];
    return null;
  }
  function isSchoolYearComplete(schoolId) {
    var tmpl = state.checklistTemplate;
    if (!tmpl.length) return false;
    for (var i = 0; i < tmpl.length; i++) {
      var prog = state.checklistProgress[schoolId + ":" + tmpl[i].id];
      if (!prog || prog.status !== "Done") return false;
    }
    return true;
  }

  /* ============ persistence ============ */
  function persist() {
    render();
    saveStoredView();
    saveStateToServer(state).catch(function (err) {
      if (err.code === "bad_password") { showPasswordPrompt("That password isn't working anymore — please re-enter it."); return; }
      if (err.code === "config_missing") { showToast("App isn't configured yet — config.js is missing or incomplete."); return; }
      showToast("Couldn't save that change" + (err && err.message ? ": " + err.message : "") + ". Please try again.");
    });
  }

  var toastTimer = null;
  function showToast(msg) {
    var t = document.getElementById("caseload-toast");
    if (!t) {
      t = document.createElement("div");
      t.id = "caseload-toast";
      t.className = "toast";
      document.body.appendChild(t);
    }
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove("show"); }, 3200);
  }

  /* ============ two-stage delete ============ */
  function isPending(type, id) { return ui.pendingDelete && ui.pendingDelete.type === type && ui.pendingDelete.id === id; }
  function requestDelete(type, id, performFn) {
    if (isPending(type, id)) {
      ui.pendingDelete = null;
      performFn();
      persist();
    } else {
      ui.pendingDelete = { type: type, id: id };
      render();
      setTimeout(function () {
        if (isPending(type, id)) { ui.pendingDelete = null; render(); }
      }, 4000);
    }
  }

  /* ============ rendering ============ */
  function render() {
    var app = document.getElementById("app");
    app.innerHTML = shellHtml();
  }

  function shellHtml() {
    return (
      "<div class=\"shell\">" +
      "<div class=\"overlay" + (ui.sidebarOpen ? " show" : "") + "\" data-action=\"close-sidebar\"></div>" +
      "<aside class=\"sidebar" + (ui.sidebarOpen ? " open" : "") + (ui.sidebarCollapsed ? " collapsed" : "") + "\">" + sidebarHtml() + "</aside>" +
      "<button class=\"sidebar-toggle\" data-action=\"toggle-sidebar-collapse\" style=\"left:" + (ui.sidebarCollapsed ? "12px" : "260px") + ";\" title=\"" + (ui.sidebarCollapsed ? "Show sidebar" : "Hide sidebar") + "\">" + (ui.sidebarCollapsed ? "▶" : "◀") + "</button>" +
      "<button class=\"theme-toggle\" data-action=\"toggle-theme\" title=\"Switch to " + (currentEffectiveTheme() === "dark" ? "light" : "dark") + " mode\">" + (currentEffectiveTheme() === "dark" ? "☀" : "🌙") + "</button>" +
      "<div class=\"main\">" +
      "<div class=\"topbar\"><button class=\"menu-btn\" data-action=\"toggle-sidebar\">☰ Menu</button><strong class=\"display\">CSDP Tracker</strong></div>" +
      "<div class=\"content\">" + pageHtml() + "</div>" +
      "</div></div>"
    );
  }

  function navItem(view, label, badge, activePredicate) {
    var active = activePredicate(ui.view);
    return "<button class=\"nav-item" + (active ? " active" : "") + "\" data-action=\"nav-view\" data-view=\"" + view + "\">" +
      "<span class=\"name\">" + esc(label) + "</span>" +
      (badge > 0 ? "<span class=\"count-chip\">" + badge + "</span>" : "") + "</button>";
  }

  function sidebarHtml() {
    var q = ui.search.trim().toLowerCase();
    var schools = state.schools.slice().sort(function (a, b) { return a.name.localeCompare(b.name); });
    if (q) schools = schools.filter(function (s) { return s.name.toLowerCase().indexOf(q) !== -1; });

    var schoolRows = schools.map(function (s) {
      var active = ui.view.type === "school" && ui.view.id === s.id;
      var n = schoolAttnCount(s.id);
      return "<button class=\"nav-item" + (active ? " active" : "") + "\" data-action=\"nav-school\" data-id=\"" + s.id + "\">" +
        "<span class=\"name\">" + esc(s.name) + "</span>" + (n > 0 ? "<span class=\"count-chip\">" + n + "</span>" : "") + "</button>";
    }).join("");

    return (
      "<div class=\"brand\"><div class=\"brand-name display\">CSDP Tracker</div><div class=\"brand-tag\">Shared casework tracker</div></div>" +
      "<div class=\"sidebar-section\">" +
      navItem("home", "Overview", 0, function (v) { return v.type === "home"; }) +
      "</div>" +
      "<div class=\"sidebar-section\">" +
      "<div class=\"sidebar-label\">Schools (" + state.schools.length + ")</div>" +
      "<input class=\"search-input\" placeholder=\"Search schools…\" value=\"" + esc(ui.search) + "\" data-role=\"school-search\">" +
      "<div class=\"school-list nav-list\">" + (schoolRows || "<div class=\"empty-state\" style=\"padding:10px 4px;\">No schools match.</div>") + "</div>" +
      "<button class=\"add-inline-btn\" data-action=\"toggle-add-school\">+ Add school</button>" +
      (ui.addSchoolOpen ? "<form class=\"mini-form\" data-action=\"add-school\">" +
        "<input required autofocus name=\"name\" placeholder=\"School name\">" +
        "<button type=\"submit\">Add</button></form>" : "") +
      "</div>" +
      "<div class=\"sidebar-divider\"></div>" +
      "<div class=\"sidebar-section\">" +
      "<div class=\"sidebar-label\">My Space</div>" +
      "<div class=\"nav-list\">" +
      navItem("private-notes", "Private Notes", 0, function (v) { return v.type === "private-notes"; }) +
      (isSuperAdmin() ? navItem("team", "Team", 0, function (v) { return v.type === "team"; }) : "") +
      navItem("eod", "EOD Reports", 0, function (v) { return v.type === "eod"; }) +
      "</div></div>" +
      "<div class=\"sidebar-divider\"></div>" +
      "<div class=\"sidebar-section\">" +
      "<div class=\"sidebar-label\">Team</div>" +
      "<div class=\"nav-list\">" +
      navItem("issues", "Issues & Concerns", issuesAttnCount(), function (v) { return v.type === "issues"; }) +
      navItem("contacts", "Schools Contact Information", 0, function (v) { return v.type === "contacts"; }) +
      navItem("templates", "Email Templates", 0, function (v) { return v.type === "templates"; }) +
      navItem("notes", "General Notes/Announcements", 0, function (v) { return v.type === "notes"; }) +
      navItem("suggestions", "Suggestions", 0, function (v) { return v.type === "suggestions"; }) +
      "</div></div>"
    );
  }

  function contactsPageHtml() {
    return "<div class=\"page-header\"><div><div class=\"page-title display\">Schools Contact Information</div></div></div>" +
      "<div class=\"card\"><div class=\"card-body\">" +
      "<p style=\"margin:0;\">Contact details for each school will go here — coming soon.</p>" +
      "</div></div>";
  }

  function pageHtml() {
    switch (ui.view.type) {
      case "school": return schoolPageHtml(ui.view.id);
      case "issues": return issuesPageHtml();
      case "contacts": return contactsPageHtml();
      case "templates": return templatesPageHtml();
      case "team": return isSuperAdmin() ? teamPageHtml() : homePageHtml();
      case "notes": return generalNotesPageHtml();
      case "suggestions": return suggestionsPageHtml();
      case "eod": return eodPageHtml();
      case "private-notes": return privateNotesPageHtml();
      default: return homePageHtml();
    }
  }

  /* ---------- Home ---------- */
  function taskProgressBySchool() {
    return state.schools.slice().sort(function (a, b) { return a.name.localeCompare(b.name); }).map(function (s) {
      var sd = state.schoolData[s.id] || { tasks: [] };
      var total = 0, done = 0;
      (sd.tasks || []).forEach(function (t) {
        total++;
        if (STATUS_TIER[t.status] === "green") done++;
      });
      return { school: s, total: total, done: done, pct: total ? Math.round((done / total) * 100) : 0 };
    });
  }
  function homePageHtml() {
    var emailAttn = 0;
    var completedSchools = [];
    for (var i = 0; i < state.schools.length; i++) {
      emailAttn += emailAttnCount(state.schools[i].id);
      if (isSchoolYearComplete(state.schools[i].id)) completedSchools.push(state.schools[i]);
    }
    var html = "<div class=\"page-header\"><div><div class=\"page-title display\">Overview</div></div></div>";

    html += "<div class=\"stat-row-sm\">" +
      statTile(state.schools.length, "Schools", true) +
      statTile(completedSchools.length, "Completed for the year", true) +
      "</div>";

    var schoolProgress = taskProgressBySchool();
    var progressRows = schoolProgress.map(function (p) {
      return "<div class=\"school-progress-row\">" +
        "<span class=\"school-progress-name\">" + esc(p.school.name) + "</span>" +
        "<div class=\"progress-bar-track\"><div class=\"progress-bar-fill\" style=\"width:" + p.pct + "%;\"></div></div>" +
        "<span class=\"school-progress-pct\">" + p.pct + "%</span>" +
        "</div>";
    }).join("");
    html += "<div class=\"card\"><div class=\"card-head\"><div class=\"card-title\">Task Progress by School</div></div>" +
      "<div class=\"card-body\">" + (progressRows || emptyState("No schools yet.")) + "</div></div>";

    var issuesTotal = issuesAttnCount();
    html += "<div class=\"alerts-row\">" +
      "<div class=\"card card-compact" + (emailAttn > 0 ? " alerts-card" : "") + "\"><div class=\"card-head\"><div class=\"card-title\">Emails Needing Attention</div></div>" +
      "<div class=\"card-body\"><div class=\"stat-num mono\">" + emailAttn + "</div><div class=\"stat-label\">needing attention</div></div></div>" +
      "<div class=\"card card-compact clickable-card" + (issuesTotal > 0 ? " alerts-card" : "") + "\" data-action=\"nav-view\" data-view=\"issues\"><div class=\"card-head\"><div class=\"card-title\">Issues & Concerns</div></div>" +
      "<div class=\"card-body\"><div class=\"stat-num mono\">" + issuesTotal + "</div><div class=\"stat-label\">still open</div></div></div>" +
      "</div>";

    var urgentNotes = state.generalNotes.filter(function (n) { return n.urgency === "Urgent"; })
      .slice().reverse();
    if (urgentNotes.length) {
      var urgentRows = urgentNotes.map(function (n) {
        return "<button class=\"nav-item\" data-action=\"nav-view\" data-view=\"notes\">" +
          "<span class=\"name\">" + esc((n.text || "").replace(/<[^>]*>/g, " ").replace(/\s+/g, " ").trim().slice(0, 80) || "(empty note)") + "</span>" +
          "</button>";
      }).join("");
      html += "<div class=\"card card-compact alerts-card\"><div class=\"card-head\"><div class=\"card-title\">Urgent Announcements" +
        " <span class=\"count-chip\">" + urgentNotes.length + "</span></div></div>" +
        "<div class=\"card-body\"><div class=\"nav-list\">" + urgentRows + "</div></div></div>";
    }

    if (state.schools.length === 0) {
      html += "<div class=\"card\"><div class=\"card-body\"><p style=\"margin-bottom:10px;\">No schools yet. Use <strong>+ Add school</strong> in the sidebar to create the first one — each school gets its own page for tasks, the yearly checklist, an email tracker, and notes.</p></div></div>";
    }
    return html;
  }
  function statTile(num, label, small) {
    return "<div class=\"stat-tile" + (small ? " stat-tile-sm" : "") + "\"><div class=\"stat-num mono\">" + num + "</div><div class=\"stat-label\">" + esc(label) + "</div></div>";
  }

  /* ---------- School page ---------- */
  function vaDatalist() {
    return "<datalist id=\"va-list\">" + state.vas.map(function (v) { return "<option value=\"" + esc(v.name) + "\">"; }).join("") + "</datalist>";
  }

  function vaTagColor(name) {
    var hue = 0;
    for (var i = 0; i < name.length; i++) hue = (hue * 31 + name.charCodeAt(i)) % 360;
    return "hsla(" + hue + ",60%,50%,0.2)";
  }

  function taskVaGroupHtml(t, schoolId) {
    var names = Array.isArray(t.vaAssigned) ? t.vaAssigned : (t.vaAssigned ? [t.vaAssigned] : []);
    var chips = names.map(function (name) {
      return "<span class=\"va-tag\" style=\"background:" + vaTagColor(name) + ";\">" + esc(name) +
        "<button class=\"va-tag-remove\" data-action=\"remove-va-from-task\" data-id=\"" + t.id + "\" data-school=\"" + schoolId + "\" data-va=\"" + esc(name) + "\" title=\"Remove " + esc(name) + "\">×</button>" +
        "</span>";
    }).join("");
    var control = "";
    if (ui.addingVaForTask === t.id) {
      var available = state.vas.filter(function (v) { return names.indexOf(v.name) === -1; });
      var opts = "<option value=\"\" disabled selected>Add VA…</option>" + available.map(function (v) {
        return "<option value=\"" + esc(v.name) + "\">" + esc(v.name) + "</option>";
      }).join("");
      control = "<select class=\"text-input va-add-select\" data-action-change=\"add-va-to-task\" data-id=\"" + t.id + "\" data-school=\"" + schoolId + "\">" + opts + "</select>" +
        "<button class=\"link-btn\" data-action=\"cancel-add-va-for-task\">Cancel</button>";
    } else {
      control = "<button class=\"add-va-btn\" data-action=\"toggle-add-va-for-task\" data-id=\"" + t.id + "\" title=\"Add a VA\">+</button>";
    }
    return "<span class=\"va-group\">" + chips + control + "</span>";
