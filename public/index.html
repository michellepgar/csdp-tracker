  function schoolPageHtml(schoolId) {
    var school = schoolById(schoolId);
    if (!school) { ui.view = { type: "home" }; return homePageHtml(); }
    var sd = ensureSchoolData(schoolId);

    var header = "<div class=\"page-header\">" +
      "<div><div class=\"page-title display\">" + esc(school.name) + "</div>" +
      "<div class=\"field-row\" style=\"margin-top:8px;\">" +
      "<span class=\"field-label\">VA assigned</span>" +
      "<input class=\"text-input\" style=\"width:200px;\" list=\"va-list\" value=\"" + esc(sd.vaAssigned) + "\" data-action-change=\"set-va-assigned\" data-school=\"" + schoolId + "\" placeholder=\"Type a name\">" +
      "</div></div>" +
      "<button class=\"link-btn danger\" data-action=\"remove-school\" data-id=\"" + schoolId + "\">" +
        (isPending("school", schoolId) ? "Really remove " + esc(school.name) + " and all its data? Click again to confirm" : "Remove school") + "</button>" +
      "</div>" + vaDatalist();

    return header +
      tasksCardHtml(schoolId, sd) +
      checklistCardHtml(schoolId) +
      emailTrackerCardHtml(schoolId, sd);
  }

  function taskRowHtml(t, schoolId) {
    var needsComm = COMMUNICATION_CATEGORIES.indexOf(t.category) !== -1;
    var needsCount = COUNT_CATEGORIES.indexOf(t.category) !== -1;
    return "<div class=\"row-item\"><div class=\"row-main\"><span class=\"task-file-group\"><span class=\"row-file mono\">" + esc(t.fileName) + "</span>" +
      (needsCount ? "<span class=\"field-mini-label\">Count</span><input class=\"text-input count-input\" type=\"number\" min=\"0\" value=\"" + esc(t.count || "") + "\" placeholder=\"0\" data-action-change=\"set-task-count\" data-id=\"" + t.id + "\" data-school=\"" + schoolId + "\">" : "") +
      "</span></div>" +
      taskVaGroupHtml(t, schoolId) +
      statusControl("task", t.id, t.status, "toggle-task-status", schoolId) +
      (needsComm ? "<span class=\"field-mini-label\">Communication</span>" + statusControl("communication", t.id, t.communication || "", "change-task-communication", schoolId) : "") +
      deleteBtn("task", t.id, "remove-task", schoolId) + "</div>";
  }

  function tasksCardHtml(schoolId, sd) {
    var open = countNotDone(sd.tasks);
    var cats = state.taskCategories;
    var catNames = cats.map(function (c) { return c.name; });

    var groupsHtml = cats.map(function (c) {
      var items = sd.tasks.filter(function (t) { return t.category === c.name; }).slice().reverse();
      return "<div class=\"task-group\"><div class=\"task-group-title\"><span>" + esc(c.name) + "</span>" +
        (items.length ? "<span class=\"count-chip\">" + items.length + "</span>" : "") + "</div>" +
        "<div class=\"row-list\">" + (items.map(function (t) { return taskRowHtml(t, schoolId); }).join("") || emptyState("No files yet in this category.")) + "</div></div>";
    }).join("");

    var orphaned = sd.tasks.filter(function (t) { return catNames.indexOf(t.category) === -1; }).slice().reverse();
    if (orphaned.length) {
      groupsHtml += "<div class=\"task-group\"><div class=\"task-group-title\"><span>Other</span><span class=\"count-chip\">" + orphaned.length + "</span></div>" +
        "<div class=\"row-list\">" + orphaned.map(function (t) { return taskRowHtml(t, schoolId); }).join("") + "</div></div>";
    }

    var catOptions = cats.map(function (c) { return "<option value=\"" + esc(c.name) + "\">" + esc(c.name) + "</option>"; }).join("");

    var editorHtml = "";
    if (ui.taskCategoryEditorOpen) {
      var catRows = cats.map(function (c, idx) {
        return "<div class=\"template-item-row\"><div class=\"row-main\">" + esc(c.name) + "</div>" +
          "<div class=\"stack-btns\">" +
          "<button" + (idx === 0 ? " disabled" : "") + " data-action=\"move-task-category\" data-id=\"" + c.id + "\" data-dir=\"up\">▲</button>" +
          "<button" + (idx === cats.length - 1 ? " disabled" : "") + " data-action=\"move-task-category\" data-id=\"" + c.id + "\" data-dir=\"down\">▼</button>" +
          "</div>" +
          deleteBtn("task-category", c.id, "remove-task-category") + "</div>";
      }).join("");
      editorHtml = "<div class=\"template-card\" style=\"margin-bottom:14px; padding:14px;\">" +
        "<div class=\"checklist-note\">Editing this list changes the categories for every school. Existing files keep their category name even if it's later removed here.</div>" +
        catRows +
        "<form class=\"add-row-form\" style=\"margin-top:10px;\" data-action=\"add-task-category\">" +
        "<input class=\"text-input\" name=\"name\" placeholder=\"New category\" required>" +
        "<button class=\"btn\" type=\"submit\">Add</button></form></div>";
    }

    return "<div class=\"card\"><div class=\"card-head\">" +
      "<div class=\"card-title\">Tasks" + (open > 0 ? " <span class=\"count-chip\">" + open + "</span>" : "") + "</div>" +
      "<div class=\"card-actions\"><button class=\"link-btn\" data-action=\"toggle-task-category-editor\">" + (ui.taskCategoryEditorOpen ? "Close editor" : "Edit categories") + "</button></div>" +
      "</div><div class=\"card-body\">" + editorHtml +
      "<form class=\"add-row-form\" data-action=\"add-task\" data-school=\"" + schoolId + "\">" +
        "<select class=\"text-input\" name=\"category\">" + catOptions + "</select>" +
        "<input class=\"text-input mono\" name=\"fileName\" placeholder=\"File name, e.g. Q3-enrollment-report.xlsx\" required style=\"flex:2;\">" +
        "<button class=\"btn\" type=\"submit\">Add</button></form>" +
      groupsHtml +
      "</div></div>";
  }

  function statusControl(type, id, status, action, schoolId) {
    return statusControlOptions(STATUS_OPTIONS[type], id, status, action, schoolId);
  }

  function statusControlOptions(options, id, status, action, schoolId) {
    var opts = options.map(function (o) {
      return "<option value=\"" + esc(o) + "\"" + (o === status ? " selected" : "") + ">" + esc(o || "—") + "</option>";
    }).join("");
    return "<select class=\"status-select " + (STATUS_TIER[status] || "neutral") + "\" data-action-change=\"" + action + "\" data-id=\"" + id + "\"" +
      (schoolId ? " data-school=\"" + schoolId + "\"" : "") + ">" + opts + "</select>";
  }

  function deleteBtn(type, id, action, schoolId) {
    var pending = isPending(type, id);
    return "<button class=\"icon-btn" + (pending ? " confirming" : "") + "\" data-action=\"" + action + "\" data-id=\"" + id + "\"" +
      (schoolId ? " data-school=\"" + schoolId + "\"" : "") + " title=\"Remove\">" + (pending ? "Confirm?" : "✕") + "</button>";
  }

  function emptyState(text) { return "<div class=\"empty-state\">" + esc(text) + "</div>"; }

  function checklistCardHtml(schoolId) {
    var tmpl = state.checklistTemplate;
    var doneCount = 0;
    tmpl.forEach(function (item) {
      var p = state.checklistProgress[schoolId + ":" + item.id];
      if (p && p.status === "Done") doneCount++;
    });

    var rows = tmpl.map(function (item) {
      var p = state.checklistProgress[schoolId + ":" + item.id] || { status: "Open" };
      var done = p.status === "Done";
      return "<div class=\"checklist-item\">" +
        "<button class=\"check-toggle" + (done ? " done" : "") + "\" data-action=\"toggle-checklist\" data-school=\"" + schoolId + "\" data-item=\"" + item.id + "\">" + (done ? "✓" : "") + "</button>" +
        "<div class=\"row-main\"><div class=\"row-title\">" + esc(item.description) + "</div>" +
        (done && p.completedBy ? "<div class=\"row-meta\">Done by " + esc(p.completedBy) + "</div>" : "") +
        "</div></div>";
    }).join("");

    var editorHtml = "";
    if (ui.templateEditorOpen) {
      var tmplRows = tmpl.map(function (item, idx) {
        return "<div class=\"template-item-row\"><div class=\"row-main\">" + esc(item.description) + "</div>" +
          "<div class=\"stack-btns\">" +
          "<button" + (idx === 0 ? " disabled" : "") + " data-action=\"move-template-item\" data-id=\"" + item.id + "\" data-dir=\"up\">▲</button>" +
          "<button" + (idx === tmpl.length - 1 ? " disabled" : "") + " data-action=\"move-template-item\" data-id=\"" + item.id + "\" data-dir=\"down\">▼</button>" +
          "</div>" +
          deleteBtn("template-item", item.id, "remove-template-item") + "</div>";
      }).join("");
      editorHtml = "<div class=\"template-card\" style=\"margin-bottom:14px; padding:14px;\">" +
        "<div class=\"checklist-note\">Editing this list changes the checklist for every school — it's one shared, standard template.</div>" +
        tmplRows +
        "<form class=\"add-row-form\" style=\"margin-top:10px;\" data-action=\"add-template-item\">" +
        "<input class=\"text-input\" name=\"description\" placeholder=\"New checklist item\" required>" +
        "<button class=\"btn\" type=\"submit\">Add</button></form></div>";
    }

    return "<div class=\"card\"><div class=\"card-head\">" +
      "<div class=\"card-title\">Yearly Checklist" + (tmpl.length > 0 ? " <span class=\"count-chip\" style=\"background:var(--done-soft); color:var(--done);\">" + doneCount + "/" + tmpl.length + "</span>" : "") + "</div>" +
      "<div class=\"card-actions\"><button class=\"link-btn\" data-action=\"toggle-template-editor\">" + (ui.templateEditorOpen ? "Close editor" : "Edit template") + "</button></div>" +
      "</div><div class=\"card-body\">" + editorHtml +
      "<div class=\"row-list\">" + (rows || emptyState("No checklist items yet — use “Edit template” to add the first one.")) + "</div>" +
      "</div></div>";
  }

  function emailTrackerCardHtml(schoolId, sd) {
    var open = countNotDone(sd.emailTracker);
    var rows = sd.emailTracker.slice().reverse().map(function (e) {
      return "<div class=\"row-item\"><div class=\"row-main\"><div class=\"row-title\">" + esc(e.description) + "</div></div>" +
        statusControl("email_followup", e.id, e.status, "change-email-status", schoolId) +
        deleteBtn("email-item", e.id, "remove-email-item", schoolId) + "</div>";
    }).join("");
    return "<div class=\"card\"><div class=\"card-head\"><div class=\"card-title\">Email Tracker" + (open > 0 ? " <span class=\"count-chip\">" + open + "</span>" : "") + "</div></div>" +
      "<div class=\"card-body\">" +
      "<form class=\"add-row-form\" data-action=\"add-email-item\" data-school=\"" + schoolId + "\">" +
        "<input class=\"text-input\" name=\"description\" placeholder=\"What's the email about?\" required>" +
        "<button class=\"btn\" type=\"submit\">Add</button></form>" +
      "<div class=\"row-list\">" + (rows || emptyState("Nothing being tracked — add an email that needs a response or a reply.")) + "</div>" +
      "</div></div>";
  }

  function notesCardHtml(scope, schoolId, notes) {
    var draftName = scope === "school" ? "note-" + schoolId : (scope === "suggestion" ? "note-suggestion" : "note-general");
    var title = scope === "school" ? "Notes" : (scope === "suggestion" ? "Suggestions" : "General Notes");
    var placeholder = scope === "suggestion" ? "Suggest something to add or change…" : "Add a note…";
    var buttonLabel = scope === "suggestion" ? "Add suggestion" : "Add note";
    var emptyText = scope === "suggestion" ? "No suggestions yet." : "No notes yet.";
    var list = notes.slice().reverse().map(function (n) {
      return "<div class=\"note-entry\"><div class=\"note-text\">" + esc(n.text) + "</div>" +
        "<div class=\"note-meta\">" + esc(n.author || "Unnamed") + " · " + fmtDateTime(n.createdAt) + "</div></div>";
    }).join("");
    var authorFieldHtml =
      "<div class=\"field-row\" style=\"margin-top:8px;\">" +
      "<input class=\"text-input\" style=\"width:180px;\" list=\"va-list\" name=\"author\" placeholder=\"Your name\" value=\"" + esc(getStoredIdentity()) + "\">" +
      "<button class=\"btn\" type=\"submit\">" + buttonLabel + "</button></div>";
    return "<div class=\"card\"><div class=\"card-head\"><div class=\"card-title\">" + title + "</div></div>" +
      "<div class=\"card-body\">" +
      "<form data-action=\"add-note\" data-scope=\"" + scope + "\" " + (schoolId ? "data-school=\"" + schoolId + "\"" : "") + ">" +
        "<textarea class=\"text-input\" name=\"text\" placeholder=\"" + placeholder + "\" data-draft-key=\"" + draftName + "\">" + esc(loadDraft(draftName)) + "</textarea>" +
        authorFieldHtml +
      "</form>" + vaDatalist() +
      "<div class=\"row-list\" style=\"margin-top:14px;\">" + (list || emptyState(emptyText)) + "</div>" +
      "</div></div>";
  }

  /* ---------- Issues & Concerns ---------- */
  /* Each issue type carries its own field set beyond the shared School /
     Issue / Reported by / Status fields: Record Update needs what's being
     corrected, Record Needs Rechecking needs the file/page it lives on.
     `v` supplies current values (empty object for a blank Add form). */
  function issueExtraFieldsHtml(fieldSet, v) {
    v = v || {};
    if (fieldSet === "record_update") {
      return "<div class=\"add-row-form\" style=\"margin-top:8px;\">" +
        "<span class=\"field-mini-label\">Correcting</span><select class=\"text-input\" name=\"category\">" + CORRECTION_CATEGORIES.map(function (c) { return "<option value=\"" + esc(c) + "\"" + (c === v.category ? " selected" : "") + ">" + esc(c) + "</option>"; }).join("") + "</select>" +
        "<input class=\"text-input\" name=\"studentName\" placeholder=\"Student name\" value=\"" + esc(v.studentName) + "\">" +
        "<span class=\"field-mini-label\">Date of birth</span><input class=\"text-input\" type=\"date\" name=\"dob\" style=\"max-width:160px;\" value=\"" + esc(v.dob) + "\">" +
        "<input class=\"text-input\" name=\"insuranceNumber\" placeholder=\"Insurance number\" value=\"" + esc(v.insuranceNumber) + "\">" +
        "</div>" +
        "<div class=\"add-row-form\" style=\"margin-top:8px;\">" +
        "<input class=\"text-input\" name=\"correctInfo\" placeholder=\"Correct info\" style=\"flex:2;\" value=\"" + esc(v.correctInfo) + "\">" +
        "</div>";
    }
    if (fieldSet === "recheck") {
      return "<div class=\"add-row-form\" style=\"margin-top:8px;\">" +
        "<input class=\"text-input\" name=\"studentName\" placeholder=\"Student name\" value=\"" + esc(v.studentName) + "\">" +
        "<input class=\"text-input\" name=\"schoolYear\" placeholder=\"School year, e.g. 2025–2026\" value=\"" + esc(v.schoolYear) + "\">" +
        "<span class=\"field-mini-label\">Date of birth</span><input class=\"text-input\" type=\"date\" name=\"dob\" style=\"max-width:160px;\" value=\"" + esc(v.dob) + "\">" +
        "<input class=\"text-input\" name=\"insuranceNumber\" placeholder=\"Insurance number\" value=\"" + esc(v.insuranceNumber) + "\">" +
        "</div>" +
        "<div class=\"add-row-form\" style=\"margin-top:8px;\">" +
        "<input class=\"text-input mono\" name=\"fileName\" placeholder=\"File name\" value=\"" + esc(v.fileName) + "\">" +
        "<input class=\"text-input\" name=\"pageNumber\" placeholder=\"Page #\" style=\"max-width:100px;\" value=\"" + esc(v.pageNumber) + "\">" +
        "</div>";
    }
    return "";
  }
  function issueDescriptionLabel(fieldSet) {
    return fieldSet === "recheck" ? "What needs to be rechecked?" : "What's the issue?";
  }
  function issueEditFormHtml(it) {
    var schoolOptsEdit = state.schools.slice().sort(function (a, b) { return a.name.localeCompare(b.name); })
      .map(function (s) { return "<option value=\"" + s.id + "\"" + (s.id === it.schoolId ? " selected" : "") + ">" + esc(s.name) + "</option>"; }).join("");
    var vaOptsEdit = state.vas.slice().sort(function (a, b) { return a.name.localeCompare(b.name); })
      .map(function (v) { return "<option value=\"" + esc(v.name) + "\"" + (v.name === it.reportedBy ? " selected" : "") + ">" + esc(v.name) + "</option>"; }).join("");
    var editTypeId = ui.editingIssueType || it.type;
    var editType = issueTypeById(editTypeId);
    var editFieldSet = editType && editType.fieldSet;
    var typeOptsEdit = state.issueTypes.map(function (ty) {
      return "<option value=\"" + ty.id + "\"" + (ty.id === editTypeId ? " selected" : "") + ">" + esc(ty.name) + "</option>";
    }).join("");
    /* Remarks can always be added here, on any type, whether or not it had
       anything filled in when it was first created. */
    var remarksHtml = "<textarea class=\"text-input\" name=\"remarks\" placeholder=\"Remarks\" style=\"margin-top:8px; min-height:56px;\">" + esc(it.remarks) + "</textarea>";
    return "<div class=\"row-item\" style=\"flex-direction:column; align-items:stretch;\">" +
      "<form class=\"add-row-form\" data-action=\"save-issue-edit\" data-id=\"" + it.id + "\">" +
      "<select class=\"text-input\" name=\"schoolId\" required>" + schoolOptsEdit + "</select>" +
      "<select class=\"text-input\" name=\"type\" data-action-change=\"select-edit-issue-type\">" + typeOptsEdit + "</select>" +
      "<input class=\"text-input\" name=\"description\" placeholder=\"" + esc(issueDescriptionLabel(editFieldSet)) + "\" required style=\"flex:2;\" value=\"" + esc(it.description) + "\">" +
      "<select class=\"text-input\" name=\"reportedBy\"><option value=\"\">Reported by…</option>" + vaOptsEdit + "</select>" +
      issueExtraFieldsHtml(editFieldSet, it) +
      remarksHtml +
      "<div class=\"tmpl-actions\"><button class=\"btn\" type=\"submit\">Save</button>" +
      "<button class=\"btn ghost\" type=\"button\" data-action=\"cancel-edit-issue\">Cancel</button></div>" +
      "</form></div>";
  }

  function issuesPageHtml() {
    var f = ui.issueFilters;
    var list = state.issues.slice().reverse().filter(function (it) {
      if (f.school && it.schoolId !== f.school) return false;
      if (f.type && it.type !== f.type) return false;
      if (f.status && it.status !== f.status) return false;
      return true;
    });
    var schoolOpts = state.schools.slice().sort(function (a, b) { return a.name.localeCompare(b.name); })
      .map(function (s) { return "<option value=\"" + s.id + "\"" + (f.school === s.id ? " selected" : "") + ">" + esc(s.name) + "</option>"; }).join("");
    var addSchoolOpts = state.schools.slice().sort(function (a, b) { return a.name.localeCompare(b.name); })
      .map(function (s) { return "<option value=\"" + s.id + "\">" + esc(s.name) + "</option>"; }).join("");
    var vaOpts = state.vas.slice().sort(function (a, b) { return a.name.localeCompare(b.name); })
      .map(function (v) { return "<option value=\"" + esc(v.name) + "\"" + (v.name === getStoredIdentity() ? " selected" : "") + ">" + esc(v.name) + "</option>"; }).join("");
    var typeFilterOpts = state.issueTypes.map(function (ty) {
      return "<option value=\"" + ty.id + "\"" + (f.type === ty.id ? " selected" : "") + ">" + esc(ty.name) + "</option>";
    }).join("");

    var newTypeId = ui.newIssueType && issueTypeById(ui.newIssueType) ? ui.newIssueType : (state.issueTypes[0] ? state.issueTypes[0].id : "");
    var newType = issueTypeById(newTypeId);
    var newFieldSet = newType && newType.fieldSet;
    var newTypeOpts = state.issueTypes.map(function (ty) {
      return "<option value=\"" + ty.id + "\"" + (ty.id === newTypeId ? " selected" : "") + ">" + esc(ty.name) + "</option>";
    }).join("");
    /* No Remarks field here on purpose — it's meant to be filled in later,
       from Edit, once there's something to report back. */
    var extraFieldsHtml = issueExtraFieldsHtml(newFieldSet, {});

    var typeEditorHtml = "";
    if (ui.issueTypeEditorOpen) {
      var typeRows = state.issueTypes.map(function (ty, idx) {
        return "<div class=\"template-item-row\"><div class=\"row-main\">" + esc(ty.name) +
          "<div class=\"row-meta\">" + ty.statusOptions.map(esc).join(" · ") + "</div></div>" +
          "<div class=\"stack-btns\">" +
          "<button" + (idx === 0 ? " disabled" : "") + " data-action=\"move-issue-type\" data-id=\"" + ty.id + "\" data-dir=\"up\">▲</button>" +
          "<button" + (idx === state.issueTypes.length - 1 ? " disabled" : "") + " data-action=\"move-issue-type\" data-id=\"" + ty.id + "\" data-dir=\"down\">▼</button>" +
          "</div>" +
          deleteBtn("issue-type", ty.id, "remove-issue-type") + "</div>";
      }).join("");
      typeEditorHtml = "<div class=\"template-card\" style=\"margin-bottom:14px; padding:14px;\">" +
        "<div class=\"checklist-note\">New types get a generic status (" + NEW_ISSUE_TYPE_STATUS_OPTIONS.join(" / ") + "). Removing a type leaves its past entries labeled with the old type name.</div>" +
        typeRows +
        "<form class=\"add-row-form\" style=\"margin-top:10px;\" data-action=\"add-issue-type\">" +
        "<input class=\"text-input\" name=\"name\" placeholder=\"New type name\" required>" +
        "<button class=\"btn\" type=\"submit\">Add</button></form></div>";
    }

    var normalList = list.filter(function (it) { var ty = issueTypeById(it.type); return !(ty && ty.fieldSet); });
    var recordList = list.filter(function (it) { var ty = issueTypeById(it.type); return ty && ty.fieldSet === "record_update"; });
    var recheckList = list.filter(function (it) { var ty = issueTypeById(it.type); return ty && ty.fieldSet === "recheck"; });

    var normalTableCols = 6;
    var rows = normalList.map(function (it) {
      if (ui.editingIssueId === it.id) {
        return "<tr><td colspan=\"" + normalTableCols + "\">" + issueEditFormHtml(it) + "</td></tr>";
      }
      var ty = issueTypeById(it.type);
      return "<tr>" +
        "<td>" + esc(ty ? ty.name : "Removed type") + "</td>" +
        "<td class=\"wrap\">" + esc(it.description) + "</td>" +
        "<td>" + esc(it.reportedBy) + "</td>" +
        "<td class=\"wrap\">" + esc(it.remarks || "") + "</td>" +
        "<td>" + statusControlOptions(ty ? ty.statusOptions : NEW_ISSUE_TYPE_STATUS_OPTIONS, it.id, it.status, "change-issue-status") + "</td>" +
        "<td><button class=\"link-btn\" data-action=\"edit-issue\" data-id=\"" + it.id + "\">Edit</button>" + deleteBtn("issue", it.id, "remove-issue") + "</td>" +
        "</tr>";
    }).join("");

    var recordTableCols = 11;
    var recordRows = recordList.map(function (it) {
      if (ui.editingIssueId === it.id) {
        return "<tr><td colspan=\"" + recordTableCols + "\">" + issueEditFormHtml(it) + "</td></tr>";
      }
      var sch = schoolById(it.schoolId);
      var ty = issueTypeById(it.type);
      return "<tr>" +
        "<td>" + esc(it.category) + "</td>" +
        "<td>" + esc(it.studentName) + "</td>" +
        "<td>" + esc(sch ? sch.name : "Unknown school") + "</td>" +

  /* ============ navigation ============ */
  function goTo(view) {
    ui.view = view;
    ui.sidebarOpen = false;
    ui.templateEditorOpen = false;
    ui.pendingDelete = null;
    saveStoredView();
  }

  /* ============ event handling ============ */
  function onClick(e) {
    var t = e.target.closest("[data-action]");
    if (!t) return;
    var action = t.getAttribute("data-action");
    switch (action) {
      case "nav-school":
        goTo({ type: "school", id: t.getAttribute("data-id") });
        render(); break;
      case "nav-view":
        goTo({ type: t.getAttribute("data-view") });
        render(); break;
      case "nav-issues-status":
        ui.issueFilters = { school: "", type: "", status: t.getAttribute("data-status") };
        goTo({ type: "issues" });
        render(); break;
      case "toggle-sidebar": ui.sidebarOpen = !ui.sidebarOpen; render(); break;
      case "toggle-sidebar-collapse":
        ui.sidebarCollapsed = !ui.sidebarCollapsed;
        saveSidebarCollapsed(ui.sidebarCollapsed);
        render(); break;
      case "toggle-theme":
        setStoredTheme(currentEffectiveTheme() === "dark" ? "light" : "dark");
        applyTheme();
        render(); break;
      case "pick-identity":
        handleIdentityPick(t.getAttribute("data-name"));
        break;
      case "back-to-identity-picker":
        showIdentityPicker();
        break;
      case "close-sidebar": ui.sidebarOpen = false; render(); break;
      case "toggle-add-school": ui.addSchoolOpen = !ui.addSchoolOpen; render(); break;
      case "toggle-template-editor": ui.templateEditorOpen = !ui.templateEditorOpen; render(); break;
      case "toggle-task-category-editor": ui.taskCategoryEditorOpen = !ui.taskCategoryEditorOpen; render(); break;
      case "toggle-add-va-for-task": ui.addingVaForTask = t.getAttribute("data-id"); render(); break;
      case "cancel-add-va-for-task": ui.addingVaForTask = null; render(); break;
      case "remove-va-from-task":
        (function () {
          var sd = ensureSchoolData(t.getAttribute("data-school"));
          var task = sd.tasks.find(function (x) { return x.id === t.getAttribute("data-id"); });
          if (task) {
            var names = Array.isArray(task.vaAssigned) ? task.vaAssigned : [];
            task.vaAssigned = names.filter(function (n) { return n !== t.getAttribute("data-va"); });
          }
          persist();
        })(); break;
      case "remove-task-category":
        requestDelete("task-category", t.getAttribute("data-id"), function () {
          state.taskCategories = state.taskCategories.filter(function (x) { return x.id !== t.getAttribute("data-id"); });
        }); break;
      case "move-task-category":
        (function () {
          var id = t.getAttribute("data-id"), dir = t.getAttribute("data-dir");
          var idx = state.taskCategories.findIndex(function (x) { return x.id === id; });
          var swapWith = dir === "up" ? idx - 1 : idx + 1;
          if (swapWith < 0 || swapWith >= state.taskCategories.length) return;
          var tmp = state.taskCategories[idx];
          state.taskCategories[idx] = state.taskCategories[swapWith];
          state.taskCategories[swapWith] = tmp;
          persist();
        })(); break;
      case "toggle-issue-type-editor": ui.issueTypeEditorOpen = !ui.issueTypeEditorOpen; render(); break;
      case "set-eod-view": ui.eodViewMode = t.getAttribute("data-mode"); render(); break;
      case "edit-issue":
        ui.editingIssueId = t.getAttribute("data-id");
        ui.editingIssueType = null;
        render(); break;
      case "cancel-edit-issue":
        ui.editingIssueId = null;
        ui.editingIssueType = null;
        render(); break;
      case "edit-note":
        ui.editingNoteId = t.getAttribute("data-id");
        render(); break;
      case "cancel-edit-note":
        ui.editingNoteId = null;
        render(); break;
      case "remove-note":
        (function () {
          var id = t.getAttribute("data-id");
          var scope = t.getAttribute("data-scope");
          requestDelete("note", id, function () {
            var arr = scope === "private" ? state.privateNotes : state.generalNotes;
            var idx = arr.findIndex(function (x) { return x.id === id; });
            if (idx !== -1) arr.splice(idx, 1);
          });
        })(); break;
      case "remove-issue-type":
        requestDelete("issue-type", t.getAttribute("data-id"), function () {
          state.issueTypes = state.issueTypes.filter(function (x) { return x.id !== t.getAttribute("data-id"); });
        }); break;
      case "move-issue-type":
        (function () {
          var id = t.getAttribute("data-id"), dir = t.getAttribute("data-dir");
          var idx = state.issueTypes.findIndex(function (x) { return x.id === id; });
          var swapWith = dir === "up" ? idx - 1 : idx + 1;
          if (swapWith < 0 || swapWith >= state.issueTypes.length) return;
          var tmp = state.issueTypes[idx];
          state.issueTypes[idx] = state.issueTypes[swapWith];
          state.issueTypes[swapWith] = tmp;
          persist();
        })(); break;
      case "toggle-template-open":
        var tid = t.getAttribute("data-id");
        ui.openTemplateId = ui.openTemplateId === tid ? null : tid;
        if (ui.editingTemplateId !== tid) ui.editingTemplateId = null;
        render(); break;
      case "new-template":
        ui.editingTemplateId = ui.editingTemplateId === "new" ? null : "new";
        render(); break;
      case "edit-template":
        ui.editingTemplateId = t.getAttribute("data-id");
        ui.openTemplateId = t.getAttribute("data-id");
        render(); break;
      case "cancel-template-edit":
        ui.editingTemplateId = null; render(); break;
      case "copy-template":
        (function () {
          var tp = state.emailTemplates.find(function (x) { return x.id === t.getAttribute("data-id"); });
          if (!tp) return;
          var text = "Subject: " + tp.subject + "\n\n" + tp.body;
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(function () { showToast("Copied to clipboard."); }).catch(function () { showToast("Couldn't copy — select and copy manually."); });
          } else { showToast("Clipboard not available here — select and copy manually."); }
        })(); break;
      case "delete-template":
        requestDelete("template", t.getAttribute("data-id"), function () {
          state.emailTemplates = state.emailTemplates.filter(function (x) { return x.id !== t.getAttribute("data-id"); });
        }); break;
      case "toggle-task-status":
        break; /* handled on change */
      case "remove-task":
        requestDelete("task", t.getAttribute("data-id"), function () {
          var sd = ensureSchoolData(t.getAttribute("data-school"));
          sd.tasks = sd.tasks.filter(function (x) { return x.id !== t.getAttribute("data-id"); });
        }); break;
      case "remove-email-item":
        requestDelete("email-item", t.getAttribute("data-id"), function () {
          var sd = ensureSchoolData(t.getAttribute("data-school"));
          sd.emailTracker = sd.emailTracker.filter(function (x) { return x.id !== t.getAttribute("data-id"); });
        }); break;
      case "remove-issue":
        requestDelete("issue", t.getAttribute("data-id"), function () {
          state.issues = state.issues.filter(function (x) { return x.id !== t.getAttribute("data-id"); });
        }); break;
      case "remove-template-item":
        requestDelete("template-item", t.getAttribute("data-id"), function () {
          var tmplId = t.getAttribute("data-id");
          state.checklistTemplate = state.checklistTemplate.filter(function (x) { return x.id !== tmplId; });
          Object.keys(state.checklistProgress).forEach(function (k) { if (k.indexOf(":" + tmplId) !== -1) delete state.checklistProgress[k]; });
        }); break;
      case "move-template-item":
        (function () {
          var id = t.getAttribute("data-id"), dir = t.getAttribute("data-dir");
          var idx = state.checklistTemplate.findIndex(function (x) { return x.id === id; });
          var swapWith = dir === "up" ? idx - 1 : idx + 1;
          if (swapWith < 0 || swapWith >= state.checklistTemplate.length) return;
          var tmp = state.checklistTemplate[idx];
          state.checklistTemplate[idx] = state.checklistTemplate[swapWith];
          state.checklistTemplate[swapWith] = tmp;
          persist();
        })(); break;
      case "remove-va":
        (function () {
          var id = t.getAttribute("data-id");
          state.vas = state.vas.filter(function (x) { return x.id !== id; });
          persist();
        })(); break;
      case "remove-school":
        requestDelete("school", t.getAttribute("data-id"), function () {
          var id = t.getAttribute("data-id");
          state.schools = state.schools.filter(function (x) { return x.id !== id; });
          delete state.schoolData[id];
          state.issues = state.issues.filter(function (x) { return x.schoolId !== id; });
          Object.keys(state.checklistProgress).forEach(function (k) { if (k.indexOf(id + ":") === 0) delete state.checklistProgress[k]; });
          if (ui.view.type === "school" && ui.view.id === id) goTo({ type: "home" });
        }); break;
      case "toggle-checklist":
        (function () {
          var schoolId = t.getAttribute("data-school"), itemId = t.getAttribute("data-item");
          var key = schoolId + ":" + itemId;
          var cur = state.checklistProgress[key];
          if (cur && cur.status === "Done") {
            state.checklistProgress[key] = { status: "Open" };
          } else {
            state.checklistProgress[key] = { status: "Done", completedBy: getStoredIdentity(), completedDate: new Date().toISOString() };
          }
          persist();
        })(); break;
      default: break;
    }
  }

  function onChange(e) {
    var t = e.target.closest("[data-action-change]");
    if (!t) return;
    var action = t.getAttribute("data-action-change");
    switch (action) {
      case "set-va-assigned":
        ensureSchoolData(t.getAttribute("data-school")).vaAssigned = t.value.trim();
        addVaIfNew(t.value);
        persist(); break;
      case "toggle-task-status":
        (function () {
          var sd = ensureSchoolData(t.getAttribute("data-school"));
          var task = sd.tasks.find(function (x) { return x.id === t.getAttribute("data-id"); });
          if (task) task.status = t.value;
          persist();
        })(); break;
      case "change-task-communication":
        (function () {
          var sd = ensureSchoolData(t.getAttribute("data-school"));
          var task = sd.tasks.find(function (x) { return x.id === t.getAttribute("data-id"); });
          if (task) task.communication = t.value;
          persist();
        })(); break;
      case "set-task-count":
        (function () {
          var sd = ensureSchoolData(t.getAttribute("data-school"));
          var task = sd.tasks.find(function (x) { return x.id === t.getAttribute("data-id"); });
          if (task) task.count = t.value;
          persist();
        })(); break;
      case "add-va-to-task":
        (function () {
          var sd = ensureSchoolData(t.getAttribute("data-school"));
          var task = sd.tasks.find(function (x) { return x.id === t.getAttribute("data-id"); });
          if (task && t.value) {
            var names = Array.isArray(task.vaAssigned) ? task.vaAssigned : [];
            if (names.indexOf(t.value) === -1) names.push(t.value);
            task.vaAssigned = names;
          }
          ui.addingVaForTask = null;
          persist();
        })(); break;
      case "change-email-status":
        (function () {
          var sd = ensureSchoolData(t.getAttribute("data-school"));
          var item = sd.emailTracker.find(function (x) { return x.id === t.getAttribute("data-id"); });
          if (item) item.status = t.value;
          persist();
        })(); break;
      case "change-issue-status":
        (function () {
          var item = state.issues.find(function (x) { return x.id === t.getAttribute("data-id"); });
          if (item) item.status = t.value;
          persist();
        })(); break;
      case "filter-issues":
        ui.issueFilters[t.getAttribute("data-field")] = t.value;
        render(); break;
      case "filter-eod":
        ui.eodFilterAuthor = t.value;
        render(); break;
      case "select-new-issue-type":
        ui.newIssueType = t.value;
        render(); break;
      case "select-edit-issue-type":
        ui.editingIssueType = t.value;
        render(); break;
      case "toggle-note-checkbox":
        (function () {
          var id = t.getAttribute("data-id");
          var scope = t.getAttribute("data-scope");
          var idx = parseInt(t.getAttribute("data-cb-index"), 10);
          var arr = scope === "private" ? state.privateNotes : state.generalNotes;
          var note = arr.find(function (x) { return x.id === id; });
          if (!note) return;
          var doc = new DOMParser().parseFromString(note.text || "", "text/html");
          var boxes = doc.querySelectorAll("input[type=checkbox]");
          var box = boxes[idx];
          if (!box) return;
          if (t.checked) box.setAttribute("checked", ""); else box.removeAttribute("checked");
          note.text = sanitizeNoteHtml(doc.body.innerHTML);
          persist();
        })(); break;
      default: break;
    }
  }

  function onInput(e) {
    var t = e.target;
    if (t.matches && t.matches("[data-role='school-search']")) { ui.search = t.value; render(); focusSearch(); return; }
    var key = t.getAttribute && t.getAttribute("data-draft-key");
    if (key) saveDraft(key, t.value);
  }
  function focusSearch() {
    var el = document.querySelector("[data-role='school-search']");
    if (el) { el.focus(); var v = el.value; el.value = ""; el.value = v; }
  }

  function onSubmit(e) {
    var form = e.target.closest("form[data-action]");
    if (!form) return;
    e.preventDefault();
    var action = form.getAttribute("data-action");
    var fd = new FormData(form);
    switch (action) {
      case "add-school":
        (function () {
          var name = (fd.get("name") || "").toString().trim();
          if (!name) return;
          var id = uid("sch");
          state.schools.push({ id: id, name: name });
          ensureSchoolData(id);
          ui.addSchoolOpen = false;
          goTo({ type: "school", id: id });
          persist();
        })(); break;
      case "add-task":
        (function () {
          var sid = form.getAttribute("data-school");
          var sd = ensureSchoolData(sid);
          var category = (fd.get("category") || "").toString();
          var currentIdentity = getStoredIdentity();
          var task = {
            id: uid("task"),
            category: category,
            fileName: (fd.get("fileName") || "").toString().trim(),
            vaAssigned: currentIdentity ? [currentIdentity] : [],
            status: ""
          };
          if (COMMUNICATION_CATEGORIES.indexOf(category) !== -1) task.communication = "";
          sd.tasks.push(task);
          persist();
        })(); break;
      case "add-task-category":
        (function () {
          var name = (fd.get("name") || "").toString().trim();
          if (!name) return;
          state.taskCategories.push({ id: uid("cat"), name: name });
          persist();
        })(); break;
      case "add-email-item":
        (function () {
          var sid = form.getAttribute("data-school");
          var sd = ensureSchoolData(sid);
          sd.emailTracker.push({ id: uid("mail"), description: (fd.get("description") || "").toString().trim(), status: "Needs My Response" });
          persist();
        })(); break;
      case "add-note":
        (function () {
          var scope = form.getAttribute("data-scope");
          var text = (fd.get("text") || "").toString().trim();
          if (!text) return;
          var author = (fd.get("author") || "").toString().trim();
          addVaIfNew(author);
          var entry = { id: uid("note"), text: text, author: author, createdAt: new Date().toISOString() };
          var draftName;
          if (scope === "school") {
            var sid = form.getAttribute("data-school");
            ensureSchoolData(sid).notes.push(entry);
            draftName = "note-" + sid;
          } else if (scope === "suggestion") {
            state.suggestions.push(entry);
            draftName = "note-suggestion";
          } else {
            state.generalNotes.push(entry);
            draftName = "note-general";
          }
          saveDraft(draftName, "");
          persist();
        })(); break;
      case "add-general-note":
        (function () {
          var editorEl = form.querySelector("[contenteditable]");
          syncNoteCheckboxAttrs(editorEl);
          var html = sanitizeNoteHtml(editorEl ? editorEl.innerHTML : "");
          if (!html || html === "<br>") return;
          var author = (fd.get("author") || "").toString().trim();
          addVaIfNew(author);
          var color = (fd.get("color") || DEFAULT_NOTE_COLOR).toString();
          var urgency = (fd.get("urgency") || "Normal").toString();
          state.generalNotes.push({ id: uid("note"), text: html, author: author, color: color, urgency: urgency, createdAt: new Date().toISOString() });
          persist();
        })(); break;
      case "add-private-note":
        (function () {
          var editorEl = form.querySelector("[contenteditable]");
          syncNoteCheckboxAttrs(editorEl);
          var html = sanitizeNoteHtml(editorEl ? editorEl.innerHTML : "");
          if (!html || html === "<br>") return;
          var color = (fd.get("color") || DEFAULT_NOTE_COLOR).toString();
          state.privateNotes.push({ id: uid("note"), text: html, author: getStoredIdentity(), color: color, createdAt: new Date().toISOString() });
          persist();
        })(); break;
      case "save-note-edit":
        (function () {
          var id = form.getAttribute("data-id");
          var scope = form.getAttribute("data-scope");
          var editorEl = form.querySelector("[contenteditable]");
          syncNoteCheckboxAttrs(editorEl);
          var html = sanitizeNoteHtml(editorEl ? editorEl.innerHTML : "");
          var color = (fd.get("color") || DEFAULT_NOTE_COLOR).toString();
          var urgency = (fd.get("urgency") || "Normal").toString();
          var arr = scope === "private" ? state.privateNotes : state.generalNotes;
          var note = arr.find(function (x) { return x.id === id; });
          if (note) { note.text = html; note.color = color; if (scope === "general") note.urgency = urgency; }
          ui.editingNoteId = null;
          persist();
        })(); break;
      case "add-eod":
        (function () {
          var tasksRaw = (fd.get("tasks") || "").toString();
          var tasks = tasksRaw.split("\n").map(function (s) { return s.trim(); }).filter(function (s) { return s; });
          var timeIn = (fd.get("timeIn") || "").toString();
          var timeOut = (fd.get("timeOut") || "").toString();
          var breakStart = (fd.get("breakStart") || "").toString();
          var breakEnd = (fd.get("breakEnd") || "").toString();
          var entry = {
            id: uid("eod"),
            author: getStoredIdentity(),
            date: (fd.get("date") || "").toString(),
            timeIn: timeIn,
            timeOut: timeOut,
            breakStart: breakStart,
            breakEnd: breakEnd,
            totalHours: computeEodTotalHours(timeIn, timeOut, breakStart, breakEnd),
            tasks: tasks,
            createdAt: new Date().toISOString()
          };
          state.eodReports.push(entry);
          persist();
        })(); break;
      case "add-issue":
        (function () {
          var typeId = (fd.get("type") || "").toString();
          var typeObj = issueTypeById(typeId);
          var statusOpts = typeObj ? typeObj.statusOptions : NEW_ISSUE_TYPE_STATUS_OPTIONS;
          var fieldSet = typeObj && typeObj.fieldSet;
          var issue = {
            id: uid("issue"), schoolId: (fd.get("schoolId") || "").toString(),
            type: typeId,
            description: (fd.get("description") || "").toString().trim(),
            reportedBy: (fd.get("reportedBy") || "").toString(),
            status: statusOpts[0] || "Open",
            remarks: ""
          };
          if (fieldSet === "record_update") {
            issue.studentName = (fd.get("studentName") || "").toString().trim();
            issue.dob = (fd.get("dob") || "").toString().trim();
            issue.insuranceNumber = (fd.get("insuranceNumber") || "").toString().trim();
            issue.category = (fd.get("category") || "").toString();
            issue.correctInfo = (fd.get("correctInfo") || "").toString().trim();
          } else if (fieldSet === "recheck") {
            issue.studentName = (fd.get("studentName") || "").toString().trim();
            issue.schoolYear = (fd.get("schoolYear") || "").toString().trim();
            issue.dob = (fd.get("dob") || "").toString().trim();
            issue.insuranceNumber = (fd.get("insuranceNumber") || "").toString().trim();
            issue.fileName = (fd.get("fileName") || "").toString().trim();
            issue.pageNumber = (fd.get("pageNumber") || "").toString().trim();
          }
          state.issues.push(issue);
          ui.newIssueType = null;
          persist();
        })(); break;
      case "save-issue-edit":
        (function () {
          var id = form.getAttribute("data-id");
          var issue = state.issues.find(function (x) { return x.id === id; });
          if (!issue) return;
          var typeId = (fd.get("type") || "").toString();
          var typeObj = issueTypeById(typeId);
          var fieldSet = typeObj && typeObj.fieldSet;
          issue.schoolId = (fd.get("schoolId") || "").toString();
          issue.type = typeId;
          issue.description = (fd.get("description") || "").toString().trim();
          issue.reportedBy = (fd.get("reportedBy") || "").toString();
          issue.remarks = (fd.get("remarks") || "").toString().trim();
          delete issue.studentName; delete issue.schoolYear; delete issue.grade;
          delete issue.dob; delete issue.insuranceNumber;
          delete issue.fileName; delete issue.pageNumber;
          delete issue.category; delete issue.correctInfo;
          if (fieldSet === "record_update") {
            issue.studentName = (fd.get("studentName") || "").toString().trim();
            issue.dob = (fd.get("dob") || "").toString().trim();
            issue.insuranceNumber = (fd.get("insuranceNumber") || "").toString().trim();
            issue.category = (fd.get("category") || "").toString();
            issue.correctInfo = (fd.get("correctInfo") || "").toString().trim();
          } else if (fieldSet === "recheck") {
            issue.studentName = (fd.get("studentName") || "").toString().trim();
            issue.schoolYear = (fd.get("schoolYear") || "").toString().trim();
            issue.dob = (fd.get("dob") || "").toString().trim();
            issue.insuranceNumber = (fd.get("insuranceNumber") || "").toString().trim();
            issue.fileName = (fd.get("fileName") || "").toString().trim();
            issue.pageNumber = (fd.get("pageNumber") || "").toString().trim();
          }
          ui.editingIssueId = null;
          ui.editingIssueType = null;
          persist();
        })(); break;
      case "create-pin":
        (function () {
          var name = form.getAttribute("data-name");
          var pin = (fd.get("pin") || "").toString();
          var pin2 = (fd.get("pin2") || "").toString();
          if (!/^[0-9]{4}$/.test(pin)) { showPinForm(name, true, "PIN must be exactly 4 digits."); return; }
          if (pin !== pin2) { showPinForm(name, true, "PINs don't match — try again."); return; }
          var token = ++identityFlowToken;
          callRpc("set_pin", { p_name: name, p_pin: pin }).then(function (ok) {
            if (token !== identityFlowToken) return;
            if (!ok) { showPinForm(name, false, "That name already has a PIN set — enter it instead."); return; }
            setStoredIdentity(name);
            startApp();
          }).catch(function (err) {
            if (token !== identityFlowToken) return;
            if (err.code === "bad_password") { showPasswordPrompt("That password isn't working anymore — please re-enter it."); return; }
            showPinForm(name, true, "Couldn't connect — check your internet connection and try again.");
          });
        })(); break;
      case "verify-pin":
        (function () {
          var name = form.getAttribute("data-name");
          var pin = (fd.get("pin") || "").toString();
          var token = ++identityFlowToken;
          callRpc("verify_pin", { p_name: name, p_pin: pin }).then(function (ok) {
            if (token !== identityFlowToken) return;
            if (!ok) { showPinForm(name, false, "Incorrect PIN — try again."); return; }
            setStoredIdentity(name);
            startApp();
          }).catch(function (err) {
            if (token !== identityFlowToken) return;
            if (err.code === "bad_password") { showPasswordPrompt("That password isn't working anymore — please re-enter it."); return; }
            showPinForm(name, false, "Couldn't connect — check your internet connection and try again.");
          });
        })(); break;
      case "add-issue-type":
        (function () {
          var name = (fd.get("name") || "").toString().trim();
          if (!name) return;
          state.issueTypes.push({ id: uid("itype"), name: name, statusOptions: NEW_ISSUE_TYPE_STATUS_OPTIONS.slice() });
          persist();
        })(); break;
      case "add-template-item":
        (function () {
          var desc = (fd.get("description") || "").toString().trim();
          if (!desc) return;
          state.checklistTemplate.push({ id: uid("tmpl"), description: desc });
          persist();
        })(); break;
      case "add-va":
        (function () {
          addVaIfNew((fd.get("name") || "").toString());
          persist();
        })(); break;
      case "save-template":
        (function () {
          var id = form.getAttribute("data-id");
          var vals = {
            name: (fd.get("name") || "").toString().trim(),
            category: (fd.get("category") || "").toString().trim(),
            subject: (fd.get("subject") || "").toString().trim(),
            body: (fd.get("body") || "").toString()
          };
          if (id === "new") {
            var nid = uid("etmpl");
            state.emailTemplates.push(Object.assign({ id: nid }, vals));
            ui.openTemplateId = nid;
          } else {
            var existing = state.emailTemplates.find(function (x) { return x.id === id; });
            if (existing) Object.assign(existing, vals);
          }
          saveDraft("tmpl-" + id + "-subject", ""); saveDraft("tmpl-" + id + "-body", "");
          ui.editingTemplateId = null;
          persist();
        })(); break;
      default: break;
    }
  }

  document.addEventListener("click", onClick);
  document.addEventListener("change", onChange);
  document.addEventListener("input", onInput);
  document.addEventListener("submit", onSubmit);

  boot();
}
appMain();
</script>
</body>
</html>
