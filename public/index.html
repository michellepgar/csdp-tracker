      if (justMigratedCategoryOrder || justMigratedTimestamps || justMigratedSchools || justMigratedDavis || justMigratedRenames || justMigratedVaColors || justMigratedVaAdminField || justMigratedFaithOwner || justMigratedIssueStatusUniform || justMigratedContacts || justMigratedContactMultiLine || justMigratedRecheckRemoval || justMigratedCorrectionFields || justMigratedCorrectionSimplify) {
        saveStateToServer(state).catch(function () {});
      }
    }).catch(function (err) {
      if (err.code === "bad_password") { showPasswordPrompt("Incorrect password."); return; }
      if (err.code === "config_missing") { showPasswordPrompt("App isn't configured yet — config.js is missing or incomplete."); return; }
      showPasswordPrompt("Couldn't connect — check your internet connection and try again.");
    });
  }

  function startApp() {
    ui = {
      view: loadStoredView(),
      search: "",
      sidebarOpen: false,
      sidebarCollapsed: loadSidebarCollapsed(),
      templateEditorOpen: false,
      editingContactRowId: null,
      editingContactGroupId: null,
      editingNurseLeader: false,
      editingCorrectionId: null,
      editingSimpleIssueId: null,
      editingChartingId: null,
      sharingNoteId: null,
      requestingAccessFor: null,
      pendingDelete: null,
      issueFilters: { school: "", type: "", status: "", va: "" },
      eodFilterAuthor: "",
      eodFilterMonth: "",
      eodShowArchive: false,
      eodViewMode: "notes",
      editingNoteId: null,
      taskSort: { field: "date", dir: "desc" },
      emailSort: { field: "date", dir: "desc" },
      issuesSort: { field: "date", dir: "desc" },
      schoolVaFilter: "",
      addingVaForTask: null,
      lastTaskCategory: {}
    };
    render();
    startPollingForUpdates();
  }

  /* ============ derived data helpers ============ */
  function schoolById(id) { for (var i = 0; i < state.schools.length; i++) if (state.schools[i].id === id) return state.schools[i]; return null; }
  function ensureSchoolData(id) {
    if (!state.schoolData[id]) state.schoolData[id] = { vaAssigned: "", tasks: [], emailTracker: [], notes: [] };
    return state.schoolData[id];
  }
  function addVaIfNew(name) {
    name = (name || "").trim();
    if (!name) return;
    for (var i = 0; i < state.vas.length; i++) if (state.vas[i].name.toLowerCase() === name.toLowerCase()) return;
    state.vas.push({ id: uid("va"), name: name });
  }
  function countNotDone(list) {
    var n = 0;
    for (var i = 0; i < list.length; i++) if (STATUS_TIER[list[i].status] !== "green") n++;
    return n;
  }
  /* The sidebar badge next to each school name shows only how many Yearly
     Checklist items are still unchecked — not open tasks/emails/issues too
     (those have their own counts on the school's own page). */
  function schoolAttnCount(schoolId) {
    var n = 0;
    for (var i = 0; i < state.checklistTemplate.length; i++) {
      var prog = state.checklistProgress[schoolId + ":" + state.checklistTemplate[i].id];
      if (!prog || prog.status !== "Done") n++;
    }
    return n;
  }
  function tasksAttnCount(schoolId) {
    var sd = state.schoolData[schoolId] || { tasks: [] };
    return countNotDone(sd.tasks || []);
  }
  function emailAttnCount(schoolId) {
    var sd = state.schoolData[schoolId] || { emailTracker: [] };
    return countNotDone(sd.emailTracker || []);
  }
  function issuesAttnCount() {
    var n = 0;
    for (var i = 0; i < state.issues.length; i++) if (STATUS_TIER[state.issues[i].status] !== "green") n++;
    return n;
  }
  function issuesStatusBreakdown() {
    var counts = {};
    state.issues.forEach(function (it) {
      if (STATUS_TIER[it.status] !== "green") {
        counts[it.status] = (counts[it.status] || 0) + 1;
      }
    });
    return Object.keys(counts).map(function (status) {
      return { status: status, count: counts[status] };
    }).sort(function (a, b) {
      return b.count - a.count || a.status.localeCompare(b.status);
    });
  }
  function issueTypeById(id) {
    for (var i = 0; i < state.issueTypes.length; i++) if (state.issueTypes[i].id === id) return state.issueTypes[i];
    return null;
  }
  function isSchoolYearComplete(schoolId) {
    var tmpl = state.checklistTemplate;
    if (!tmpl.length) return false;
    for (var i = 0; i < tmpl.length; i++) {
      var prog = state.checklistProgress[schoolId + ":" + tmpl[i].id];
      if (!prog || prog.status !== "Done") return false;
    }
    return true;
  }

  /* ============ persistence ============ */
  function persist() {
    render();
    saveStoredView();
    saveStateToServer(state).catch(function (err) {
      if (err.code === "bad_password") { showPasswordPrompt("That password isn't working anymore — please re-enter it."); return; }
      if (err.code === "config_missing") { showToast("App isn't configured yet — config.js is missing or incomplete."); return; }
      showToast("Couldn't save that change" + (err && err.message ? ": " + err.message : "") + ". Please try again.");
    });
  }

  var toastTimer = null;
  function showToast(msg) {
    var t = document.getElementById("caseload-toast");
    if (!t) {
      t = document.createElement("div");
      t.id = "caseload-toast";
      t.className = "toast";
      document.body.appendChild(t);
    }
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove("show"); }, 3200);
  }

  /* ============ two-stage delete ============ */
  function isPending(type, id) { return ui.pendingDelete && ui.pendingDelete.type === type && ui.pendingDelete.id === id; }
  function requestDelete(type, id, performFn) {
    if (isPending(type, id)) {
      ui.pendingDelete = null;
      performFn();
      persist();
    } else {
      ui.pendingDelete = { type: type, id: id };
      render();
      setTimeout(function () {
        if (isPending(type, id)) { ui.pendingDelete = null; render(); }
      }, 4000);
    }
  }

  /* ============ rendering ============ */
  function render() {
    var app = document.getElementById("app");
    /* Every render rebuilds the sidebar from scratch, which would reset
       its scroll position on every click — most noticeable when picking a
       school near the bottom of a long, scrolled list. Snapshot and
       restore both scrollable spots around the rebuild. */
    var oldSchoolList = document.querySelector(".school-list");
    var oldSidebar = document.querySelector(".sidebar");
    var schoolListScroll = oldSchoolList ? oldSchoolList.scrollTop : 0;
    var sidebarScroll = oldSidebar ? oldSidebar.scrollTop : 0;
    app.innerHTML = shellHtml();
    var newSchoolList = document.querySelector(".school-list");
    var newSidebar = document.querySelector(".sidebar");
    if (newSchoolList) newSchoolList.scrollTop = schoolListScroll;
    if (newSidebar) newSidebar.scrollTop = sidebarScroll;
  }

  function shellHtml() {
    return (
      "<div class=\"shell\">" +
      "<div class=\"overlay" + (ui.sidebarOpen ? " show" : "") + "\" data-action=\"close-sidebar\"></div>" +
      "<aside class=\"sidebar" + (ui.sidebarOpen ? " open" : "") + (ui.sidebarCollapsed ? " collapsed" : "") + "\">" + sidebarHtml() + "</aside>" +
      "<button class=\"sidebar-toggle\" data-action=\"toggle-sidebar-collapse\" style=\"left:" + (ui.sidebarCollapsed ? "12px" : "260px") + ";\" title=\"" + (ui.sidebarCollapsed ? "Show sidebar" : "Hide sidebar") + "\">" + (ui.sidebarCollapsed ? "▶" : "◀") + "</button>" +
      "<button class=\"theme-toggle\" data-action=\"toggle-theme\" title=\"Switch to " + (currentEffectiveTheme() === "dark" ? "light" : "dark") + " mode\">" + (currentEffectiveTheme() === "dark" ? "☀" : "🌙") + "</button>" +
      "<div class=\"main\">" +
      "<div class=\"topbar\"><button class=\"menu-btn\" data-action=\"toggle-sidebar\">☰ Menu</button><strong class=\"display\">CSDP Tracker</strong></div>" +
      "<div class=\"content" + ((ui.view.type === "issues" || ui.view.type === "contacts") ? " content-wide" : "") + "\">" + pageHtml() + "</div>" +
      "</div></div>"
    );
  }

  function navItem(view, label, badge, activePredicate, extraClass) {
    var active = activePredicate(ui.view);
    return "<button class=\"nav-item" + (active ? " active" : "") + (extraClass ? " " + extraClass : "") + "\" data-action=\"nav-view\" data-view=\"" + view + "\">" +
      "<span class=\"name\">" + esc(label) + "</span>" +
      (badge > 0 ? "<span class=\"count-chip\">" + badge + "</span>" : "") + "</button>";
  }
  /* True when the current viewer has at least one Urgent general note they
     haven't acknowledged yet, and didn't post themselves — drives the
     blinking sidebar alert on General Notes/Announcements. */
  function hasUnreadUrgentNotes() {
    var me = getStoredIdentity();
    return state.generalNotes.some(function (n) {
      return n.urgency === "Urgent" && n.author !== me && (!n.ackBy || n.ackBy.indexOf(me) === -1);
    });
  }
  /* Same idea, for a private note someone shared with you — blinks until
     you click "Mark as checked" on it. */
  function hasUnreadSharedPrivateNotes() {
    var me = getStoredIdentity();
    return state.privateNotes.some(function (n) {
      return n.author !== me && (n.sharedWith || []).indexOf(me) !== -1 && (!n.ackBy || n.ackBy.indexOf(me) === -1);
    });
  }
  /* Blinks Approvals whenever there's a pending edit/remove request this
     viewer can act on — an assigned VA's own school, or an Admin/Owner
     across every school. */
  function hasPendingApprovalsForMe() {
    return (state.accessRequests || []).some(function (r) {
      return r.status === "pending" && canDeleteSchoolRecords(r.schoolId);
    });
  }

  function sidebarHtml() {
    var q = ui.search.trim().toLowerCase();
    var schools = state.schools.slice().sort(function (a, b) { return a.name.localeCompare(b.name); });
    if (q) schools = schools.filter(function (s) { return s.name.toLowerCase().indexOf(q) !== -1; });
    var vaFilter = ui.schoolVaFilter || "";
    if (vaFilter) schools = schools.filter(function (s) { return (state.schoolData[s.id] || {}).vaAssigned === vaFilter; });

    var schoolRows = schools.map(function (s) {
      var active = ui.view.type === "school" && ui.view.id === s.id;
      return "<button class=\"nav-item" + (active ? " active" : "") + "\" data-action=\"nav-school\" data-id=\"" + s.id + "\">" +
        "<span class=\"name\"" + schoolNameColorStyle(s.id) + ">" + esc(s.name) + "</span></button>";
    }).join("");

    return (
      "<div class=\"brand\"><div class=\"brand-name display\">CSDP Tracker</div><div class=\"brand-tag\">Shared casework tracker</div></div>" +
      "<div class=\"sidebar-section\">" +
      navItem("home", "Overview", 0, function (v) { return v.type === "home"; }, "overview-nav-item") +
      "</div>" +
      "<div class=\"sidebar-section\">" +
      "<div class=\"sidebar-label\">Schools (" + state.schools.length + ")</div>" +
      "<input class=\"search-input\" placeholder=\"Search schools…\" value=\"" + esc(ui.search) + "\" data-role=\"school-search\">" +
      "<select class=\"text-input\" style=\"margin-top:6px; font-size:0.8rem;\" data-action-change=\"set-school-va-filter\">" +
      "<option value=\"\">All VAs</option>" +
      state.vas.filter(function (v) { return v.role !== "owner"; }).sort(function (a, b) { return a.name.localeCompare(b.name); }).map(function (v) {
        return "<option value=\"" + esc(v.name) + "\"" + (vaFilter === v.name ? " selected" : "") + ">" + esc(v.name) + "</option>";
      }).join("") +
      "</select>" +
      "<div class=\"school-list nav-list\">" + (schoolRows || "<div class=\"empty-state\" style=\"padding:10px 4px;\">No schools match.</div>") + "</div>" +
      "<button class=\"add-inline-btn\" data-action=\"toggle-add-school\">+ Add school</button>" +
      (ui.addSchoolOpen ? "<form class=\"mini-form\" data-action=\"add-school\">" +
        "<input required autofocus name=\"name\" placeholder=\"School name\">" +
        "<button type=\"submit\">Add</button></form>" : "") +
      "</div>" +
      "<div class=\"sidebar-divider\"></div>" +
      "<div class=\"sidebar-section\">" +
      "<div class=\"sidebar-label\">My Space</div>" +
      "<div class=\"nav-list\">" +
      navItem("private-notes", "Private Notes", 0, function (v) { return v.type === "private-notes"; }, hasUnreadSharedPrivateNotes() ? "blink-alert" : "") +
      navItem("approvals", "Approvals", 0, function (v) { return v.type === "approvals"; }, hasPendingApprovalsForMe() ? "blink-alert" : "") +
      (isSuperAdmin() ? navItem("team", "Team", 0, function (v) { return v.type === "team"; }) : "") +
      "</div></div>" +
      "<div class=\"sidebar-divider\"></div>" +
      "<div class=\"sidebar-section\">" +
      "<div class=\"sidebar-label\">Team</div>" +
      "<div class=\"nav-list\">" +
      navItem("notes", "General Notes/Announcements", state.generalNotes.length, function (v) { return v.type === "notes"; }, hasUnreadUrgentNotes() ? "blink-alert" : "") +
      navItem("issues", "Issues & Concerns", issuesAttnCount(), function (v) { return v.type === "issues"; }) +
      navItem("eod", "EOD Reports", 0, function (v) { return v.type === "eod"; }) +
      navItem("contacts", "Schools Contact Information", 0, function (v) { return v.type === "contacts"; }) +
      navItem("templates", "Email Templates", 0, function (v) { return v.type === "templates"; }) +
      navItem("suggestions", "Suggestions", 0, function (v) { return v.type === "suggestions"; }) +
      "</div></div>"
    );
  }

  /* Column order/labels for the school directory table — shared by the
     header row and every data row so they can never drift out of sync. */
  var CONTACT_FIELDS = [
    { key: "school", label: "School", width: 12 },
    { key: "principal", label: "Principal", width: 9 },
    { key: "principalEmail", label: "Email", width: 11 },
    { key: "asstPrincipal", label: "Asst Principal", width: 9 },
    { key: "asstPrincipalEmail", label: "Asst Principal Email", width: 11 },
    { key: "frontDesk", label: "Front Desk", width: 8 },
    { key: "frontDeskEmail", label: "Front Desk Email", width: 10 },
    { key: "nurseName", label: "Nurse Name", width: 8 },
    { key: "nurseEmail", label: "Nurse Email", width: 10 },
    { key: "notes", label: "Notes", width: 12 }
  ];
  /* Shared across every group's table so a column lines up at the same
     width everywhere, regardless of how much content that group has. */
  function contactColgroupHtml() {
    return "<colgroup>" + CONTACT_FIELDS.map(function (f) { return "<col style=\"width:" + f.width + "%;\">"; }).join("") +
      "<col style=\"width:70px;\">" + "</colgroup>";
  }
  /* Multi-line-safe text-to-HTML for the read-only view — keeps line
     breaks (so a school with two nurses shows one per line) while still
     escaping everything else. */
  function contactCellViewHtml(v) { return esc(v).replace(/\n/g, "<br>"); }
  /* Auto-sized so a cell with 2-3 people (one per line) doesn't clip in
     edit mode — grows with however many lines are already in the value. */
  function contactTextareaRows(v) { return Math.max(1, String(v || "").split("\n").length); }
  function contactsPageHtml() {
    var groups = state.contactGroups || [];
    var leader = state.nurseLeader || { name: "", email: "" };
    var leaderEditing = !!ui.editingNurseLeader;
    var leaderHtml = "<div class=\"card\"><div class=\"card-body\">" +
      "<div class=\"contact-leader-row\">" +
      "<span class=\"field-mini-label\">Nurse Leader</span>" +
      (leaderEditing
        ? "<input class=\"text-input contact-cell-input\" data-action-change=\"set-nurse-leader-name\" placeholder=\"Name\" value=\"" + esc(leader.name) + "\">" +
          "<input class=\"text-input contact-cell-input\" data-action-change=\"set-nurse-leader-email\" placeholder=\"Email\" value=\"" + esc(leader.email) + "\">"
        : "<span class=\"contact-cell-view\">" + esc(leader.name) + (leader.name && leader.email ? " — " : "") + esc(leader.email) + "</span>") +
      "<button class=\"link-btn\" data-action=\"" + (leaderEditing ? "done-edit-nurse-leader" : "edit-nurse-leader") + "\">" + (leaderEditing ? "Done" : "Edit") + "</button>" +
      "</div></div></div>";

    var groupsHtml = groups.map(function (g) {
      var headerCells = CONTACT_FIELDS.map(function (f) { return "<th>" + esc(f.label) + "</th>"; }).join("") + "<th></th>";
      var rowsHtml = (g.rows || []).map(function (r) {
        /* Unlocked one row at a time — editing one school never risks
           typing into a different one by mistake. */
        var rowEditing = ui.editingContactRowId === r.id;
        var cells = CONTACT_FIELDS.map(function (f) {
          if (rowEditing) {
            return "<td><textarea class=\"contact-cell-input\" rows=\"" + contactTextareaRows(r[f.key]) + "\" data-action-change=\"set-contact-field\" data-group=\"" + g.id + "\" data-row=\"" + r.id + "\" data-field=\"" + f.key + "\">" + esc(r[f.key]) + "</textarea></td>";
          }
          return "<td><div class=\"contact-cell-view\">" + contactCellViewHtml(r[f.key]) + "</div></td>";
        }).join("");
        var pendingRow = isPending("contact-row", r.id);
        var editBtn = "<button class=\"link-btn\" data-action=\"" + (rowEditing ? "done-edit-contact-row" : "edit-contact-row") + "\" data-id=\"" + r.id + "\">" + (rowEditing ? "Done" : "Edit") + "</button>";
        var removeBtn = "<button class=\"icon-btn" + (pendingRow ? " confirming" : "") + "\" data-action=\"remove-contact-row\" data-group=\"" + g.id + "\" data-id=\"" + r.id + "\" title=\"Remove\">" + (pendingRow ? "Confirm?" : "✕") + "</button>";
        return "<tr>" + cells + "<td>" + editBtn + removeBtn + "</td></tr>";
      }).join("");
      var pendingGroup = isPending("contact-group", g.id);
      var groupEditing = ui.editingContactGroupId === g.id;
      var titleHtml = groupEditing
        ? "<input class=\"contact-group-title-input\" data-action-change=\"set-contact-group-name\" data-group=\"" + g.id + "\" value=\"" + esc(g.name) + "\">"
        : "<div class=\"card-title\">" + esc(g.name) + "</div>";
      return "<div class=\"card\"><div class=\"card-head\">" +
        titleHtml +
        "<div class=\"card-actions\">" +
        "<button class=\"link-btn\" data-action=\"" + (groupEditing ? "done-edit-contact-group" : "edit-contact-group") + "\" data-id=\"" + g.id + "\">" + (groupEditing ? "Done" : "Rename") + "</button>" +
        "<button class=\"icon-btn" + (pendingGroup ? " confirming" : "") + "\" data-action=\"remove-contact-group\" data-id=\"" + g.id + "\" title=\"Remove this whole group\">" + (pendingGroup ? "Confirm delete group?" : "Remove group") + "</button>" +
        "</div>" +
        "</div><div class=\"card-body\">" +
        "<div class=\"table-scroll\"><table class=\"data-table contact-table\">" + contactColgroupHtml() + "<thead><tr>" + headerCells + "</tr></thead><tbody>" +
        (rowsHtml || "<tr><td colspan=\"" + (CONTACT_FIELDS.length + 1) + "\">" + emptyState("No schools in this group yet.") + "</td></tr>") +
        "</tbody></table></div>" +
        "<form class=\"add-row-form\" data-action=\"add-contact-row\" data-group=\"" + g.id + "\">" +
        "<input class=\"text-input\" name=\"school\" placeholder=\"School name\" required>" +
        "<button class=\"btn small\" type=\"submit\">+ Add school</button></form>" +
        "</div></div>";
    }).join("");

    var addGroupForm = "<div class=\"card\"><div class=\"card-body\">" +
      "<form class=\"add-row-form\" data-action=\"add-contact-group\">" +
      "<input class=\"text-input\" name=\"name\" placeholder=\"New group name (e.g. ELEMENTARY)\" required>" +
      "<button class=\"btn\" type=\"submit\">+ Add group</button></form></div></div>";

    return "<div class=\"page-header\"><div><div class=\"page-title display\">Schools Contact Information</div></div></div>" +
      leaderHtml + groupsHtml + addGroupForm;
  }

  function pageHtml() {
    switch (ui.view.type) {
      case "school": return schoolPageHtml(ui.view.id);
      case "issues": return issuesPageHtml();
      case "contacts": return contactsPageHtml();
      case "templates": return templatesPageHtml();
      case "team": return isSuperAdmin() ? teamPageHtml() : homePageHtml();
      case "notes": return generalNotesPageHtml();
      case "suggestions": return suggestionsPageHtml();
      case "eod": return eodPageHtml();
      case "private-notes": return privateNotesPageHtml();
      case "approvals": return approvalsPageHtml();
      default: return homePageHtml();
    }
  }

  /* ---------- Home ---------- */
  function checklistProgressBySchool() {
    var tmpl = state.checklistTemplate || [];
    return state.schools.slice().sort(function (a, b) { return a.name.localeCompare(b.name); }).map(function (s) {
      var done = 0;
      tmpl.forEach(function (item) {
        var p = state.checklistProgress[s.id + ":" + item.id];
        if (p && p.status === "Done") done++;
      });
      var total = tmpl.length;
      return { school: s, total: total, done: done, pct: total ? Math.round((done / total) * 100) : 0 };
    });
  }
  function homePageHtml() {
    var emailAttn = 0;
    var completedSchools = [];
    for (var i = 0; i < state.schools.length; i++) {
      emailAttn += emailAttnCount(state.schools[i].id);
      if (isSchoolYearComplete(state.schools[i].id)) completedSchools.push(state.schools[i]);
    }
    var html = "<div class=\"page-header\"><div><div class=\"page-title display\">Overview</div></div></div>";

    html += "<div class=\"stat-row-sm\">" +
      statTile(state.schools.length, "Schools", true) +
      statTile(completedSchools.length, "Completed for the year", true) +
      "</div>";

    var issuesTotal = issuesAttnCount();
    var schoolsWithEmailAttn = state.schools.map(function (s) { return { school: s, count: emailAttnCount(s.id) }; })
      .filter(function (x) { return x.count > 0; })
      .sort(function (a, b) { return b.count - a.count || a.school.name.localeCompare(b.school.name); });
    var emailAlertRows = schoolsWithEmailAttn.map(function (x) {
      return "<button class=\"nav-item\" data-action=\"nav-school-email\" data-id=\"" + x.school.id + "\">" +
        "<span class=\"name\">" + esc(x.school.name) + "</span>" +
        "<span class=\"count-chip\">" + x.count + "</span></button>";
    }).join("");
    html += "<div class=\"alerts-row\">" +
      "<div class=\"card card-compact" + (emailAttn > 0 ? " alerts-card" : "") + "\"><div class=\"card-head\"><div class=\"card-title\">Emails Needing Attention" +
      (emailAttn > 0 ? " <span class=\"count-chip\">" + emailAttn + "</span>" : "") + "</div></div>" +
      "<div class=\"card-body\"><div class=\"nav-list\">" + (emailAlertRows || emptyState("No emails needing attention.")) + "</div></div></div>" +
      "<div class=\"card card-compact clickable-card" + (issuesTotal > 0 ? " alerts-card" : "") + "\" data-action=\"nav-view\" data-view=\"issues\"><div class=\"card-head\"><div class=\"card-title\">Issues & Concerns</div></div>" +
      "<div class=\"card-body\"><div class=\"stat-num mono\">" + issuesTotal + "</div><div class=\"stat-label\">still open</div></div></div>" +
      "</div>";

    var schoolProgress = checklistProgressBySchool();
    var progressRows = schoolProgress.map(function (p) {
      return "<div class=\"school-progress-row\">" +
        "<div class=\"school-progress-name\">" + esc(p.school.name) + "</div>" +
        "<div class=\"school-progress-bar-line\">" +
        "<div class=\"progress-bar-track\"><div class=\"progress-bar-fill\" style=\"width:" + p.pct + "%;\"></div></div>" +
        "<span class=\"school-progress-pct\">" + p.pct + "%</span>" +
        "</div></div>";
    }).join("");
    html += "<div class=\"card\"><div class=\"card-head\"><div class=\"card-title\">Checklist Progress by School</div></div>" +
      "<div class=\"card-body\">" + (progressRows || emptyState("No schools yet.")) + "</div></div>";

    if (state.schools.length === 0) {
      html += "<div class=\"card\"><div class=\"card-body\"><p style=\"margin-bottom:10px;\">No schools yet. Use <strong>+ Add school</strong> in the sidebar to create the first one — each school gets its own page for tasks, the yearly checklist, an email tracker, and notes.</p></div></div>";
    }
    return html;
  }
  function statTile(num, label, small) {
    return "<div class=\"stat-tile" + (small ? " stat-tile-sm" : "") + "\"><div class=\"stat-num mono\">" + num + "</div><div class=\"stat-label\">" + esc(label) + "</div></div>";
  }

  /* ---------- School page ---------- */
  function vaDatalist() {
    return "<datalist id=\"va-list\">" + state.vas.map(function (v) { return "<option value=\"" + esc(v.name) + "\">"; }).join("") + "</datalist>";
  }

  /* Fixed "signature" colors per VA, as requested — everyone else (added
     later, or not yet assigned one) falls back to a hash-derived hue so
     they still get a consistent, distinct color of their own. */
  function hexToRgb(hex) {
    hex = String(hex || "").replace("#", "");
    if (hex.length === 3) hex = hex.split("").map(function (c) { return c + c; }).join("");
    var num = parseInt(hex, 16);
    if (hex.length !== 6 || isNaN(num)) return null;
    return { r: (num >> 16) & 255, g: (num >> 8) & 255, b: num & 255 };
  }
  /* Each VA can have her own chosen color (set on the Team page); anyone
     without one yet (a brand-new VA before the superadmin assigns one)
     falls back to a hash-derived hue so they still get a distinct,
     consistent color of their own in the meantime. */
  function vaColorCss(name, alpha) {
    var va = state.vas.filter(function (v) { return v.name === name; })[0];
    if (va && va.color) {
      var rgb = hexToRgb(va.color);
      if (rgb) return alpha != null ? "rgba(" + rgb.r + "," + rgb.g + "," + rgb.b + "," + alpha + ")" : va.color;
    }
    var hue = 0;
    for (var i = 0; i < name.length; i++) hue = (hue * 31 + name.charCodeAt(i)) % 360;
    return alpha != null ? "hsla(" + hue + ",70%,45%," + alpha + ")" : "hsl(" + hue + ",65%,45%)";
  }
  function vaTagColor(name) {
    return vaColorCss(name, 0.22);
  }
  function vaSolidColor(name) {
    return vaColorCss(name, null);
  }
  /* Colors a school's name to match whichever VA it's assigned to, so the
     sidebar reads at a glance like each VA's own signature color. */
  function schoolNameColorCss(schoolId) {
    var sd = state.schoolData[schoolId];
    var assigned = sd && sd.vaAssigned;
    return assigned ? "color:" + vaSolidColor(assigned) + ";" : "";
  }
  function schoolNameColorStyle(schoolId) {
    var css = schoolNameColorCss(schoolId);
    return css ? " style=\"" + css + "\"" : "";
  }

  /* The "+" is a signature, not a picker: clicking it adds whoever is
     currently logged in, on this device, to the file — not a name chosen
     from a list. It only shows up for someone who hasn't signed yet. */
  /* Two ways to add a name to a file: "✍" is your own signature (adds
     whoever's logged in, one click, no picking) and "+" is for noting a
     coworker who's on the file with you but isn't the one clicking — it
     opens a small picker instead of guessing who you mean. */
  function taskVaGroupHtml(t, schoolId) {
    var names = Array.isArray(t.vaAssigned) ? t.vaAssigned : (t.vaAssigned ? [t.vaAssigned] : []);
    var me = getStoredIdentity();
    var chips = names.map(function (name) {
      var pendingKey = t.id + "|" + name;
      var pending = isPending("va-from-task", pendingKey);
      var removeBtnHtml = "<button class=\"va-tag-remove" + (pending ? " confirming" : "") + "\" data-action=\"remove-va-from-task\" data-id=\"" + t.id + "\" data-school=\"" + schoolId + "\" data-va=\"" + esc(name) + "\" title=\"" + (pending ? "Click again to confirm" : "Remove " + esc(name)) + "\">" + (pending ? "Confirm?" : "×") + "</button>";
      /* Removing your own signature is always allowed, no request needed —
         only someone else's goes through the request-to-remove flow. */
      var chipControl = name === me
        ? removeBtnHtml
        : deleteOrRequestControlHtml("va-signature", schoolId, pendingKey, "\"" + name + "\"'s signature on this task", removeBtnHtml);
      return "<span class=\"va-tag\" style=\"background:" + vaTagColor(name) + ";\">" + esc(name) + chipControl + "</span>";
    }).join("");
    var signBtn = (me && names.indexOf(me) === -1)
      ? "<button class=\"add-va-btn\" data-action=\"sign-task\" data-id=\"" + t.id + "\" data-school=\"" + schoolId + "\" title=\"Add yourself (" + esc(me) + ")\">+</button>"
      : "";
    /* Only Owner/Superadmin/Admin can assign a file to someone else — a
       regular VA can only add themselves, via the button above. */
    var otherControl = "";
    if (isSuperAdmin()) {
      if (ui.addingVaForTask === t.id) {
        var available = state.vas.filter(function (v) { return names.indexOf(v.name) === -1; });
        var opts = "<option value=\"\" disabled selected>Add someone…</option>" + available.map(function (v) {
          return "<option value=\"" + esc(v.name) + "\">" + esc(v.name) + "</option>";
        }).join("");
        otherControl = "<select class=\"text-input va-add-select\" data-action-change=\"add-va-to-task\" data-id=\"" + t.id + "\" data-school=\"" + schoolId + "\">" + opts + "</select>" +
          "<button class=\"link-btn\" data-action=\"cancel-add-va-for-task\">Cancel</button>";
      } else {
        otherControl = "<button class=\"add-va-btn\" data-action=\"toggle-add-va-for-task\" data-id=\"" + t.id + "\" title=\"Assign someone else to this file\">+</button>";
      }
    }
    return "<span class=\"va-group\">" + chips + signBtn + otherControl + "</span>";
  }

  function schoolPageHtml(schoolId) {
    var school = schoolById(schoolId);
    if (!school) { ui.view = { type: "home" }; return homePageHtml(); }
    var sd = ensureSchoolData(schoolId);

    var header = "<div class=\"page-header school-page-header\">" +
      "<div><div class=\"page-title display\"" + schoolNameColorStyle(schoolId) + ">" + esc(school.name) + "</div>" +
      "<div class=\"field-row\" style=\"margin-top:8px;\">" +
      "<span class=\"field-label\">VA assigned</span>" +
      "<span style=\"font-weight:600;" + schoolNameColorCss(schoolId) + "\">" + esc(sd.vaAssigned || "Unassigned") + "</span>" +
      "</div></div>" +
      "<button class=\"link-btn danger\" data-action=\"remove-school\" data-id=\"" + schoolId + "\">" +
        (isPending("school", schoolId) ? "Really remove " + esc(school.name) + " and all its data? Click again to confirm" : "Remove school") + "</button>" +
      "</div>";

    return header +
      tasksCardHtml(schoolId, sd) +
      checklistCardHtml(schoolId) +
      emailTrackerCardHtml(schoolId, sd) +
      schoolContactCardHtml(school);
  }

  /* Looks up this school's row on the Schools Contact Information page by
     matching its name — that page stays the one place contact info is
     edited, this just mirrors it here for quick reference. */
  function findContactRowBySchoolName(name) {
    var target = String(name || "").trim().toLowerCase();
    if (!target) return null;
    var found = null;
    (state.contactGroups || []).some(function (g) {
      var row = (g.rows || []).find(function (r) { return String(r.school || "").trim().toLowerCase() === target; });
      if (row) { found = row; return true; }
      return false;
    });
    return found;
  }
  /* Name + email side by side instead of stacked — a role can have more
     than one person (multi-line, one per line); zip name lines with email
     lines so each person's own pair stays together on one row. */
  var CONTACT_CARD_PAIRS = [
    { label: "Principal", nameKey: "principal", emailKey: "principalEmail" },
    { label: "Asst Principal", nameKey: "asstPrincipal", emailKey: "asstPrincipalEmail" },
    { label: "Front Desk", nameKey: "frontDesk", emailKey: "frontDeskEmail" },
    { label: "Nurse", nameKey: "nurseName", emailKey: "nurseEmail" }
  ];
  function emailCopyBtnHtml(email) {
    if (!email) return "";
    return "<button class=\"icon-btn copy-email-btn\" data-action=\"copy-email\" data-email=\"" + esc(email) + "\" title=\"Copy email\">📋</button>";
  }
  function contactPersonRowHtml(name, email) {
    return "<div class=\"contact-person-row\">" +
      (name ? "<span>" + esc(name) + "</span>" : "") +
      (email ? "<span class=\"mono contact-email\">" + esc(email) + "</span>" + emailCopyBtnHtml(email) : "") +
      "</div>";
  }
  function schoolContactCardHtml(school) {
    var row = findContactRowBySchoolName(school.name);
    var manageLink = "<button class=\"link-btn\" data-action=\"nav-view\" data-view=\"contacts\">" + (row ? "Edit in Schools Contact Info" : "Add in Schools Contact Info") + "</button>";
    var body;
    if (!row) {
      body = emptyState("No contact info on file for this school yet.");
    } else {
      var rowsHtml = CONTACT_CARD_PAIRS.map(function (pair) {
        var names = String(row[pair.nameKey] || "").split("\n").filter(function (s) { return s !== ""; });
        var emails = String(row[pair.emailKey] || "").split("\n").filter(function (s) { return s !== ""; });
        if (!names.length && !emails.length) return "";
        var lineCount = Math.max(names.length, emails.length);
        var personRows = "";
        for (var i = 0; i < lineCount; i++) {
          personRows += contactPersonRowHtml(names[i] || "", emails[i] || "");
        }
        return "<div class=\"field-label\">" + esc(pair.label) + "</div><div>" + personRows + "</div>";
      }).join("");
      var notesHtml = "<div class=\"field-label\">Notes</div><div class=\"contact-cell-view\" style=\"padding:0;\">" +
        (row.notes ? contactCellViewHtml(row.notes) : "<span style=\"color:var(--ink-faint);\">No notes yet.</span>") + "</div>";
      body = "<div class=\"contact-card-grid\">" + (rowsHtml || emptyState("No contact details filled in yet for this school.")) + notesHtml + "</div>";
    }
    return "<div class=\"card\"><div class=\"card-head accent-card-head\"><div class=\"card-title\">Contact Info</div>" +
      "<div class=\"card-actions\">" + manageLink + "</div></div>" +
      "<div class=\"card-body\">" + body + "</div></div>";
  }

  /* Communication is only ever worked by one specific VA, set on the Team
     page — deliberately no Owner/Admin/Superadmin override here, unlike
     every other restriction in the app: the superadmin can change *who*
     that person is, but doesn't get to edit it themselves unless they're
     the one currently set. */
  var DEFAULT_COMMUNICATION_EDITOR = "Therese";
  function canEditCommunication() {
    return getStoredIdentity() === (state.communicationEditor || DEFAULT_COMMUNICATION_EDITOR);
  }
  /* Deleting anything under a school's own records (tasks, email tracker
     items, a VA's signature on a task) is limited to whoever's actually
     assigned to that school, plus the usual Owner/Admin/Superadmin
     override — everyone else just doesn't get the delete button at all. */
  function canDeleteSchoolRecords(schoolId) {
    var sd = ensureSchoolData(schoolId);
    return isSuperAdmin() || (!!sd.vaAssigned && sd.vaAssigned === getStoredIdentity());
  }
  /* Request-to-remove: the delete (✕) button always shows, even on a
     record that isn't yours to manage — clicking it either deletes right
     away (if you're allowed) or opens a reason field to send a removal
     request to the assigned VA/Admin/Owner instead. Once they approve it,
     the record is removed automatically right then — there's no separate
     "now go click delete again" step for the requester. */
  var ACCESS_REQUEST_TYPE_FOR_KIND = { "task": "remove-task", "email-item": "remove-email-item", "va-signature": "remove-va-from-task" };
  function findAccessRequestForRecord(schoolId, targetId, requestedBy, statuses) {
    return (state.accessRequests || []).find(function (r) {
      return r.schoolId === schoolId && r.targetId === targetId &&
        r.requestedBy === requestedBy && statuses.indexOf(r.status) !== -1;
    });
  }
  /* Actually performs the removal an approved request describes — called
     once, at the moment it's approved. Normalizes the type from recordKind
     first: a request made while this feature still had an Edit/Remove
     choice could be sitting in someone's Approvals with a type like
     "edit-task" or "change-email-status" that has no removal to perform —
     recordKind still says what it's actually about, so re-derive the
     correct type from that rather than silently doing nothing. */
  function performApprovedRemoval(reqObj) {
    var sd = ensureSchoolData(reqObj.schoolId);
    var type = ACCESS_REQUEST_TYPE_FOR_KIND[reqObj.recordKind] || reqObj.type;
    if (type === "remove-task") {
      sd.tasks = sd.tasks.filter(function (x) { return x.id !== reqObj.targetId; });
    } else if (type === "remove-email-item") {
      sd.emailTracker = sd.emailTracker.filter(function (x) { return x.id !== reqObj.targetId; });
    } else if (type === "remove-va-from-task") {
      var sepIdx = reqObj.targetId.indexOf("|");
      var taskId = sepIdx === -1 ? reqObj.targetId : reqObj.targetId.slice(0, sepIdx);
      var va = sepIdx === -1 ? "" : reqObj.targetId.slice(sepIdx + 1);
      var task = sd.tasks.find(function (x) { return x.id === taskId; });
      if (task) {
        var names = Array.isArray(task.vaAssigned) ? task.vaAssigned : [];
        task.vaAssigned = names.filter(function (n) { return n !== va; });
      }
    }
  }
  /* Renders whichever state this specific record's removal request is in:
     the real ✕ delete button by default — always present, whether or not
     the viewer is actually allowed to use it, since its own click handler
     is what decides whether to delete or open the request form instead —
     a pending indicator once a request's been sent, or the inline reason
     form while composing one. */
  function deleteOrRequestControlHtml(recordKind, schoolId, targetId, label, deleteBtnHtml) {
    var me = getStoredIdentity();
    if (!me) return deleteBtnHtml;
    var reqKey = recordKind + "|" + targetId;
    var pendingReq = findAccessRequestForRecord(schoolId, targetId, me, ["pending"]);
    if (pendingReq) return "<span class=\"field-mini-label\" title=\"Request pending — waiting on the assigned VA or an Admin/Owner\">⏳</span>";
    if (ui.requestingAccessFor === reqKey) {
      return "<form class=\"add-row-form\" data-action=\"submit-access-request\" style=\"gap:6px; flex-wrap:wrap; padding:0; margin:0;\">" +
        "<input type=\"hidden\" name=\"recordKind\" value=\"" + esc(recordKind) + "\">" +
        "<input type=\"hidden\" name=\"schoolId\" value=\"" + esc(schoolId) + "\">" +
        "<input type=\"hidden\" name=\"targetId\" value=\"" + esc(targetId) + "\">" +
        "<input type=\"hidden\" name=\"label\" value=\"" + esc(label) + "\">" +
        "<input class=\"text-input\" name=\"reason\" placeholder=\"Reason for removing this\" required style=\"min-width:160px;\">" +
        "<button class=\"btn small\" type=\"submit\">Send request</button>" +
        "<button class=\"link-btn\" type=\"button\" data-action=\"cancel-request-access\">Cancel</button>" +
        "</form>";
    }
    return deleteBtnHtml;
  }
  function taskRowHtml(t, schoolId) {
    var needsComm = COMMUNICATION_CATEGORIES.indexOf(t.category) !== -1;
    var needsCount = COUNT_CATEGORIES.indexOf(t.category) !== -1;
    return "<div class=\"row-item\"><div class=\"row-main\"><span class=\"task-file-group\"><span class=\"row-file mono\">" + esc(t.fileName) + "</span>" +
      (needsCount ? "<span class=\"field-mini-label\">Count</span><input class=\"text-input count-input\" type=\"number\" min=\"0\" value=\"" + esc(t.count || "") + "\" placeholder=\"0\" data-action-change=\"set-task-count\" data-id=\"" + t.id + "\" data-school=\"" + schoolId + "\">" : "") +
      "</span></div>" +
      taskVaGroupHtml(t, schoolId) +
      statusControl("task", t.id, t.status, "toggle-task-status", schoolId) +
      (needsComm ? "<span class=\"field-mini-label\">Communication</span>" + statusControl("communication", t.id, t.communication || "", "change-task-communication", schoolId, !canEditCommunication()) : "") +
      deleteOrRequestControlHtml("task", schoolId, t.id, "task \"" + t.fileName + "\"", deleteBtn("task", t.id, "remove-task", schoolId)) + "</div>";
  }

  function tasksCardHtml(schoolId, sd) {
    var open = countNotDone(sd.tasks);
    var cats = state.taskCategories;
    var catNames = cats.map(function (c) { return c.name; });

    var groupsHtml = cats.map(function (c) {
      var items = sortRecords(sd.tasks.filter(function (t) { return t.category === c.name; }).slice().reverse(), ui.taskSort, function (t) { return t.fileName; });
      /* Encoding & Uploading, Initial, and Recheck each have a per-file
         Count field — total those up next to the file count so the sum
         is visible without adding them up by hand. */
      var totalCountHtml = "";
      if (COUNT_CATEGORIES.indexOf(c.name) !== -1 && items.length) {
        var totalCount = items.reduce(function (sum, t) { return sum + (parseInt(t.count, 10) || 0); }, 0);
        totalCountHtml = "<span class=\"count-chip\" title=\"Sum of each file's Count\">Total: " + totalCount + "</span>";
      }
      return "<div class=\"task-group\"><div class=\"task-group-title\"><span>" + esc(c.name) + "</span>" +
        totalCountHtml + "</div>" +
        "<div class=\"row-list\">" + (items.map(function (t) { return taskRowHtml(t, schoolId); }).join("") || emptyState("No files yet in this category.")) + "</div></div>";
    }).join("");

    var orphaned = sortRecords(sd.tasks.filter(function (t) { return catNames.indexOf(t.category) === -1; }).slice().reverse(), ui.taskSort, function (t) { return t.fileName; });
    if (orphaned.length) {
      groupsHtml += "<div class=\"task-group\"><div class=\"task-group-title\"><span>Other</span></div>" +
        "<div class=\"row-list\">" + orphaned.map(function (t) { return taskRowHtml(t, schoolId); }).join("") + "</div></div>";
    }

    var lastCat = (ui.lastTaskCategory || {})[schoolId];
    var catOptions = cats.map(function (c) {
      return "<option value=\"" + esc(c.name) + "\"" + (c.name === lastCat ? " selected" : "") + ">" + esc(c.name) + "</option>";
    }).join("");

    var editorHtml = "";
    if (ui.taskCategoryEditorOpen) {
      var catRows = cats.map(function (c, idx) {
        return "<div class=\"template-item-row\"><div class=\"row-main\">" + esc(c.name) + "</div>" +
          "<div class=\"stack-btns\">" +
          "<button" + (idx === 0 ? " disabled" : "") + " data-action=\"move-task-category\" data-id=\"" + c.id + "\" data-dir=\"up\">▲</button>" +
          "<button" + (idx === cats.length - 1 ? " disabled" : "") + " data-action=\"move-task-category\" data-id=\"" + c.id + "\" data-dir=\"down\">▼</button>" +
          "</div>" +
          deleteBtn("task-category", c.id, "remove-task-category") + "</div>";
      }).join("");
      editorHtml = "<div class=\"template-card\" style=\"margin-bottom:14px; padding:14px;\">" +
        "<div class=\"checklist-note\">Editing this list changes the categories for every school. Existing files keep their category name even if it's later removed here.</div>" +
        catRows +
        "<form class=\"add-row-form\" style=\"margin-top:10px;\" data-action=\"add-task-category\">" +
        "<input class=\"text-input\" name=\"name\" placeholder=\"New category\" required>" +
        "<button class=\"btn\" type=\"submit\">Add</button></form></div>";
    }

    return "<div class=\"card\"><div class=\"card-head accent-card-head\">" +
      "<div class=\"card-title\">Tasks" + (open > 0 ? " <span class=\"count-chip\">" + open + "</span>" : "") + "</div>" +
      "<div class=\"card-actions\">" + sortControlHtml(ui.taskSort, "set-task-sort") +
      "<button class=\"link-btn\" data-action=\"toggle-task-category-editor\">" + (ui.taskCategoryEditorOpen ? "Close editor" : "Edit categories") + "</button></div>" +
      "</div><div class=\"card-body\">" + editorHtml +
      "<form class=\"add-row-form\" data-action=\"add-task\" data-school=\"" + schoolId + "\">" +
        "<select class=\"text-input\" name=\"category\">" + catOptions + "</select>" +
        "<input class=\"text-input mono\" name=\"fileName\" data-role=\"task-filename-input\" placeholder=\"File name, e.g. Q3-enrollment-report.xlsx\" required style=\"flex:2;\">" +
        "<button class=\"btn\" type=\"submit\">Add</button></form>" +
      groupsHtml +
      "</div></div>";
  }

  function statusControl(type, id, status, action, schoolId, disabled) {
    return statusControlOptions(STATUS_OPTIONS[type], id, status, action, schoolId, disabled);
  }

  function statusControlOptions(options, id, status, action, schoolId, disabled) {
    var opts = options.map(function (o) {
      return "<option value=\"" + esc(o) + "\"" + (o === status ? " selected" : "") + ">" + esc(o || "—") + "</option>";
    }).join("");
    return "<select class=\"status-select " + (STATUS_TIER[status] || "neutral") + "\" data-action-change=\"" + action + "\" data-id=\"" + id + "\"" +
      (schoolId ? " data-school=\"" + schoolId + "\"" : "") + (disabled ? " disabled title=\"You don't have permission to change this\"" : "") + ">" + opts + "</select>";
  }

  function deleteBtn(type, id, action, schoolId) {
    var pending = isPending(type, id);
    return "<button class=\"icon-btn" + (pending ? " confirming" : "") + "\" data-action=\"" + action + "\" data-id=\"" + id + "\"" +
      (schoolId ? " data-school=\"" + schoolId + "\"" : "") + " title=\"Remove\">" + (pending ? "Confirm?" : "✕") + "</button>";
  }

  function emptyState(text) { return "<div class=\"empty-state\">" + esc(text) + "</div>"; }

  /* Shared sort control used on Tasks, Email Tracker, and Issues &
     Concerns. Records created before this feature don't have a createdAt
     — those are treated as an empty string, which naturally sorts to one
     end or the other depending on direction, and since Array#sort is
     stable, ties keep whatever order the list is handed in. */
  function sortRecords(list, sort, textAccessor) {
    var dir = sort.dir === "asc" ? 1 : -1;
    return list.slice().sort(function (a, b) {
      var av, bv;
      if (sort.field === "alpha") {
        av = (textAccessor(a) || "").toLowerCase();
        bv = (textAccessor(b) || "").toLowerCase();
      } else {
        av = a.createdAt || "";
        bv = b.createdAt || "";
      }
      if (av < bv) return -1 * dir;
      if (av > bv) return 1 * dir;
      return 0;
    });
  }
  function parseSortValue(v) {
    var parts = String(v || "date_desc").split("_");
    return { field: parts[0], dir: parts[1] };
  }
  function sortControlHtml(current, action) {
    var opts = [
      { value: "date_desc", label: "Date: Newest first" },
      { value: "date_asc", label: "Date: Oldest first" },
      { value: "alpha_asc", label: "A → Z" },
      { value: "alpha_desc", label: "Z → A" }
    ];
    var curVal = current.field + "_" + current.dir;
    return "<select class=\"text-input\" style=\"max-width:170px;\" data-action-change=\"" + action + "\">" +
      opts.map(function (o) { return "<option value=\"" + o.value + "\"" + (o.value === curVal ? " selected" : "") + ">" + o.label + "</option>"; }).join("") +
      "</select>";
  }

  function checklistCardHtml(schoolId) {
    var tmpl = state.checklistTemplate;
    var doneCount = 0;
    tmpl.forEach(function (item) {
      var p = state.checklistProgress[schoolId + ":" + item.id];
      if (p && p.status === "Done") doneCount++;
    });

    /* Only the VA assigned to this school can check items off — no
       Owner/Admin/Superadmin override, same as Communication: with that
       restriction in place, a "Done by" label doesn't add anything
       anymore, so it's gone. */
    var checklistSd = state.schoolData[schoolId] || {};
    var canCheckOff = !!checklistSd.vaAssigned && checklistSd.vaAssigned === getStoredIdentity();
    var rows = tmpl.map(function (item) {
      var p = state.checklistProgress[schoolId + ":" + item.id] || { status: "Open" };
      var done = p.status === "Done";
      var pendingUncheck = isPending("checklist-uncheck", schoolId + ":" + item.id);
      var toggleAttrs = canCheckOff
        ? " data-action=\"toggle-checklist\" data-school=\"" + schoolId + "\" data-item=\"" + item.id + "\"" + (pendingUncheck ? " title=\"Click again to confirm unchecking\"" : "")
        : " disabled title=\"Only " + esc(checklistSd.vaAssigned || "the assigned VA") + " can check this off\"";
      return "<div class=\"checklist-item\">" +
        "<button class=\"check-toggle" + (done ? " done" : "") + (pendingUncheck ? " confirming" : "") + "\"" + toggleAttrs + ">" +
        (pendingUncheck ? "?" : (done ? "✓" : "")) + "</button>" +
        "<div class=\"row-main\"><div class=\"row-title\">" + esc(item.description) + "</div></div>" +
        "</div>";
    }).join("");

    var editorHtml = "";
    if (ui.templateEditorOpen) {
      var tmplRows = tmpl.map(function (item, idx) {
        return "<div class=\"template-item-row\"><div class=\"row-main\">" + esc(item.description) + "</div>" +
          "<div class=\"stack-btns\">" +
          "<button" + (idx === 0 ? " disabled" : "") + " data-action=\"move-template-item\" data-id=\"" + item.id + "\" data-dir=\"up\">▲</button>" +
          "<button" + (idx === tmpl.length - 1 ? " disabled" : "") + " data-action=\"move-template-item\" data-id=\"" + item.id + "\" data-dir=\"down\">▼</button>" +
          "</div>" +
          deleteBtn("template-item", item.id, "remove-template-item") + "</div>";
      }).join("");
      editorHtml = "<div class=\"template-card\" style=\"margin-bottom:14px; padding:14px;\">" +
        "<div class=\"checklist-note\">Editing this list changes the checklist for every school — it's one shared, standard template.</div>" +
        tmplRows +
        "<form class=\"add-row-form\" style=\"margin-top:10px;\" data-action=\"add-template-item\">" +
        "<input class=\"text-input\" name=\"description\" placeholder=\"New checklist item\" required>" +

    return "<div class=\"card\"><div class=\"card-head accent-card-head\">" +
      "<div class=\"card-title\">Yearly Checklist" + (tmpl.length > 0 ? " <span class=\"count-chip\" style=\"background:var(--done-soft); color:var(--done);\">" + doneCount + "/" + tmpl.length + "</span>" : "") + "</div>" +
      "<div class=\"card-actions\"><button class=\"link-btn\" data-action=\"toggle-template-editor\">" + (ui.templateEditorOpen ? "Close editor" : "Edit template") + "</button></div>" +
      "</div><div class=\"card-body\">" + editorHtml +

  function emailTrackerCardHtml(schoolId, sd) {
    var open = countNotDone(sd.emailTracker);
    /* Only the VA assigned to this school (plus Owner/Admin/Superadmin)
       can change a status here — everyone else sees it, just disabled. */
    var canChangeStatus = isSuperAdmin() || (!!sd.vaAssigned && sd.vaAssigned === getStoredIdentity());
    var sorted = sortRecords(sd.emailTracker.slice().reverse(), ui.emailSort, function (e) { return e.description; });
    var rows = sorted.map(function (e) {
      /* Only worth calling out when someone other than the assigned VA
         stepped in — an Admin/Owner acting on their behalf, not the
         assigned VA doing their own routine work. */
      var addedByOther = e.addedBy && e.addedBy !== sd.vaAssigned;
      var statusByOther = e.statusChangedBy && e.statusChangedBy !== sd.vaAssigned;
      var signatureHtml = "";
      if (addedByOther) signatureHtml += "<span class=\"va-tag\" style=\"background:" + vaTagColor(e.addedBy) + ";\" title=\"Added by " + esc(e.addedBy) + "\">Added by " + esc(e.addedBy) + "</span>";
      if (statusByOther) signatureHtml += "<span class=\"va-tag\" style=\"background:" + vaTagColor(e.statusChangedBy) + ";\" title=\"Status last changed by " + esc(e.statusChangedBy) + "\">Updated by " + esc(e.statusChangedBy) + "</span>";
      return "<div class=\"row-item\"><div class=\"row-main\"><div class=\"row-title\">" + esc(e.description) + "</div>" + signatureHtml + "</div>" +
        statusControl("email_followup", e.id, e.status, "change-email-status", schoolId, !canChangeStatus) +
        deleteOrRequestControlHtml("email-item", schoolId, e.id, "email \"" + e.description + "\"", deleteBtn("email-item", e.id, "remove-email-item", schoolId)) + "</div>";
    }).join("");
    return "<div class=\"card\" id=\"email-tracker-card\"><div class=\"card-head accent-card-head\"><div class=\"card-title\">Email Tracker" + (open > 0 ? " <span class=\"count-chip\">" + open + "</span>" : "") + "</div>" +
      "<div class=\"card-actions\">" + sortControlHtml(ui.emailSort, "set-email-sort") + "</div></div>" +
      "<div class=\"card-body\">" +
      (canChangeStatus
        ? "<form class=\"add-row-form\" data-action=\"add-email-item\" data-school=\"" + schoolId + "\">" +
          "<input class=\"text-input\" name=\"description\" placeholder=\"What's the email about?\" required>" +
          "<button class=\"btn\" type=\"submit\">Add</button></form>"
        : "<div class=\"checklist-note\">Only the assigned VA (or an Owner/Admin) can add to this school's Email Tracker.</div>") +
      "<div class=\"row-list\">" + (rows || emptyState("Nothing being tracked — add an email that needs a response or a reply.")) + "</div>" +
      "</div></div>";
  }

  function notesCardHtml(scope, schoolId, notes) {
    var draftName = scope === "school" ? "note-" + schoolId : (scope === "suggestion" ? "note-suggestion" : "note-general");
    var title = scope === "school" ? "Notes" : (scope === "suggestion" ? "Suggestions" : "General Notes");
    var placeholder = scope === "suggestion" ? "Suggest something to add or change…" : "Add a note…";
    var buttonLabel = scope === "suggestion" ? "Add suggestion" : "Add note";
    var emptyText = scope === "suggestion" ? "No suggestions yet." : "No notes yet.";
    var list = notes.slice().reverse().map(function (n) {
      return "<div class=\"note-entry\"><div class=\"note-text\">" + esc(n.text) + "</div>" +
        "<div class=\"note-meta\">" + esc(n.author || "Unnamed") + " · " + fmtDateTime(n.createdAt) + "</div></div>";
    }).join("");
    var authorFieldHtml =
      "<div class=\"field-row\" style=\"margin-top:8px;\">" +
      "<input class=\"text-input\" style=\"width:180px;\" list=\"va-list\" name=\"author\" placeholder=\"Your name\" value=\"" + esc(getStoredIdentity()) + "\">" +
      "<button class=\"btn\" type=\"submit\">" + buttonLabel + "</button></div>";
    return "<div class=\"card\"><div class=\"card-head\"><div class=\"card-title\">" + title + "</div></div>" +
      "<div class=\"card-body\">" +
      "<form data-action=\"add-note\" data-scope=\"" + scope + "\" " + (schoolId ? "data-school=\"" + schoolId + "\"" : "") + ">" +
        "<textarea class=\"text-input\" name=\"text\" placeholder=\"" + placeholder + "\" data-draft-key=\"" + draftName + "\">" + esc(loadDraft(draftName)) + "</textarea>" +
        authorFieldHtml +
      "</form>" + vaDatalist() +
      "<div class=\"row-list\" style=\"margin-top:14px;\">" + (list || emptyState(emptyText)) + "</div>" +
      "</div></div>";
  }

  /* ---------- Issues & Concerns ---------- */
  /* No issue type forces any field anymore — every entry starts blank and
     whoever's filling it in clicks "+School", "+Student Name", etc. to add
     only what actually applies. This pool is shared across every type. */
  /* The available +Field options live in state.issueFieldPool now (see
     migrateIssueFieldPool) so the superadmin can edit them — remove
     "School Year", add a brand-new one, etc. — from the Issues page. Only
     the three original built-ins carry a special input type; anything
     added later is a plain text field. */
  function issueFieldPoolByKey() {
    var m = {};
    (state.issueFieldPool || []).forEach(function (f) { m[f.key] = f; });
    return m;
  }
  function issueFieldInputHtml(field, value) {
    value = value || "";
    if (field.type === "school-select") {
      var opts = "<option value=\"\">School…</option>" + state.schools.slice().sort(function (a, b) { return a.name.localeCompare(b.name); }).map(function (s) {
        return "<option value=\"" + s.id + "\"" + (s.id === value ? " selected" : "") + ">" + esc(s.name) + "</option>";
      }).join("");
      return "<select class=\"text-input\" name=\"" + field.key + "\">" + opts + "</select>";
    }
    if (field.type === "date") {
      return "<input class=\"text-input\" type=\"date\" name=\"" + field.key + "\" value=\"" + esc(value) + "\">";
    }
    if (field.type === "correction-select") {
      var catOpts = CORRECTION_CATEGORIES.map(function (c) { return "<option value=\"" + esc(c) + "\"" + (c === value ? " selected" : "") + ">" + esc(c) + "</option>"; }).join("");
      return "<select class=\"text-input\" name=\"" + field.key + "\">" + catOpts + "</select>";
    }
    if (field.type === "text-mono") {
      return "<input class=\"text-input mono\" name=\"" + field.key + "\" placeholder=\"" + esc(field.label) + "\" value=\"" + esc(value) + "\">";
    }
    return "<input class=\"text-input\" name=\"" + field.key + "\" placeholder=\"" + esc(field.label) + "\" value=\"" + esc(value) + "\">";
  }
  function issueFieldRowHtml(key, value) {
    var f = issueFieldPoolByKey()[key];
    if (!f) return "";
    return "<span class=\"issue-field-row\" data-field-key=\"" + key + "\">" +
      "<span class=\"field-mini-label\">" + esc(f.label) + "</span>" + issueFieldInputHtml(f, value) +
      "<button type=\"button\" class=\"link-btn\" onmousedown=\"event.preventDefault();\" onclick=\"csdpRemoveIssueField(this);\" title=\"Remove " + esc(f.label) + "\">×</button>" +
      "</span>";
  }
  /* Renders the whole "pick your own fields" block: already-added fields,
     a row of +Field buttons for whatever's left, and a hidden input that
     always mirrors which keys are currently present — read at submit
     time. Adding/removing a field is done via plain DOM manipulation
     (see csdpAddIssueField/csdpRemoveIssueField below), not a re-render,
     so nothing else being typed in the form gets disturbed. */
  function issueFieldsBlockHtml(enabledKeys, values) {
    enabledKeys = enabledKeys || [];
    values = values || {};
    var rows = enabledKeys.map(function (key) { return issueFieldRowHtml(key, values[key]); }).join("");
    var addButtons = (state.issueFieldPool || []).map(function (f) {
      var used = enabledKeys.indexOf(f.key) !== -1;
      return "<button type=\"button\" class=\"add-field-btn\" data-key=\"" + f.key + "\"" + (used ? " style=\"display:none;\"" : "") +
        " onmousedown=\"event.preventDefault();\" onclick=\"csdpAddIssueField(this);\">+" + esc(f.label) + "</button>";
    }).join("");
    return "<div class=\"issue-fields-wrap\">" +
      "<div class=\"issue-fields-container\">" + rows + "</div>" +
      "<div class=\"issue-fields-add-row\">" + addButtons + "</div>" +
      "<input type=\"hidden\" name=\"enabledFields\" value=\"" + esc(enabledKeys.join(",")) + "\">" +
      "</div>";
  }
  function issueEditFormHtml(it) {
    var editTypeId = ui.editingIssueType || it.type;
    var typeOptsEdit = state.issueTypes.map(function (ty) {
      return "<option value=\"" + ty.id + "\"" + (ty.id === editTypeId ? " selected" : "") + ">" + esc(ty.name) + "</option>";
    }).join("");
    /* Remarks can always be added here, on any type, whether or not it had
       anything filled in when it was first created. */
    var remarksHtml = "<textarea class=\"text-input\" name=\"remarks\" placeholder=\"Remarks\" style=\"margin-top:8px; min-height:56px;\">" + esc(it.remarks) + "</textarea>";
    return "<div class=\"row-item\" style=\"flex-direction:column; align-items:stretch;\">" +
      "<form class=\"add-row-form\" data-action=\"save-issue-edit\" data-id=\"" + it.id + "\" style=\"flex-wrap:wrap;\">" +
      "<span class=\"add-row-form\" style=\"padding:0; margin:0;\">" +
      "<select class=\"text-input\" name=\"type\">" + typeOptsEdit + "</select>" +
      "<input class=\"text-input\" name=\"description\" placeholder=\"What's the issue?\" required style=\"flex:2;\" value=\"" + esc(it.description) + "\">" +
      "<span class=\"field-mini-label\">Reported by " + esc(it.reportedBy || "—") + "</span>" +
      "</span>" +
      "<span style=\"width:100%; margin-top:8px;\">" + issueFieldsBlockHtml(it.enabledFields || [], it) + "</span>" +
      remarksHtml +
      "<div class=\"tmpl-actions\"><button class=\"btn\" type=\"submit\">Save</button>" +
      "<button class=\"btn ghost\" type=\"button\" data-action=\"cancel-edit-issue\">Cancel</button></div>" +
      "</form></div>";
  }

  /* "Fixed by" works the same as a task's self-signature: click + to add
     your own name once you're the one who resolved it, click × (with
     confirm) to take it back off if that was a mistake. */
  function issueFixedByHtml(it) {
    if (it.fixedBy) {
      var pending = isPending("issue-fixedby", it.id);
      return "<span class=\"va-tag\" style=\"background:" + vaTagColor(it.fixedBy) + ";\">" + esc(it.fixedBy) +
        "<button class=\"va-tag-remove" + (pending ? " confirming" : "") + "\" data-action=\"clear-issue-fixed-by\" data-id=\"" + it.id + "\" title=\"" + (pending ? "Click again to confirm" : "Remove") + "\">" + (pending ? "Confirm?" : "×") + "</button></span>";
    }
    var me = getStoredIdentity();
    if (!me) return "";
    return "<button class=\"add-va-btn\" data-action=\"sign-issue-fixed\" data-id=\"" + it.id + "\" title=\"Mark as fixed by you (" + esc(me) + ")\">+</button>";
  }
  /* One table per issue type, columns = every pool field (blank where an
     entry didn't use it) plus Issue/Remarks/Reported by/Status. */
  function issueTypeSectionHtml(title, typeList, statusOptions) {
    var pool = state.issueFieldPool || [];
    var tableCols = 1 + pool.length + 4 + 1;
    var headerCells = "<th>Issue / concern</th>" +
      pool.map(function (f) { return "<th>" + esc(f.label) + "</th>"; }).join("") +
      "<th>Remarks</th><th>Reported by</th><th>Fixed by</th><th>Status</th><th></th>";
    var rowsHtml = typeList.map(function (it) {
      if (ui.editingIssueId === it.id) {
        return "<tr><td colspan=\"" + tableCols + "\">" + issueEditFormHtml(it) + "</td></tr>";
      }
      var enabled = it.enabledFields || [];
      var cells = pool.map(function (f) {
        if (enabled.indexOf(f.key) === -1) return "<td></td>";
        if (f.type === "school-select") {
          var sch = schoolById(it.schoolId);
          return "<td>" + esc(sch ? sch.name : "") + "</td>";
        }
        return "<td class=\"wrap\">" + esc(it[f.key] || "") + "</td>";
      }).join("");
      return "<tr>" +
        "<td class=\"wrap\">" + esc(it.description) + "</td>" +
        cells +
        "<td class=\"wrap\">" + esc(it.remarks || "") + "</td>" +
        "<td>" + esc(it.reportedBy) + "</td>" +
        "<td>" + issueFixedByHtml(it) + "</td>" +
        "<td>" + statusControlOptions(statusOptions, it.id, it.status, "change-issue-status") + "</td>" +
        "<td><button class=\"link-btn\" data-action=\"edit-issue\" data-id=\"" + it.id + "\">Edit</button>" + deleteBtn("issue", it.id, "remove-issue") + "</td>" +
        "</tr>";
    }).join("");
    return "<div class=\"card\"><div class=\"card-head\"><div class=\"card-title\">" + esc(title) +
      (typeList.length ? " <span class=\"count-chip\">" + typeList.length + "</span>" : "") + "</div></div>" +
      "<div class=\"card-body\"><div class=\"table-scroll\">" +
      "<table class=\"data-table\"><thead><tr>" + headerCells + "</tr></thead><tbody>" +
      (rowsHtml || "<tr><td colspan=\"" + tableCols + "\">" + emptyState("No " + title + " entries match these filters.") + "</td></tr>") +
      "</tbody></table></div></div></div>";
  }
  /* Fixed-column table for the Insurance & Date of Birth Correction type —
     every column always shows (no per-row +Field toggles), and most cells
     are click-to-edit in place, the same pattern as the Schools Contact
     Information page, instead of needing to open "Edit" first. */
  var CORRECTION_TABLE_COLS = 12;
  /* Which fields a row can flag as needing correction — drives the Needs
     Correction column and the add-row form. Any combination can be
     checked; what to actually change lives in one shared Correct
     Information note instead of a field-by-field value. */
  var CORRECTION_NEEDS_FIELDS = [
    { key: "Name", needsKey: "needsNameCorrection" },
    { key: "DOB", needsKey: "needsDobCorrection" },
    { key: "Insurance #", needsKey: "needsInsuranceCorrection" }
  ];
  function correctionCellHtml(editing, it, field, placeholder) {
    if (!editing) return "<div class=\"contact-cell-view\">" + contactCellViewHtml(it[field] || "") + "</div>";
    return "<input class=\"contact-cell-input\" data-action-change=\"set-correction-field\" data-id=\"" + it.id + "\" data-field=\"" + field + "\" value=\"" + esc(it[field] || "") + "\"" + (placeholder ? " placeholder=\"" + esc(placeholder) + "\"" : "") + ">";
  }
  /* Locked (not editing): just the field name(s) actually flagged, plain
     text — nothing to click, nothing to accidentally toggle. Unlocked:
     the checkboxes themselves, so any combination can be changed. */
  function needsCorrectionHtml(editing, it) {
    if (!editing) {
      var checked = CORRECTION_NEEDS_FIELDS.filter(function (f) { return it[f.needsKey]; }).map(function (f) { return f.key; });
      if (!checked.length) return "<div class=\"contact-cell-view\" style=\"color:var(--ink-faint);\">—</div>";
      return "<div class=\"contact-cell-view\">" + esc(checked.join(", ")) + "</div>";
    }
    return CORRECTION_NEEDS_FIELDS.map(function (f) {
      return "<label style=\"display:flex; align-items:center; gap:4px; white-space:nowrap;\">" +
        "<input type=\"checkbox\" data-action-change=\"set-correction-checkbox\" data-id=\"" + it.id + "\" data-field=\"" + f.needsKey + "\"" + (it[f.needsKey] ? " checked" : "") + "> " + esc(f.key) + "</label>";
    }).join("");
  }
  function correctionTypeSectionHtml(ty, typeList) {
    var headerCells = "<th>Student Name</th><th>School</th><th>Grade</th>" +
      "<th>Date of Birth</th><th>Insurance #</th><th>Needs Correction</th><th>Correct Information</th>" +
      "<th>Note</th><th>Reported by</th><th>Verified</th><th>Status</th><th></th>";
    var sortedSchools = state.schools.slice().sort(function (a, b) { return a.name.localeCompare(b.name); });
    var rowsHtml = typeList.map(function (it) {
      /* Unlocked one row at a time — editing one entry never risks typing
         into a different one by mistake. */
      var editing = ui.editingCorrectionId === it.id;
      var schoolCell;
      if (editing) {
        var schoolOpts = "<option value=\"\">School…</option>" + sortedSchools.map(function (s) {
          return "<option value=\"" + s.id + "\"" + (s.id === it.schoolId ? " selected" : "") + ">" + esc(s.name) + "</option>";
        }).join("");
        schoolCell = "<select class=\"contact-cell-input\" data-action-change=\"set-correction-field\" data-id=\"" + it.id + "\" data-field=\"schoolId\">" + schoolOpts + "</select>";
      } else {
        var sch = schoolById(it.schoolId);
        schoolCell = "<div class=\"contact-cell-view\">" + esc(sch ? sch.name : "") + "</div>";
      }
      var editBtn = "<button class=\"link-btn\" data-action=\"" + (editing ? "done-edit-correction-row" : "edit-correction-row") + "\" data-id=\"" + it.id + "\">" + (editing ? "Done" : "Edit") + "</button>";
      return "<tr>" +
        "<td>" + correctionCellHtml(editing, it, "studentName") + "</td>" +
        "<td>" + schoolCell + "</td>" +
        "<td>" + correctionCellHtml(editing, it, "grade") + "</td>" +
        "<td>" + correctionCellHtml(editing, it, "dob", "MM/DD/YYYY") + "</td>" +
        "<td>" + correctionCellHtml(editing, it, "insuranceNumber") + "</td>" +
        "<td>" + needsCorrectionHtml(editing, it) + "</td>" +
        "<td>" + correctionCellHtml(editing, it, "correctInfo", "Correct information") + "</td>" +
        "<td>" + (editing ? "<textarea class=\"contact-cell-input\" rows=\"" + contactTextareaRows(it.remarks) + "\" data-action-change=\"set-correction-field\" data-id=\"" + it.id + "\" data-field=\"remarks\">" + esc(it.remarks || "") + "</textarea>" : "<div class=\"contact-cell-view\">" + contactCellViewHtml(it.remarks || "") + "</div>") + "</td>" +
        "<td>" + esc(it.reportedBy || "") + "</td>" +
        "<td style=\"text-align:center;\"><input type=\"checkbox\" data-action-change=\"set-correction-verified\" data-id=\"" + it.id + "\"" + (it.verified ? " checked" : "") + "></td>" +
        "<td>" + statusControlOptions(ty.statusOptions, it.id, it.status, "change-issue-status") + "</td>" +
        "<td>" + editBtn + deleteBtn("issue", it.id, "remove-issue") + "</td>" +
        "</tr>";
    }).join("");
    return "<div class=\"card\"><div class=\"card-head\"><div class=\"card-title\">" + esc(ty.name) +
      (typeList.length ? " <span class=\"count-chip\">" + typeList.length + "</span>" : "") + "</div></div>" +
      "<div class=\"card-body\"><div class=\"table-scroll\">" +
      "<table class=\"data-table\"><thead><tr>" + headerCells + "</tr></thead><tbody>" +
      (rowsHtml || "<tr><td colspan=\"" + CORRECTION_TABLE_COLS + "\">" + emptyState("No " + ty.name + " entries match these filters.") + "</td></tr>") +
      "</tbody></table></div>" +
      "</div></div>";
  }
  /* Software Issue's own simple table — just the issue, a note, who
     reported it, and status. No Fixed By (the team reports these, they
     don't fix them) and none of the dynamic +Field pool. Issue/Note are
     locked behind the row's own Edit button, same reasoning as everywhere
     else this session: unlocking one row never risks another. */
  function simpleIssueSectionHtml(ty, typeList) {
    var headerCells = "<th>Issue / Concern</th><th>Note</th><th>Reported by</th><th>Status</th><th></th>";
    var rowsHtml = typeList.map(function (it) {
      var editing = ui.editingSimpleIssueId === it.id;
      var descCell = editing
        ? "<textarea class=\"contact-cell-input\" rows=\"" + contactTextareaRows(it.description) + "\" data-action-change=\"set-simple-issue-field\" data-id=\"" + it.id + "\" data-field=\"description\">" + esc(it.description || "") + "</textarea>"
        : "<div class=\"contact-cell-view\">" + contactCellViewHtml(it.description || "") + "</div>";
      var noteCell = editing
        ? "<textarea class=\"contact-cell-input\" rows=\"" + contactTextareaRows(it.remarks) + "\" data-action-change=\"set-simple-issue-field\" data-id=\"" + it.id + "\" data-field=\"remarks\">" + esc(it.remarks || "") + "</textarea>"
        : "<div class=\"contact-cell-view\">" + contactCellViewHtml(it.remarks || "") + "</div>";
      var editBtn = "<button class=\"link-btn\" data-action=\"" + (editing ? "done-edit-simple-issue" : "edit-simple-issue") + "\" data-id=\"" + it.id + "\">" + (editing ? "Done" : "Edit") + "</button>";
      return "<tr>" +
        "<td>" + descCell + "</td>" +
        "<td>" + noteCell + "</td>" +
        "<td>" + esc(it.reportedBy || "") + "</td>" +
        "<td>" + statusControlOptions(ty.statusOptions, it.id, it.status, "change-issue-status") + "</td>" +
        "<td>" + editBtn + deleteBtn("issue", it.id, "remove-issue") + "</td>" +
        "</tr>";
    }).join("");
    return "<div class=\"card\"><div class=\"card-head\"><div class=\"card-title\">" + esc(ty.name) +
      (typeList.length ? " <span class=\"count-chip\">" + typeList.length + "</span>" : "") + "</div></div>" +
      "<div class=\"card-body\"><div class=\"table-scroll\">" +
      "<table class=\"data-table\"><thead><tr>" + headerCells + "</tr></thead><tbody>" +
      (rowsHtml || "<tr><td colspan=\"5\">" + emptyState("No " + ty.name + " entries match these filters.") + "</td></tr>") +
      "</tbody></table></div>" +
      "</div></div>";
  }
  /* Matched by name rather than a stored flag — Charting Questions is a
     team-added type (its id is a random uid, not a fixed built-in one
     like software_issue), and there's no rename UI for issue types, so
     the name is a stable enough hook. */
  function isChartingQuestionsType(ty) {
    return !!ty && String(ty.name || "").trim().toLowerCase() === "charting questions";
  }
  /* Charting Questions' own table — a link to the student's record, the
     question itself, who reported it, status, and a note + signature from
     whoever answers/fixes it (reusing the same self-sign Fixed By
     mechanism already used elsewhere, including its auto-resolve). */
  function chartingLinkCellHtml(editing, it) {
    if (editing) {
      return "<input class=\"contact-cell-input\" data-action-change=\"set-charting-field\" data-id=\"" + it.id + "\" data-field=\"studentRecordLink\" placeholder=\"Link to student record\" value=\"" + esc(it.studentRecordLink || "") + "\">";
    }
    var link = String(it.studentRecordLink || "").trim();
    if (!link) return "<div class=\"contact-cell-view\" style=\"color:var(--ink-faint);\">—</div>";
    var href = /^https?:\/\//i.test(link) ? link : "https://" + link;
    return "<div class=\"contact-cell-view\"><a href=\"" + esc(href) + "\" target=\"_blank\" rel=\"noopener noreferrer\">" + esc(link) + "</a></div>";
  }
  function chartingSectionHtml(ty, typeList) {
    var headerCells = "<th>Student Record</th><th>Question / Concern</th><th>Reported by</th><th>Status</th><th>Note</th><th>Fixed by</th><th></th>";
    var rowsHtml = typeList.map(function (it) {
      var editing = ui.editingChartingId === it.id;
      var questionCell = editing
        ? "<textarea class=\"contact-cell-input\" rows=\"" + contactTextareaRows(it.description) + "\" data-action-change=\"set-charting-field\" data-id=\"" + it.id + "\" data-field=\"description\">" + esc(it.description || "") + "</textarea>"
        : "<div class=\"contact-cell-view\">" + contactCellViewHtml(it.description || "") + "</div>";

  function noteEditorFormHtml(action, id, scope, initialHtml, initialColor, isEditing, initialUrgency) {

    /* Only the "add a new note" form drafts as you type — editing an
